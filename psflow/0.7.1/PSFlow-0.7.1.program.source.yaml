$schema: quicker.program.source.v1
variables:
  - key: root
    varType: text
  - key: uiProbe
    varType: text
  - key: panelWindow
    varType: text
  - key: legacyRoot
    varType: text
  - key: needsUserMigration
    varType: boolean
  - key: maintenance
    varType: text
    default: ''
  - key: rollbackStateScript
    varType: text
  - key: migrationRevision
    varType: text
  - key: installRunning
    varType: boolean
    default: false
  - key: installDone
    varType: boolean
    default: false
  - key: installProgress
    varType: text
    default: '{"phase":"","detail":"","percent":-1}'
  - key: webViewInstalled
    varType: boolean
    default: false
  - key: needsSetup
    varType: boolean
  - key: setupHtml
    varType: text
  - key: setupChoice
    varType: text
    default: ''
  - key: setupExpected
    varType: text
  - key: installMode
    varType: text
    default: ''
  - key: setupRequestId
    varType: text
    default: ''
  - key: installerRequest
    varType: text
    default: ''
  - key: installerSuccess
    varType: boolean
  - key: installerOutput
    varType: text
    default: ''
  - key: installerActionTitle
    varType: text
    default: ''
steps:
  - if:
      condition: '$=({quicker_in_param} ?? "").StartsWith("hd:")'
      then:
        - subProgram: PsFlowManagedDownload
          inputs:
            request: '$={quicker_in_param}.Substring(3)'
          outputs:
            response: uiProbe
        - stop:
      else:
        - comment: '兼容旧版分支'
  - if:
      condition: '$=new [] {"probe-managed-window","hide-managed-window","show-managed-window"}.Contains({quicker_in_param})'
      then:
        - subProgram: PsFlowManagedWindow
          inputs:
            operation: '$={quicker_in_param} == "probe-managed-window" ? "probe" : {quicker_in_param} == "hide-managed-window" ? "hide" : "show"'
          outputs:
            response: uiProbe
        - stop:
      else:
        - comment: '兼容旧版分支'
  - if:
      condition: '$=new [] {"probe-window","probe-state","collapse-window","expand-window","pin-window","auto-window"}.Contains({quicker_in_param})'
      then:
        - subProgram: PsFlowWindow
          inputs:
            operation: '$={quicker_in_param} == "collapse-window" ? "collapse" : {quicker_in_param} == "expand-window" ? "expand" : {quicker_in_param} == "pin-window" ? "toggle-topmost" : {quicker_in_param} == "auto-window" ? "toggle-autocollapse" : {quicker_in_param} == "probe-state" ? "probe-state" : "probe"'
          outputs:
            response: uiProbe
        - stop:
      else:
        - comment: '兼容旧版分支'
  - if:
      condition: '$={quicker_in_param} == "connect" || {quicker_in_param} == "probe-ui"'
      then:
        - if:
            condition: '$={quicker_in_param} == "connect"'
            then:
              - webview2:
                  type: ExecuteScript
                  autoCloseKey: '='
                  script: "document.getElementById('connect').click(); 'connecting'"
                  outputs:
                    scriptResult: uiProbe
            else:
              - webview2:
                  type: ExecuteScript
                  autoCloseKey: '='
                  script: "JSON.stringify({status:document.getElementById('status-text').textContent,message:document.getElementById('message').textContent,presets:document.querySelectorAll('[data-prompt]').length,capsule:document.body.classList.contains('is-capsule'),pin:document.getElementById('window-pin').getAttribute('aria-pressed'),autoCollapse:document.getElementById('window-auto-collapse').getAttribute('aria-pressed'),width:innerWidth,height:innerHeight,connectDisabled:document.getElementById('connect').disabled})"
                  outputs:
                    scriptResult: uiProbe
        - stop:
      else:
        - comment: '兼容旧版分支'
  - webview2:
      type: CheckInstalled
      outputs:
        isInstalled: webViewInstalled
  - if:
      condition: '$=!{webViewInstalled}'
      then:
        - stop:
            method: forcestop
            isError: true
            showMessage: '未安装 Microsoft Edge WebView2 运行时。请先安装 WebView2 Evergreen Runtime：https://developer.microsoft.com/microsoft-edge/webview2/，完成后重新运行 PS Flow。'
      else:
        - comment: '兼容旧版分支'
  - if:
      condition: '$=string.IsNullOrEmpty({quicker_in_param}) || {quicker_in_param} == "setup"'
      then:
        - csscript:
            mode: normal_roslyn
            script: |-
              public static object Exec(Quicker.Public.IStepContext context)
              {
                  var data = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
                  var setupFile = System.IO.Path.Combine(data, "setup.json");
                  var requested = ((string)(context.GetVarValue("quicker_in_param") ?? "")) ?? "";
                  context.SetVarValue("needsSetup", false);
                  context.SetVarValue("setupChoice", "");
                  context.SetVarValue("installMode", "");
                  var existing = System.IO.File.Exists(setupFile) ? System.IO.File.ReadAllText(setupFile) : "";
                  if (existing.Length > 8192) throw new System.Exception("首次设置文件过大，原文件已保留，请检查后再启动。");
                  var selected = "browser";
                  if (existing.Length > 0) {
                      Newtonsoft.Json.Linq.JObject state = null;
                      try { state = Newtonsoft.Json.Linq.JObject.Parse(existing); }
                      catch { throw new System.Exception("首次设置文件无效，原设置已保留。"); }
                      if ((int?)state["schemaVersion"] != 1) throw new System.Exception("首次设置文件无效，原设置已保留。");
                      selected = (string)state["mode"] ?? "browser";
                      if (selected != "browser" && selected != "local") throw new System.Exception("首次设置文件无效，原设置已保留。");
                      var completed = (bool?)state["completed"] == true;
                      var runtimePresent = false;
                      try {
                          var curPointer = System.IO.Path.Combine(data, "apps", "current");
                          if (System.IO.File.Exists(curPointer)) {
                              var cName = (System.IO.File.ReadAllText(curPointer) ?? "").Trim();
                              if (!string.IsNullOrEmpty(cName)) {
                                  var bFile = System.IO.Path.Combine(data, "apps", cName, "runtime-binding.json");
                                  if (System.IO.File.Exists(bFile)) {
                                      var b = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(bFile));
                                      var dir = (string)b["directory"];
                                      if (!string.IsNullOrEmpty(dir)) {
                                          var candidate = System.IO.Path.Combine(data, "runtime", "portable", dir, "node.exe");
                                          if (System.IO.File.Exists(candidate)) runtimePresent = true;
                                      }
                                  }
                              }
                          }
                          if (!runtimePresent) {
                              var portDir = System.IO.Path.Combine(data, "runtime", "portable");
                              if (System.IO.Directory.Exists(portDir)) {
                                  foreach (var sub in System.IO.Directory.GetDirectories(portDir)) {
                                      if (System.IO.File.Exists(System.IO.Path.Combine(sub, "node.exe"))) {
                                          runtimePresent = true;
                                          break;
                                      }
                                  }
                              }
                          }
                          if (!runtimePresent) {
                              if (System.IO.File.Exists(System.IO.Path.Combine(data, "runtime", "node.exe"))) runtimePresent = true;
                          }
                      } catch { }
                      if (completed && runtimePresent && requested != "setup") return true;
                  } else {
                      var modeFile = System.IO.Path.Combine(data, "mode.json");
                      if (System.IO.File.Exists(modeFile)) {
                          var mode = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(modeFile));
                          if ((string)mode["mode"] == "local") selected = "local";
                      }
                  }
                  context.SetVarValue("needsSetup", true);
                  context.SetVarValue("installMode", selected);
                  context.SetVarValue("setupExpected", existing);
                  // Bind this launch to one fresh request id; the downloader echoes it back and
                  // the verify step refuses any other envelope (stale window, concurrent run).
                  var requestId = "req-firstrun-local-" + System.Guid.NewGuid().ToString("N");
                  context.SetVarValue("setupRequestId", requestId);
                  context.SetVarValue("installerRequest", new Newtonsoft.Json.Linq.JObject {
                      ["protocolVersion"] = 1,
                      ["requestId"] = requestId,
                      ["expectedBuildId"] = "bb80ed7529230b01",
                      ["op"] = "install",
                      ["mode"] = selected
                  }.ToString(Newtonsoft.Json.Formatting.None));
                  context.SetVarValue("setupHtml", System.Text.Encoding.UTF8.GetString(System.Convert.FromBase64String("")));
                  return true;
              }
            runOnUiThread: background
        - if:
            condition: '$={needsSetup}'
            then:
              - webview2:
                  type: OpenUrlAndWaitClose
                  url:
                    var: setupHtml
                  title: PS Flow · 首次设置
                  autoCloseKey: psflow-first-run
                  defaultBgColor: '#26282b'
                  winLocation: CenterScreen
                  winSize: '460,660'
              - if:
                  condition: '$=string.IsNullOrEmpty({setupChoice})'
                  then:
                    - stop:
                  else:
                    - comment: '兼容旧版分支'
              - if:
                  condition: '$={setupChoice} == "download-local" || {setupChoice} == "browser-direct"'
                  then:
                    - runAction:
                        type: StartAction
                        # runAction supports the action-library identity across installations.
                        actionId: 'dcde4403-c6f2-4d80-8231-c073e2504a71'
                        inputParam:
                          var: installerRequest
                        wait: true
                        stopIfFail: false
                        outputs:
                          isSuccess: installerSuccess
                          output: installerOutput
                          actionTitle: installerActionTitle
                    - csscript:
                        mode: normal_roslyn
                        script: |-
                          public static object Exec(Quicker.Public.IStepContext context)
                          {
                              var success = ((bool)(context.GetVarValue("installerSuccess") ?? (object)false));
                              var output = (((string)(context.GetVarValue("installerOutput") ?? "")) ?? "").Trim();
                              var title = (((string)(context.GetVarValue("installerActionTitle") ?? "")) ?? "").Trim();
                              var share = "https://getquicker.net/sharedaction?code=dcde4403-c6f2-4d80-8231-c073e2504a71";
                              var expectedBuildId = "bb80ed7529230b01";
                              var requestId = (((string)(context.GetVarValue("setupRequestId") ?? "")) ?? "").Trim();
                              if (requestId.Length != 51 || !requestId.StartsWith("req-firstrun-local-")) {
                                  throw new System.Exception("本次首次设置缺少请求标识，未执行安装。请关闭窗口后重新打开助手。");
                              }
                              System.Guid requestGuid;
                              if (!System.Guid.TryParseExact(requestId.Substring("req-firstrun-local-".Length), "N", out requestGuid)) {
                                  throw new System.Exception("本次首次设置请求标识无效，未执行安装。请关闭窗口后重新打开助手。");
                              }
                              Newtonsoft.Json.Linq.JObject res = null;
                              if (!string.IsNullOrEmpty(output)) {
                                  try {
                                      res = Newtonsoft.Json.Linq.JObject.Parse(output);
                                  } catch {
                                      throw new System.Exception("组件下载动作返回的结果格式无效。请检查下载动作是否为最新版本。\n网页地址：" + share);
                                  }
                              }
                              if ((bool?)res?["cancelled"] == true) {
                                  context.SetVarValue("setupChoice", "");
                                  context.SetVarValue("setupRequestId", "");
                                  return true;
                              }
                              if (!success) {
                                  if (string.IsNullOrEmpty(title)) {
                                      throw new System.Exception("未找到组件下载动作。请从下载动作网页安装后重试；原设置和记录已保留。\n网页地址：" + share);
                                  }
                                  throw new System.Exception("组件下载动作“" + title + "”执行失败，没有返回可用结果。请更新下载动作后重试；原设置和记录已保留。\n网页地址：" + share);
                              }
                              if (res == null) {
                                  throw new System.Exception("组件下载动作已运行，但没有返回执行结果。请确认下载已完成，或从网页更新下载动作后重试：\n" + share);
                              }
                              if ((bool?)res["ok"] != true) {
                                  var err = (string)res["error"] ?? "运行组件准备未完成。";
                                  throw new System.Exception("组件准备失败：" + err);
                              }
                              if ((string)res["productId"] != "PSFlowBridge" || (int?)res["protocolVersion"] != 1 ||
                                  (string)res["operation"] != "install" ||
                                  (string)res["effectiveMode"] != ((string)context.GetVarValue("installMode")) ||
                                  (string)res["buildId"] != expectedBuildId) {
                                  throw new System.Exception("组件准备动作版本不兼容，请从网页更新下载动作：\n" + share);
                              }
                              if ((string)res["requestId"] != requestId) {
                                  throw new System.Exception("组件准备结果与本次设置请求不匹配，可能来自其他窗口或旧任务，未保存设置。请重新打开助手。");
                              }
                              return true;
                          }
                        runOnUiThread: background
                  else:
                    - comment: '兼容旧版分支'
              - if:
                  condition: '$=string.IsNullOrEmpty({setupChoice})'
                  then:
                    - stop:
                  else:
                    - comment: '兼容旧版分支'
            else:
              - comment: '兼容旧版分支'
      else:
        - comment: '兼容旧版分支'
  - assign:
      input: '$=new [] {"repair-runtime","rollback-app","install-local"}.Contains({quicker_in_param} ?? "") ? {quicker_in_param} : ""'
      >>: maintenance
  - csscript:
      mode: normal_roslyn
      script: |-
        public static object Exec(Quicker.Public.IStepContext context)
        {
            context.SetVarValue("needsUserMigration",false);
            context.SetVarValue("migrationRevision","");
            var data=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData),"PSFlowBridge");
            var stateFile=System.IO.Path.Combine(data,"user-state.json");
            {
              var pointer=System.IO.Path.Combine(data,"apps","current");
              if(System.IO.File.Exists(pointer)) {
                var build=System.IO.File.ReadAllText(pointer).Trim();
                if(!System.Text.RegularExpressions.Regex.IsMatch(build,"^[0-9a-f]{16}(?:-repair-[0-9a-f]+)?$"))throw new System.Exception("原版本位置无效，未迁移用户设置。");
                var oldRoot=System.IO.Path.Combine(data,"apps",build,"PSFlowBridge-package");
                var oldPanel=System.IO.Path.Combine(oldRoot,"action-ui","panel.html");
                if(System.IO.File.Exists(oldPanel)&&(!System.IO.File.Exists(stateFile)||!System.IO.File.ReadAllText(oldPanel).Contains("user-state-client-js:begin"))) {
                  if(System.IO.File.Exists(stateFile)) {
                    var state=Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(stateFile));
                    var revision=(long?)state["revision"]??0;
                    if((int?)state["schemaVersion"]!=1||revision<1)throw new System.Exception("用户设置格式无效，未覆盖数据。");
                    context.SetVarValue("migrationRevision",revision.ToString(System.Globalization.CultureInfo.InvariantCulture));
                  }
                  context.SetVarValue("legacyRoot",oldRoot);
                  context.SetVarValue("needsUserMigration",true);
                }
              }
            }
            return true;
        }
      runOnUiThread: background
  - if:
      condition: '$={needsUserMigration}'
      then:
        - webview2:
            type: OpenAndWaitLoad
            url: '$=Path.Combine({legacyRoot}, "action-ui", "panel.html")'
            title: PS Flow 侧边助手
            autoCloseKey: '='
            modeForExists: SkipThisStep
            defaultBgColor: '#26282b'
            winLocation: RightCenter
            winSize: '360,680'
        - webview2:
            type: ExecuteScript
            autoCloseKey: '='
            script: "(()=>{const p=document.getElementById('prompt');if(p)p.dispatchEvent(new Event('blur'));return JSON.stringify({url:location.href,values:Object.fromEntries(['psflow.action-ui.v1','psflow.text-draft.v1','psflow.generation-kind','psflow_drafts','psflow.personal-presets.v1','psflow.personal-presets.v2'].map(k=>[k,localStorage.getItem(k)]).filter(p=>p[1]!==null))});})()"
            outputs:
              scriptResult: uiProbe
        - csscript:
            mode: normal_roslyn
            script: |-
              public static object Exec(Quicker.Public.IStepContext context)
              {
                  var raw=((string)context.GetVarValue("uiProbe"));
                  var snapshot=Newtonsoft.Json.Linq.JObject.Parse(raw);
                  var expectedPanel=System.IO.Path.GetFullPath(System.IO.Path.Combine(((string)context.GetVarValue("legacyRoot")),"action-ui","panel.html"));
                  System.Uri oldPanel;
                  if(!System.Uri.TryCreate((string)snapshot["url"],System.UriKind.Absolute,out oldPanel)||!oldPanel.IsFile||!string.Equals(System.IO.Path.GetFullPath(oldPanel.LocalPath),expectedPanel,System.StringComparison.OrdinalIgnoreCase))throw new System.Exception("原面板位置不匹配，未迁移或覆盖用户数据。");
                  var values=snapshot["values"] as Newtonsoft.Json.Linq.JObject;
                  if(values==null)throw new System.Exception("原面板未返回有效设置，未覆盖数据。");
                  var keys=new System.Collections.Generic.HashSet<string>(new[]{"psflow.action-ui.v1","psflow.text-draft.v1","psflow.generation-kind","psflow_drafts","psflow.personal-presets.v1","psflow.personal-presets.v2"});
                  foreach(var item in values.Properties())if(!keys.Contains(item.Name)||item.Value.Type!=Newtonsoft.Json.Linq.JTokenType.String)throw new System.Exception("原用户设置格式无效，未覆盖数据。");
                  if(System.Text.Encoding.UTF8.GetByteCount(values.ToString(Newtonsoft.Json.Formatting.None))>4*1024*1024)throw new System.Exception("原用户设置过大，未覆盖数据。");
                  var data=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData),"PSFlowBridge");
                  var file=System.IO.Path.Combine(data,"user-state.json");
                  using(var migrationLock=new System.Threading.Mutex(false,"Local\\PSFlowUserStateMigration")) {
                    var acquired=false;
                    try {
                      try{acquired=migrationLock.WaitOne(5000);}catch(System.Threading.AbandonedMutexException){acquired=true;}
                      if(!acquired)throw new System.Exception("用户设置迁移正在进行，请稍后重开助手。");
                      var expected=((string)context.GetVarValue("migrationRevision"))??"";
                      var exists=System.IO.File.Exists(file);
                      if(exists&&expected.Length==0)return true;
                      long revision=0;
                      if(expected.Length>0) {
                        if(!exists)throw new System.Exception("用户设置已变化，未覆盖数据，请重新打开助手。");
                        var currentRaw=System.IO.File.ReadAllText(file);
                        if(System.Text.Encoding.UTF8.GetByteCount(currentRaw)>4*1024*1024+8192)throw new System.Exception("用户设置过大，未覆盖原文件。");
                        var current=Newtonsoft.Json.Linq.JObject.Parse(currentRaw);
                        revision=(long?)current["revision"]??0;
                        if((int?)current["schemaVersion"]!=1||revision.ToString(System.Globalization.CultureInfo.InvariantCulture)!=expected)throw new System.Exception("另一个窗口已更新设置，未覆盖数据，请重新打开助手。");
                        var currentValues=current["values"] as Newtonsoft.Json.Linq.JObject;
                        if(currentValues==null)throw new System.Exception("用户设置损坏，未覆盖原文件。");
                        foreach(var item in currentValues.Properties())if(!keys.Contains(item.Name)||item.Value.Type!=Newtonsoft.Json.Linq.JTokenType.String)throw new System.Exception("用户设置损坏，未覆盖原文件。");
                      }
                  var encoded=new System.Text.UTF8Encoding(false).GetBytes(new Newtonsoft.Json.Linq.JObject(new Newtonsoft.Json.Linq.JProperty("schemaVersion",1),new Newtonsoft.Json.Linq.JProperty("revision",revision+1),new Newtonsoft.Json.Linq.JProperty("values",values)).ToString(Newtonsoft.Json.Formatting.Indented));
                    var backup=file+".legacy.json";
                    if(!System.IO.File.Exists(backup))using(var stream=new System.IO.FileStream(backup,System.IO.FileMode.CreateNew,System.IO.FileAccess.Write,System.IO.FileShare.Read))stream.Write(encoded,0,encoded.Length);
                    var temporary=file+"."+System.Guid.NewGuid().ToString("N")+".tmp";
                    try {System.IO.File.WriteAllBytes(temporary,encoded);if(exists)System.IO.File.Replace(temporary,file,file+".before-legacy-"+System.Guid.NewGuid().ToString("N")+".json");else try{System.IO.File.Move(temporary,file);}catch(System.IO.IOException){if(!System.IO.File.Exists(file))throw;}}
                    finally {if(System.IO.File.Exists(temporary))System.IO.File.Delete(temporary);}
                    } finally {if(acquired)migrationLock.ReleaseMutex();}
                  }
                  return true;
              }
            runOnUiThread: background
        - webview2:
            type: Close
            autoCloseKey: '='
      else:
        - comment: '兼容旧版分支'
  - notify:
      type: Info
      msg: ⚡ PS Flow 侧边助手启动中…
  - webview2:
      type: Close
      autoCloseKey: psfb-install-progress
  - csscript:
      mode: normal_roslyn
      script: |-
        public static object Exec(Quicker.Public.IStepContext context)
        {
            var stateRoot = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
            var script = System.Text.Encoding.UTF8.GetString(System.Convert.FromBase64String(""));
            var expectedScript = "1688673baa425ab07f16bfaefb53b54daae60a0cfccc1673cff8b0a02b2d5448";
            var installerDir = System.IO.Path.Combine(stateRoot,"installers",expectedScript.Substring(0,16));
            System.IO.Directory.CreateDirectory(installerDir);
            var installer = System.IO.Path.Combine(installerDir,"Install.ps1");
            System.Func<string,string> hash = file => {
                using(var algorithm=System.Security.Cryptography.SHA256.Create())
                using(var stream=System.IO.File.OpenRead(file))
                    return System.BitConverter.ToString(algorithm.ComputeHash(stream)).Replace("-","").ToLowerInvariant();
            };
            using(var mutex=new System.Threading.Mutex(false,"Local\\PSFlowBridgeInstallerSource")) {
                var acquired=false;
                try {
                    try{acquired=mutex.WaitOne(10000);}catch(System.Threading.AbandonedMutexException){acquired=true;}
                    if(!acquired)throw new System.Exception("运行入口正在准备，请稍后重开。");
                    if(!System.IO.File.Exists(installer)||hash(installer)!=expectedScript) {
                        var temporary=installer+"."+System.Guid.NewGuid().ToString("N")+".tmp";
                        try {
                            System.IO.File.WriteAllText(temporary,script,new System.Text.UTF8Encoding(false));
                            if(hash(temporary)!=expectedScript)throw new System.Exception("安装入口校验失败，未启动。");
                            if(System.IO.File.Exists(installer))System.IO.File.Replace(temporary,installer,null);
                            else System.IO.File.Move(temporary,installer);
                        } finally {if(System.IO.File.Exists(temporary))System.IO.File.Delete(temporary);}
                    }
                } finally {if(acquired)mutex.ReleaseMutex();}
            }
            // Clear stale terminal flags before validation can throw, so an invalid op/mode
            // never leaves the panel stuck on "running" or inheriting an old "done".
            context.SetVarValue("installRunning",false);
            context.SetVarValue("installDone",false);
            var operation="";
            try { operation=((string)(context.GetVarValue("op") ?? ""))??""; } catch { }
            if(string.IsNullOrEmpty(operation)){try{operation=((string)(context.GetVarValue("maintenance") ?? ""))??"";}catch{}}
            if(operation=="install")operation="";
            var validOps=new System.Collections.Generic.HashSet<string>{
                "","inspect","install-local","repair-runtime","rollback-app","clear-cache","remove-local","uninstall-runtime","delete-user-data","remove-components"
            };
            if(!validOps.Contains(operation))throw new System.Exception("维护操作无效："+operation);
            var installMode="";
            try { installMode=((string)(context.GetVarValue("installMode") ?? ""))??""; } catch { }
            if(string.IsNullOrEmpty(installMode)){try{installMode=((string)(context.GetVarValue("mode") ?? ""))??"";}catch{}}
            if(installMode!=""&&installMode!="browser"&&installMode!="local")throw new System.Exception("运行方式无效。");
            var expectedBuildId="";
            try { expectedBuildId=((string)(context.GetVarValue("expectedBuildId") ?? ""))??""; } catch { }
            var requestId="";
            try { requestId=((string)(context.GetVarValue("requestId") ?? ""))??""; } catch { }
            var confirmDelete=false;
            try { confirmDelete=((bool)(context.GetVarValue("confirmDeleteData") ?? false)); } catch { }
            var statusFile=System.IO.Path.Combine(System.IO.Path.GetTempPath(),"psfb-distribution-"+System.Guid.NewGuid().ToString("N")+".json");
            var outerProgressFile=System.Environment.GetEnvironmentVariable("PSFB_INSTALL_PROGRESS_FILE");
            var progressFile=!string.IsNullOrEmpty(outerProgressFile)?outerProgressFile:System.IO.Path.Combine(System.IO.Path.GetTempPath(),"psfb-install-progress-"+System.Guid.NewGuid().ToString("N")+".json");
            var isProgressOwner=string.IsNullOrEmpty(outerProgressFile) && (operation==""||operation=="install-local"||operation=="repair-runtime"||operation=="rollback-app");
            var initProgress = new Newtonsoft.Json.Linq.JObject();
            initProgress["phase"] = "prepare";
            initProgress["detail"] = "正在准备运行环境";
            initProgress["percent"] = 0;
            context.SetVarValue("installProgress",initProgress.ToString(Newtonsoft.Json.Formatting.None));
            System.Windows.Window progressWin = null;
            System.Windows.Threading.Dispatcher progressDispatcher = null;
            System.Windows.Controls.ProgressBar pBar = null;
            System.Windows.Controls.TextBlock pMsg = null;
            System.Windows.Controls.TextBlock pPct = null;
            System.Threading.Thread progressUiThread = null;
            bool progressFinished = false;
            if (isProgressOwner) {
                var readyEvt = new System.Threading.ManualResetEventSlim(false);
                progressUiThread = new System.Threading.Thread(() => {
                    try {
                        if (progressFinished) { readyEvt.Set(); return; }
                        var w = new System.Windows.Window {
                            Title = "PS Flow · 安装进度",
                            Width = 360,
                            Height = 220,
                            WindowStartupLocation = System.Windows.WindowStartupLocation.CenterScreen,
                            ResizeMode = System.Windows.ResizeMode.NoResize,
                            Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(38, 40, 43)),
                            ShowActivated = false,
                            Visibility = System.Windows.Visibility.Hidden
                        };
                        var stack = new System.Windows.Controls.StackPanel { Margin = new System.Windows.Thickness(24, 22, 24, 22) };
                        var title = new System.Windows.Controls.TextBlock {
                            Text = "PS Flow 正在准备运行组件",
                            FontSize = 14,
                            FontWeight = System.Windows.FontWeights.SemiBold,
                            Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(230, 230, 230)),
                            Margin = new System.Windows.Thickness(0, 0, 0, 14)
                        };
                        pBar = new System.Windows.Controls.ProgressBar {
                            Height = 8,
                            IsIndeterminate = true,
                            Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(58, 61, 66)),
                            Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(91, 157, 255))
                        };
                        var row = new System.Windows.Controls.Grid { Margin = new System.Windows.Thickness(0, 10, 0, 0) };
                        row.ColumnDefinitions.Add(new System.Windows.Controls.ColumnDefinition { Width = new System.Windows.GridLength(1, System.Windows.GridUnitType.Star) });
                        row.ColumnDefinitions.Add(new System.Windows.Controls.ColumnDefinition { Width = System.Windows.GridLength.Auto });
                        pMsg = new System.Windows.Controls.TextBlock {
                            Text = "正在准备…",
                            FontSize = 12,
                            Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(154, 160, 166)),
                            TextTrimming = System.Windows.TextTrimming.CharacterEllipsis
                        };
                        pPct = new System.Windows.Controls.TextBlock {
                            Text = "",
                            FontSize = 12,
                            Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(200, 204, 208)),
                            Margin = new System.Windows.Thickness(10, 0, 0, 0)
                        };
                        System.Windows.Controls.Grid.SetColumn(pMsg, 0);
                        System.Windows.Controls.Grid.SetColumn(pPct, 1);
                        row.Children.Add(pMsg);
                        row.Children.Add(pPct);
                        stack.Children.Add(title);
                        stack.Children.Add(pBar);
                        stack.Children.Add(row);
                        w.Content = stack;
                        progressWin = w;
                        progressDispatcher = w.Dispatcher;
                        readyEvt.Set();
                        if (progressFinished) {
                            try { w.Close(); } catch { }
                            return;
                        }
                        System.Windows.Threading.Dispatcher.Run();
                    } catch { readyEvt.Set(); }
                });
                progressUiThread.SetApartmentState(System.Threading.ApartmentState.STA);
                progressUiThread.IsBackground = true;
                progressUiThread.Start();
                readyEvt.Wait(1000);
            }
            try {
                var start=new System.Diagnostics.ProcessStartInfo {
                    FileName=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.Windows),"System32","WindowsPowerShell","v1.0","powershell.exe"),
                    Arguments="-NoProfile -ExecutionPolicy Bypass -File \""+installer+"\""+
                        (operation.Length>0?" -Maintenance \""+operation+"\"":"")+
                        (installMode.Length>0?" -Mode \""+installMode+"\"":"")+
                        (expectedBuildId.Length>0?" -ExpectedBuildId \""+expectedBuildId+"\"":"")+
                        (requestId.Length>0?" -RequestId \""+requestId+"\"":"")+
                        (confirmDelete?" -ConfirmDeleteData":""),
                    UseShellExecute=false,CreateNoWindow=true,WindowStyle=System.Diagnostics.ProcessWindowStyle.Hidden,
                    RedirectStandardOutput=true,RedirectStandardError=true
                };
                start.EnvironmentVariables["PSFB_INSTALL_STATUS_FILE"]=statusFile;
                start.EnvironmentVariables["PSFB_INSTALL_PROGRESS_FILE"]=progressFile;
                var effectiveOp = (string.IsNullOrEmpty(operation) || operation == "install") ? "install" : operation;
                System.DateTime initialOuterFileTime = System.DateTime.MinValue;
                bool initialOuterFileExisted = false;
                if (!isProgressOwner && System.IO.File.Exists(progressFile)) {
                    initialOuterFileExisted = true;
                    initialOuterFileTime = System.IO.File.GetLastWriteTimeUtc(progressFile);
                }
                context.SetVarValue("installRunning",true);
                var startedProcess=System.Diagnostics.Process.Start(start);
                using(var process=startedProcess) {
                // Backstop on this launch's own Process handle: any exception or return before
                // the installer exits kills just that installer, never a detached runtime.
                var installerExited=false;
                try {
                    process.BeginOutputReadLine();
                    process.BeginErrorReadLine();
                    var deadline=System.DateTime.UtcNow.AddSeconds(600);
                    var startTime=System.DateTime.UtcNow;
                    bool windowShown = false;
                    while(!process.WaitForExit(700)) {
                        try {
                            if(System.IO.File.Exists(progressFile)) {
                                if (initialOuterFileExisted && System.IO.File.GetLastWriteTimeUtc(progressFile) == initialOuterFileTime) {
                                    // stale external progress file from before this launch
                                } else {
                                    initialOuterFileExisted = false;
                                    string ptext = null;
                                    try {
                                        using (var fs = new System.IO.FileStream(progressFile, System.IO.FileMode.Open, System.IO.FileAccess.Read, System.IO.FileShare.ReadWrite))
                                        using (var sr = new System.IO.StreamReader(fs, System.Text.Encoding.UTF8)) {
                                            ptext = sr.ReadToEnd();
                                        }
                                    } catch { }
                                    if(!string.IsNullOrEmpty(ptext)) {
                                        try {
                                            var pObj = Newtonsoft.Json.Linq.JObject.Parse(ptext);
                                            var pPhase = (string)pObj["phase"];
                                            if (!string.IsNullOrEmpty(pPhase)) {
                                                context.SetVarValue("installProgress",ptext);
                                                if (progressDispatcher != null && progressWin != null) {
                                                    var pPctVal = (int?)pObj["percent"] ?? -1;
                                                    var pDetailVal = (string)pObj["detail"] ?? pPhase ?? "正在准备…";
                                                    progressDispatcher.BeginInvoke(new System.Action(() => {
                                                        if (pPctVal >= 0) {
                                                            pBar.IsIndeterminate = false;
                                                            pBar.Value = System.Math.Max(0, System.Math.Min(100, pPctVal));
                                                            pPct.Text = pPctVal + "%";
                                                        } else {
                                                            pBar.IsIndeterminate = true;
                                                            pPct.Text = "";
                                                        }
                                                        pMsg.Text = pDetailVal;
                                                    }));
                                                }
                                            }
                                        } catch (System.Exception parseEx) {
                                            try { context.SetVarValue("diag:progressParseError", parseEx.Message); } catch { }
                                        }
                                    }
                                }
                            }
                            if (!windowShown && (System.DateTime.UtcNow - startTime).TotalMilliseconds >= 1200) {
                                if (!progressFinished && progressDispatcher != null && progressWin != null) {
                                    progressDispatcher.BeginInvoke(new System.Action(() => {
                                        if (progressFinished) return;
                                        progressWin.Visibility = System.Windows.Visibility.Visible;
                                        progressWin.Show();
                                    }));
                                    windowShown = true;
                                }
                            }
                        } catch {}
                        if(System.DateTime.UtcNow>=deadline) {
                            try{process.Kill();}catch{}
                            var timeoutObj = new Newtonsoft.Json.Linq.JObject();
                            timeoutObj["protocolVersion"] = 1;
                            timeoutObj["productId"] = "PSFlowBridge";
                            timeoutObj["operation"] = effectiveOp;
                            if (!string.IsNullOrEmpty(requestId)) timeoutObj["requestId"] = requestId;
                            timeoutObj["ok"] = false;
                            timeoutObj["status"] = "failed";
                            timeoutObj["error"] = "准备超时（已等待超过 600 秒），请先查询当前运行状态再重试。";
                            var timeoutJson = timeoutObj.ToString(Newtonsoft.Json.Formatting.None);
                            try { context.SetVarValue("installerResult", timeoutJson); } catch { }
                            try { context.SetVarValue("response", timeoutJson); } catch { }
                            throw new System.Exception((string)timeoutObj["error"]);
                        }
                    }
                    installerExited=true;
                    try { if(System.IO.File.Exists(progressFile)) { var text=System.IO.File.ReadAllText(progressFile); if(!string.IsNullOrEmpty(text)) context.SetVarValue("installProgress",text); } } catch {}
                    if(!System.IO.File.Exists(statusFile)) {
                        var failObj = new Newtonsoft.Json.Linq.JObject();
                        failObj["protocolVersion"] = 1;
                        failObj["productId"] = "PSFlowBridge";
                        failObj["operation"] = effectiveOp;
                        if (!string.IsNullOrEmpty(requestId)) failObj["requestId"] = requestId;
                        failObj["ok"] = false;
                        failObj["status"] = "failed";
                        failObj["error"] = "Installer process exited with code " + process.ExitCode + " without writing status file.";
                        var failJson = failObj.ToString(Newtonsoft.Json.Formatting.None);
                        try { context.SetVarValue("installerResult", failJson); } catch { }
                        try { context.SetVarValue("response", failJson); } catch { }
                        throw new System.Exception((string)failObj["error"]);
                    }
                    var result=Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(statusFile));
                    var rawJson=result.ToString(Newtonsoft.Json.Formatting.None);
                    try { context.SetVarValue("installerResult",rawJson); } catch { }
                    try { context.SetVarValue("response",rawJson); } catch { }
                    if(process.ExitCode!=0||(bool?)result["ok"]!=true)throw new System.Exception((string)result["error"]??"运行组件准备失败。");
                    var isNonRunningOp=(operation=="inspect"||operation=="remove-components"||operation=="clear-cache"||operation=="remove-local"||operation=="uninstall-runtime"||operation=="delete-user-data");
                    if(isNonRunningOp)return true;
                    var root=(string)result["packageRoot"];var node=(string)result["nodePath"];
                    if(string.IsNullOrEmpty(root)||string.IsNullOrEmpty(node)||!System.IO.File.Exists(System.IO.Path.Combine(root,"action-ui","panel.html"))||!System.IO.File.Exists(node))throw new System.Exception("运行位置无效，未打开面板。");
                    context.WriteState("packageRoot",root);context.WriteState("nodePath",node);
                    context.SetVarValue("root",root);
                } finally {
                    // On any exception (including caller cancellation surfaces) leave no live
                    // installer from this launch holding Local\PSFlowBridgeDistribution. Only
                    // this launch's own installer handle is touched; a runtime that detached
                    // after a normal exit (node/python) is never affected.
                    try {
                        if (!installerExited && !process.HasExited) {
                            process.Kill();
                            process.WaitForExit(10000);
                        }
                    } catch { }
                }
                }
            } finally {
                context.SetVarValue("installDone",true);
                context.SetVarValue("installRunning",false);
                progressFinished = true;
                if (progressDispatcher != null) {
                    try {
                        progressDispatcher.BeginInvoke(new System.Action(() => {
                            try {
                                if (progressWin != null) {
                                    progressWin.Close();
                                }
                            } catch { }
                            try {
                                progressDispatcher.InvokeShutdown();
                            } catch { }
                        }));
                    } catch {}
                }
                if (progressUiThread != null) {
                    try {
                        progressUiThread.Join(1500);
                    } catch { }
                }
                try{if(System.IO.File.Exists(statusFile))System.IO.File.Delete(statusFile);}catch{}
                if(isProgressOwner){try{if(System.IO.File.Exists(progressFile))System.IO.File.Delete(progressFile);}catch{}}
            }
            return true;
        }
      runOnUiThread: background
  - csscript:
      mode: normal_roslyn
      script: |-
        public static object Exec(Quicker.Public.IStepContext context)
        {
            if (string.IsNullOrEmpty(((string)(context.GetVarValue("setupChoice") ?? "")))) return true;
            var selected = ((string)(context.GetVarValue("installMode") ?? ""));
            if (selected != "browser" && selected != "local") throw new System.Exception("运行方式未确认，未保存首次设置。");
            var data = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
            var config = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(System.IO.Path.Combine(data, "config.json")));
            Newtonsoft.Json.Linq.JObject health = null;
            System.Func<Newtonsoft.Json.Linq.JObject> TryHealth = () => {
                var req = (System.Net.HttpWebRequest)System.Net.WebRequest.Create("http://127.0.0.1:47831/api/health");
                req.Timeout = 5000;
                req.Headers["Authorization"] = "Bearer " + (string)config["pairingToken"];
                using (var response = (System.Net.HttpWebResponse)req.GetResponse())
                using (var reader = new System.IO.StreamReader(response.GetResponseStream())) return Newtonsoft.Json.Linq.JObject.Parse(reader.ReadToEnd());
            };
            var attempts = 0; var statusText = "(连接失败)";
            while (attempts < 20) {
                attempts++;
                try { health = TryHealth(); break; }
                catch (System.Net.WebException we) {
                    try {
                        using (var er = we.Response as System.Net.HttpWebResponse)
                            statusText = er != null ? ((int)er.StatusCode).ToString() : "(连接失败)";
                    } catch { statusText = "(连接失败)"; }
                    System.Threading.Thread.Sleep(500);
                    health = null;
                }
            }
            if (health == null) throw new System.Exception("本地服务未就绪或端口被其它程序占用（状态码 " + statusText + "，路径 /api/health）。请稍等几秒，或关闭占用 47831 端口的程序后重试。");
            if ((string)health["app"] != "PSFlowBridge" || (string)health["effectiveMode"] != selected || (bool?)health["draining"] != false) throw new System.Exception("安装后的运行方式未通过检查，首次设置尚未保存。");
            var file = System.IO.Path.Combine(data, "setup.json");
            using (var mutex = new System.Threading.Mutex(false, "Local\\PSFlowBridgeFirstRun")) {
                var acquired = false;
                try {
                    try { acquired = mutex.WaitOne(5000); } catch (System.Threading.AbandonedMutexException) { acquired = true; }
                    if (!acquired) throw new System.Exception("另一个首次设置正在保存，请稍后再试。");
                    var current = System.IO.File.Exists(file) ? System.IO.File.ReadAllText(file) : "";
                    if (current != (((string)(context.GetVarValue("setupExpected") ?? "")) ?? "")) throw new System.Exception("另一个窗口已更新首次设置，请重新打开助手。");
                    if (current.Length == 0) {
                        var userState = System.IO.Path.Combine(data, "user-state.json");
                        if (!System.IO.File.Exists(userState)) {
                            using (var stream = new System.IO.FileStream(userState, System.IO.FileMode.CreateNew, System.IO.FileAccess.Write, System.IO.FileShare.Read)) {
                                var empty = System.Text.Encoding.UTF8.GetBytes("{\"schemaVersion\":1,\"revision\":1,\"values\":{}}");
                                stream.Write(empty, 0, empty.Length);
                            }
                        }
                    }
                    var snapshot = new Newtonsoft.Json.Linq.JObject { ["schemaVersion"] = 1, ["completed"] = true, ["mode"] = selected, ["updatedAt"] = System.DateTime.UtcNow.ToString("o") };
                    var temporary = file + "." + System.Guid.NewGuid().ToString("N") + ".tmp";
                    try {
                        System.IO.File.WriteAllText(temporary, snapshot.ToString(Newtonsoft.Json.Formatting.Indented), new System.Text.UTF8Encoding(false));
                        if (System.IO.File.Exists(file)) System.IO.File.Replace(temporary, file, null); else System.IO.File.Move(temporary, file);
                    } finally { if (System.IO.File.Exists(temporary)) System.IO.File.Delete(temporary); }
                } finally { if (acquired) mutex.ReleaseMutex(); }
            }
            return true;
        }
      runOnUiThread: background
  - webview2:
      type: OpenAndWaitLoad
      url: '$=Path.Combine({root}, "action-ui", "panel.html")'
      title: PS Flow 侧边助手
      defaultBgColor: "#26282b"
      autoCloseKey: '='
      modeForExists: RecreateWindow
      winLocation: RightCenter
      winSize: '360,680'
      outputs:
        hWnd: panelWindow
  - if:
      condition: '$={maintenance} == "rollback-app"'
      then:
        - csscript:
            mode: normal_roslyn
            script: |-
              public static object Exec(Quicker.Public.IStepContext context)
              {
                  var data=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData),"PSFlowBridge");
                  var file=System.IO.Path.Combine(data,"user-state.json");
                  context.SetVarValue("rollbackStateScript","'no fixed settings to restore'");
                  if(System.IO.File.Exists(file)) {
                    var raw=System.IO.File.ReadAllText(file);
                    if(System.Text.Encoding.UTF8.GetByteCount(raw)>4*1024*1024+8192)throw new System.Exception("用户设置过大，未覆盖回退版本的设置。");
                    var snapshot=Newtonsoft.Json.Linq.JObject.Parse(raw);
                    var values=snapshot["values"] as Newtonsoft.Json.Linq.JObject;
                    var keys=new[]{"psflow.action-ui.v1","psflow.text-draft.v1","psflow.generation-kind","psflow_drafts","psflow.personal-presets.v1","psflow.personal-presets.v2"};
                    if((int?)snapshot["schemaVersion"]!=1||((long?)snapshot["revision"]??0)<1||values==null)throw new System.Exception("用户设置格式无效，原数据已保留。");
                    foreach(var item in values.Properties())if(!System.Linq.Enumerable.Contains(keys,item.Name)||item.Value.Type!=Newtonsoft.Json.Linq.JTokenType.String)throw new System.Exception("用户设置包含不支持的数据，未覆盖回退版本。");
                    var script="(()=>{if(window.PSFlowUserState)return 'fixed settings supported';const values="+values.ToString(Newtonsoft.Json.Formatting.None)+",keys="+Newtonsoft.Json.JsonConvert.SerializeObject(keys)+";const restore=()=>{for(const k of keys){if(Object.prototype.hasOwnProperty.call(values,k))localStorage.setItem(k,values[k]);else localStorage.removeItem(k);}};restore();window.addEventListener('pagehide',restore,{once:true});location.reload();return 'settings restored';})()";
                    context.SetVarValue("rollbackStateScript",script);
                  }
                  return true;
              }
            runOnUiThread: background
        - webview2:
            type: ExecuteScript
            autoCloseKey: '='
            script: '$={rollbackStateScript}'
      else:
        - comment: '兼容旧版分支'
  - csscript:
      mode: normal_roslyn
      script: |-
        // Only the panel HWND returned by WebView2 may be controlled. Foreground lookup is read-only.
        public class PsFlowPanelWindow
        {
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool IsWindow(System.IntPtr hwnd);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern System.IntPtr GetAncestor(System.IntPtr hwnd, uint flags);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(System.IntPtr hwnd, out uint pid);
            [System.Runtime.InteropServices.DllImport("user32.dll", EntryPoint="GetWindowLongW")] static extern int GetStyle(System.IntPtr hwnd, int index);
            [System.Runtime.InteropServices.DllImport("user32.dll", EntryPoint="SetWindowLongW")] static extern int SetStyle(System.IntPtr hwnd, int index, int style);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool SetWindowPos(System.IntPtr hwnd, System.IntPtr after, int x, int y, int w, int h, uint flags);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool ReleaseCapture();
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool PostMessage(System.IntPtr hwnd, uint message, System.IntPtr wp, System.IntPtr lp);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool ShowWindow(System.IntPtr hwnd, int command);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool GetWindowRect(System.IntPtr hwnd, out Rect rect);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern uint GetDpiForWindow(System.IntPtr hwnd);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern uint GetDpiForSystem();
            [System.Runtime.InteropServices.DllImport("user32.dll", EntryPoint="GetMonitorInfoW", CharSet=System.Runtime.InteropServices.CharSet.Unicode)] static extern bool GetMonitorInfo(System.IntPtr monitor, ref MonitorInfo info);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern System.IntPtr MonitorFromWindow(System.IntPtr hwnd, uint flags);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern System.IntPtr MonitorFromPoint(Point point, uint flags);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool GetCursorPos(out CursorPoint point);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern short GetAsyncKeyState(int key);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern System.IntPtr GetForegroundWindow();
            struct CursorPoint { public int X, Y; }
            [System.Runtime.InteropServices.DllImport("gdi32.dll")] static extern System.IntPtr CreateRoundRectRgn(int left, int top, int right, int bottom, int ellipseWidth, int ellipseHeight);
            [System.Runtime.InteropServices.DllImport("gdi32.dll")] static extern System.IntPtr CreateRectRgn(int nLeftRect, int nTopRect, int nRightRect, int nBottomRect);
            [System.Runtime.InteropServices.DllImport("gdi32.dll")] static extern bool DeleteObject(System.IntPtr value);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern int SetWindowRgn(System.IntPtr hwnd, System.IntPtr region, bool redraw);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern int GetWindowRgn(System.IntPtr hwnd, System.IntPtr hRgn);
            [System.Runtime.InteropServices.DllImport("dwmapi.dll")] static extern int DwmSetWindowAttribute(System.IntPtr hwnd, int attribute, ref int value, int size);
            [System.Runtime.InteropServices.DllImport("dwmapi.dll")] static extern int DwmExtendFrameIntoClientArea(System.IntPtr hwnd, ref Margins margins);
            struct Rect { public int Left, Top, Right, Bottom; }
            struct Margins { public int Left, Right, Top, Bottom; }
            struct Point { public int X, Y; }
            [System.Runtime.InteropServices.StructLayout(System.Runtime.InteropServices.LayoutKind.Sequential)]
            struct MonitorInfo {
                public int Size; public Rect Monitor; public Rect Work; public uint Flags;
            }
            
            class PanelState {
                public System.Windows.Window Window;
                public System.Windows.Threading.DispatcherTimer Timer;
                public bool AutoCollapse, Collapsed;
                public double Left, Top, Width, Height;
                // Capsule position is remembered separately so expanding keeps the
                // capsule where the user left it instead of jumping to a stale corner.
                public double CollapsedLeft, CollapsedTop;
                public System.DateTime InteractionProtectedUntil;
                public System.IntPtr Handle;
                public System.DateTime OutsideSince, InsideSince, SettledAfter;
                public Quicker.Public.IStepContext Context;
            }
            static readonly System.Collections.Generic.Dictionary<long, PanelState> Panels = new System.Collections.Generic.Dictionary<long, PanelState>();
        
            // ---- DPI and work-area helpers -------------------------------------
            // WPF positions/sizes are device-independent pixels (DIPs). GetWindowRect,
            // GetMonitorInfo and SetWindowPos all speak physical pixels. The two must be
            // converted with the window's own DPI, otherwise a 150% monitor puts the
            // panel in the wrong place or reports a size that never matches the probe.
            static double DpiScale(System.IntPtr hwnd) {
                uint dpi = 0;
                try { dpi = GetDpiForWindow(hwnd); } catch { }
                if (dpi == 0) { try { dpi = GetDpiForSystem(); } catch { } }
                if (dpi == 0) dpi = 96;
                return dpi / 96.0;
            }
            static int DipToPx(System.IntPtr hwnd, double dip) { return (int)System.Math.Round(dip * DpiScale(hwnd)); }
            static double PxToDip(System.IntPtr hwnd, int px) { return px / DpiScale(hwnd); }
            static bool TryWorkArea(System.IntPtr hwnd, out Rect work) {
                work = new Rect();
                System.IntPtr monitor = System.IntPtr.Zero;
                try { monitor = MonitorFromWindow(hwnd, 2); } catch { } // MONITOR_DEFAULTTONEAREST
                if (monitor == System.IntPtr.Zero) return false;
                var info = new MonitorInfo();
                info.Size = System.Runtime.InteropServices.Marshal.SizeOf(typeof(MonitorInfo));
                if (!GetMonitorInfo(monitor, ref info)) return false;
                work = info.Work;
                return work.Right > work.Left && work.Bottom > work.Top;
            }
            // Keep a window inside a usable work area. Called after setup, after every
            // expand/collapse and when a monitor disappears: a window that was placed on
            // a disconnected monitor is pulled back instead of staying unreachable.
            static void ClampToWorkArea(PanelState state) {
                var w = state.Window;
                if (w == null || w.WindowState != System.Windows.WindowState.Normal) return;
                if (GetAsyncKeyState(1) < 0 || System.Windows.Input.Mouse.Captured != null ||
                    System.DateTime.UtcNow < state.InteractionProtectedUntil) return;
                var source = System.Windows.PresentationSource.FromVisual(w) as System.Windows.Interop.HwndSource;
                if (source == null || source.Handle == System.IntPtr.Zero) return;
                System.IntPtr hwnd = source.Handle;
                Rect work;
                if (!TryWorkArea(hwnd, out work)) return;
                Rect current;
                if (!GetWindowRect(hwnd, out current)) return;
                int width = current.Right - current.Left, height = current.Bottom - current.Top;
                if (width < 1 || height < 1) return;
                // The panel's full bounding rectangle must stay entirely within the usable work area
                // so header buttons, close controls and edge margins are not clipped.
                int workWidth = work.Right - work.Left, workHeight = work.Bottom - work.Top;
                double dipWorkWidth = PxToDip(hwnd, workWidth), dipWorkHeight = PxToDip(hwnd, workHeight);
                if (width > workWidth) {
                    w.MaxWidth = dipWorkWidth;
                    w.Width = w.MaxWidth;
                    width = workWidth;
                } else {
                    w.MaxWidth = dipWorkWidth;
                }
                if (height > workHeight) {
                    w.MaxHeight = dipWorkHeight;
                    w.Height = w.MaxHeight;
                    height = workHeight;
                } else {
                    w.MaxHeight = dipWorkHeight;
                }
                int overlapX = System.Math.Min(current.Right, work.Right) - System.Math.Max(current.Left, work.Left);
                int overlapY = System.Math.Min(current.Bottom, work.Bottom) - System.Math.Max(current.Top, work.Top);
                bool visible = overlapX >= 40 && overlapY >= 24 && current.Right <= work.Right && current.Bottom <= work.Bottom && current.Left >= work.Left && current.Top >= work.Top;
                if (visible) return;
                int left = System.Math.Max(work.Left, System.Math.Min(current.Left, work.Right - width));
                int top = System.Math.Max(work.Top, System.Math.Min(current.Top, work.Bottom - height));
                // Write the corrected physical rect back through WPF DIPs so the next
                // SizeChanged/StateChanged pass sees a consistent position.
                double dipLeft = PxToDip(hwnd, left), dipTop = PxToDip(hwnd, top);
                w.Left = dipLeft; w.Top = dipTop;
                state.Left = dipLeft; state.Top = dipTop;
                if (state.Collapsed) { state.CollapsedLeft = dipLeft; state.CollapsedTop = dipTop; }
                SetWindowPos(hwnd, System.IntPtr.Zero, left, top, 0, 0, 0x0015); // NOSIZE | NOZORDER | NOACTIVATE
            }
            static bool PhotoshopIsForeground() {
                uint foregroundPid;
                GetWindowThreadProcessId(GetForegroundWindow(), out foregroundPid);
                try {
                    using(var process=System.Diagnostics.Process.GetProcessById((int)foregroundPid))
                        return string.Equals(process.ProcessName,"Photoshop",System.StringComparison.OrdinalIgnoreCase);
                } catch { return false; }
            }
            static void SetCollapsed(PanelState state, bool collapsed) {
                if (state.Collapsed == collapsed) return;
                var w=state.Window;
                if (collapsed) {
                    if (w.WindowState != System.Windows.WindowState.Normal) return;
                    state.Left=w.Left;state.Top=w.Top;state.Width=w.Width;state.Height=w.Height;
                    state.Collapsed=true;
                    w.MinWidth=0;w.MinHeight=0;w.Width=220;w.Height=48;
                    // Keep the capsule anchored to the same right edge as the panel.
                    w.Left=state.Left+state.Width-w.Width;
                    state.CollapsedLeft=w.Left;state.CollapsedTop=w.Top;
                } else {
                    // Preserve moves made while collapsed; restore around its current right edge.
                    double right=w.Left+w.Width;
                    state.Collapsed=false;w.Width=state.Width;w.Height=state.Height;
                    w.Left=right-w.Width;
                }
                ClampToWorkArea(state);
                state.OutsideSince=state.InsideSince=System.DateTime.MinValue;
                state.SettledAfter=System.DateTime.UtcNow.AddMilliseconds(650);
                var source=System.Windows.PresentationSource.FromVisual(w) as System.Windows.Interop.HwndSource;
                if(source!=null)UpdateWindowRegion(source.Handle);
            }
            static PanelState ConfigurePanel(System.Windows.Window w, long handle, Quicker.Public.IStepContext context) {
                PanelState state;
                if(Panels.TryGetValue(handle,out state))return state;
                state=new PanelState {Window=w,Handle=new System.IntPtr(handle),Context=context,AutoCollapse=context.ReadState("panelAutoCollapse","true")=="true"};
                w.Topmost=context.ReadState("panelTopmost","false")=="true";
                state.Timer=new System.Windows.Threading.DispatcherTimer {Interval=System.TimeSpan.FromMilliseconds(50)};
                state.Timer.Tick+=(sender,args)=>{
                    if(!w.IsVisible||w.WindowState!=System.Windows.WindowState.Normal)return;
                    // Recover a panel left on a disconnected/changed monitor. This is a
                    // cheap rect comparison and also covers DPI changes after a drag
                    // between monitors with different scale factors.
                    ClampToWorkArea(state);
                    // Collapsed panels expand only on click, so they need no hover/foreground probes.
                    if(!state.AutoCollapse||state.Collapsed){state.OutsideSince=System.DateTime.MinValue;return;}
                    var now=System.DateTime.UtcNow;
                    if(now<state.SettledAfter)return;
                    Rect rect;CursorPoint cursor;
                    if(!GetWindowRect(state.Handle,out rect)||!GetCursorPos(out cursor))return;
                    // WebView2 owns child HWNDs: WPF IsMouseOver/MouseLeave are not reliable here.
                    bool inside=cursor.X>=rect.Left-5&&cursor.X<rect.Right+5&&cursor.Y>=rect.Top-5&&cursor.Y<rect.Bottom+5;
                    bool held=GetAsyncKeyState(1)<0||GetAsyncKeyState(2)<0||GetAsyncKeyState(4)<0||System.Windows.Input.Mouse.Captured!=null;
                    if(inside){
                        state.OutsideSince=System.DateTime.MinValue;
                        if(state.InsideSince==System.DateTime.MinValue)state.InsideSince=now;
                        // Hover no longer auto-expands; only click via panel-capsule expand.
                    }else{
                        state.InsideSince=System.DateTime.MinValue;
                        if(held||now<state.InteractionProtectedUntil){
                            state.OutsideSince=System.DateTime.MinValue;return;
                        }
                        if(state.OutsideSince==System.DateTime.MinValue)state.OutsideSince=now;
                        if(state.AutoCollapse&&!state.Collapsed&&(now-state.OutsideSince).TotalMilliseconds>=350)SetCollapsed(state,true);
                    }
                };
                state.Timer.Start();
                w.Closed+=(sender,args)=>{state.Timer.Stop();Panels.Remove(handle);};
                Panels[handle]=state;
                // Keep one window owner across separately compiled setup and command scripts.
                w.Resources["PSFlowPanel.WindowCommand"] = new System.Func<Quicker.Public.IStepContext, object>(Exec);
                return state;
            }
        
            static void UpdateWindowRegion(System.IntPtr hwnd)
            {
                if (!IsWindow(hwnd)) return;
                Rect rect;
                if (!GetWindowRect(hwnd, out rect)) return;
                // CreateRoundRectRgn takes an exclusive right/bottom edge, exactly like
                // CreateRectRgn. Passing width + 1 leaves a 1px dark sliver on the
                // right and bottom edges of the capsule.
                int w = rect.Right - rect.Left;
                int h = rect.Bottom - rect.Top;
                if (w < 1 || h < 1) return;
                int diameter = (int)System.Math.Round(24.0 * GetDpiForWindow(hwnd) / 96.0);
                var region = CreateRoundRectRgn(0, 0, w, h, diameter, diameter);
                if (region != System.IntPtr.Zero && SetWindowRgn(hwnd, region, true) == 0) DeleteObject(region);
            }
        
            // Quicker's WebView2Window template nests Border/ContentPresenter/Grid/
            // Decorator containers between the window and the WebView2 control. Their
            // default insets expose the window background as a dark frame, so every
            // chrome container down to the WebView2 host must sit flush at 0.
            static void ZeroContainerInsets(System.Windows.DependencyObject root)
            {
                ZeroContainerInsets(root, 0);
            }
        
            static void ZeroContainerInsets(System.Windows.DependencyObject root, int depth)
            {
                if (root == null || depth > 64) return;
                try {
                    var fe = root as System.Windows.FrameworkElement;
                    if (fe != null) fe.Margin = new System.Windows.Thickness(0);
                    var ctrl = root as System.Windows.Controls.Control;
                    if (ctrl != null) {
                        ctrl.Padding = new System.Windows.Thickness(0);
                        ctrl.BorderThickness = new System.Windows.Thickness(0);
                    }
                    var bd = root as System.Windows.Controls.Border;
                    if (bd != null) {
                        bd.Padding = new System.Windows.Thickness(0);
                        bd.BorderThickness = new System.Windows.Thickness(0);
                        bd.CornerRadius = new System.Windows.CornerRadius(0);
                    }
                    var dec = root as System.Windows.Controls.Decorator;
                    if (dec != null) dec.Margin = new System.Windows.Thickness(0);
                    // The hosting window type is itself called WebView2Window, so a plain
                    // name match would stop the walk at the root. Only the embedded
                    // control counts, and only Control subclasses can be one.
                    bool isWebView2Control = root is System.Windows.Controls.Control
                        && !(root is System.Windows.Window)
                        && root.GetType().Name.IndexOf("WebView2", System.StringComparison.Ordinal) >= 0;
                    if (isWebView2Control) {
                        try {
                            var prop = root.GetType().GetProperty("DefaultBackgroundColor");
                            if (prop != null && prop.CanWrite) {
                                var colorType = prop.PropertyType;
                                if (colorType == typeof(System.Windows.Media.Color)) {
                                    prop.SetValue(root, System.Windows.Media.Color.FromRgb(38, 40, 43), null);
                                } else if (colorType.FullName == "System.Drawing.Color") {
                                    // Resolved by name so this script needs no System.Drawing reference.
                                    var fromArgb = colorType.GetMethod("FromArgb", new System.Type[] { typeof(int), typeof(int), typeof(int) });
                                    if (fromArgb != null) prop.SetValue(root, fromArgb.Invoke(null, new object[] { 38, 40, 43 }), null);
                                }
                            }
                        } catch { }
                        return;
                    }
                    int count = System.Windows.Media.VisualTreeHelper.GetChildrenCount(root);
                    for (int i = 0; i < count; i++) {
                        System.Windows.DependencyObject child = null;
                        try { child = System.Windows.Media.VisualTreeHelper.GetChild(root, i); } catch { }
                        if (child != null) ZeroContainerInsets(child, depth + 1);
                    }
                } catch { }
            }
        
            static void FitPanelContent(System.Windows.Window window) {
                // Keep Quicker's chrome object and handlers, but remove its template inset.
                window.ApplyTemplate();
                if (System.Windows.Media.VisualTreeHelper.GetChildrenCount(window) > 0) {
                    var frame = System.Windows.Media.VisualTreeHelper.GetChild(window, 0) as System.Windows.FrameworkElement;
                    if (frame != null) frame.Margin = new System.Windows.Thickness(0);
                }
                var layout = window.FindName("Layout") as System.Windows.FrameworkElement;
                if (layout != null) layout.Margin = new System.Windows.Thickness(0);
                // Walk the whole chrome chain so no nested Border/ContentPresenter/Grid
                // keeps a template inset that would show up as a dark ring.
                ZeroContainerInsets(window);
            }
        
            public static object Exec(Quicker.Public.IStepContext context)
            {
                string operation = "setup";
                try { operation = ((string)context.GetVarValue("operation")) ?? "setup"; } catch { }
                bool setup = operation == "setup";
                string handleText = setup ? ((string)context.GetVarValue("panelWindow")) : context.ReadState("panelWindow", null);
                long handle;
                if (!long.TryParse(handleText, out handle) || handle == 0) throw new System.Exception("面板窗口尚未就绪。");
                var hwnd = GetAncestor(new System.IntPtr(handle), 2);
                uint pid;
                GetWindowThreadProcessId(hwnd, out pid);
                if (!IsWindow(hwnd) || pid != (uint)System.Diagnostics.Process.GetCurrentProcess().Id)
                    throw new System.Exception("面板窗口已关闭，请重新打开动作。");
                if (setup) {
                    context.WriteState("panelWindow", hwnd.ToInt64().ToString());
                    var source = System.Windows.Interop.HwndSource.FromHwnd(hwnd);
                    var window = source == null ? null : source.RootVisual as System.Windows.Window;
                    if (window != null) {
                        // Quicker state-change handler needs this object; never detach it.
                        var chrome = System.Windows.Shell.WindowChrome.GetWindowChrome(window);
                        if (chrome != null) {
                            chrome.NonClientFrameEdges = System.Windows.Shell.NonClientFrameEdges.None;
                            chrome.CaptionHeight = 0;
                            chrome.GlassFrameThickness = new System.Windows.Thickness(0);
                            chrome.ResizeBorderThickness = new System.Windows.Thickness(0);
                            chrome.CornerRadius = new System.Windows.CornerRadius(12);
                        }
                        window.WindowStyle = System.Windows.WindowStyle.None;
                        window.ResizeMode = System.Windows.ResizeMode.NoResize;
                        window.MinWidth=0; window.MinHeight=0;
                        window.Width = 380; window.Height = 680; // WPF DIPs, including 150% monitors.
                        window.BorderThickness = new System.Windows.Thickness(0);
                        window.Padding = new System.Windows.Thickness(0);
                        window.Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(38, 40, 43));
                        
                        var content = window.Content as System.Windows.FrameworkElement;
                        if (content != null) {
                            content.Margin = new System.Windows.Thickness(0);
                        }
                        
                        ConfigurePanel(window, hwnd.ToInt64(), context);
                        window.SizeChanged -= Window_SizeChanged;
                        window.StateChanged -= Window_StateChanged;
                        window.SizeChanged += Window_SizeChanged;
                        window.StateChanged += Window_StateChanged;
                        // The initial placement may be off-screen on a mixed-DPI setup.
                        ClampToWorkArea(ConfigurePanel(window, hwnd.ToInt64(), context));
                    }
                    SetStyle(hwnd, -16, GetStyle(hwnd, -16) & ~0x00C40000); // WS_CAPTION | WS_THICKFRAME
                    SetWindowPos(hwnd, System.IntPtr.Zero, 0, 0, 0, 0, 0x0037); // FRAMECHANGED, no move/size/z-order/activate
                    int preference = 2;
                    try {
                        DwmSetWindowAttribute(hwnd, 33, ref preference, 4);
                        int borderColor = -2; // DWMWA_COLOR_NONE: suppress DWM light border.
                        DwmSetWindowAttribute(hwnd, 34, ref borderColor, 4);
                        var margins = new Margins();
                        DwmExtendFrameIntoClientArea(hwnd, ref margins);
                    } catch (System.EntryPointNotFoundException) { }
                    
                    if (window != null) { FitPanelContent(window); window.UpdateLayout(); }
                    UpdateWindowRegion(hwnd);
                    return true;
                }
                var panelSource=System.Windows.Interop.HwndSource.FromHwnd(hwnd);
                var panelWindow=panelSource==null?null:panelSource.RootVisual as System.Windows.Window;
                if (panelWindow != null) {
                    var owner = panelWindow.Resources["PSFlowPanel.WindowCommand"] as System.Func<Quicker.Public.IStepContext, object>;
                    if (owner != null && owner.Method.DeclaringType != typeof(PsFlowPanelWindow)) return owner(context);
                }
                PanelState panelState=null;
                if(panelWindow!=null)panelState=ConfigurePanel(panelWindow,hwnd.ToInt64(),context);
                if(operation=="toggle-topmost"&&panelWindow!=null){
                    panelWindow.Topmost=!panelWindow.Topmost;
                    context.WriteState("panelTopmost",panelWindow.Topmost?"true":"false");
                } else if(operation=="toggle-autocollapse"&&panelState!=null){
                    panelState.AutoCollapse=!panelState.AutoCollapse;panelState.OutsideSince=System.DateTime.MinValue;
                    context.WriteState("panelAutoCollapse",panelState.AutoCollapse?"true":"false");
                    if(!panelState.AutoCollapse)SetCollapsed(panelState,false);
                } else if(operation=="collapse"&&panelState!=null)SetCollapsed(panelState,true);
                else if(operation=="expand"&&panelState!=null){SetCollapsed(panelState,false);}
                else if(operation=="protect"&&panelState!=null){
                    panelState.InteractionProtectedUntil=System.DateTime.UtcNow.AddMilliseconds(1500);
                    panelState.OutsideSince=System.DateTime.MinValue;
                }
                else if(operation=="unprotect"&&panelState!=null){
                    panelState.InteractionProtectedUntil=System.DateTime.MinValue;
                    panelState.OutsideSince=System.DateTime.MinValue;
                }
                else if (operation.StartsWith("drag:", System.StringComparison.Ordinal)) {
                    var anchor = operation.Split(':');
                    int offsetX, offsetY; CursorPoint cursor;
                    if (anchor.Length != 3 || !int.TryParse(anchor[1], out offsetX) || !int.TryParse(anchor[2], out offsetY))
                        throw new System.Exception("窗口拖动位置无效。");
                    // Preserve the initial grab point even when the bridge runs after a quick release.
                    if (GetCursorPos(out cursor))
                        SetWindowPos(hwnd, System.IntPtr.Zero, cursor.X-DipToPx(hwnd,offsetX), cursor.Y-DipToPx(hwnd,offsetY), 0, 0, 0x0015);
                    ReleaseCapture();
                    if (GetAsyncKeyState(1) < 0) PostMessage(hwnd, 0x00A1, new System.IntPtr(2), System.IntPtr.Zero);
                }
                else if (operation == "drag") { ReleaseCapture(); PostMessage(hwnd, 0x00A1, new System.IntPtr(2), System.IntPtr.Zero); }
                else if (operation == "minimize") ShowWindow(hwnd, 6);
                else if (operation == "close") PostMessage(hwnd, 0x0010, System.IntPtr.Zero, System.IntPtr.Zero);
                else if (operation == "probe-state") { ShowWindow(hwnd, 6); ShowWindow(hwnd, 9); }
                else if (operation == "restore") { UpdateWindowRegion(hwnd); }
                else if (operation != "probe") throw new System.Exception("不支持的窗口操作。");
                
                bool hasRgn = false;
                System.IntPtr hRgn = CreateRectRgn(0, 0, 0, 0);
                if (hRgn != System.IntPtr.Zero) {
                    if (GetWindowRgn(hwnd, hRgn) == 3) hasRgn = true; // COMPLEXREGION: a plain rectangle is not rounded.
                    DeleteObject(hRgn);
                }
        
                Rect bounds;GetWindowRect(hwnd,out bounds);CursorPoint pointer;GetCursorPos(out pointer);
                bool cursorInside=pointer.X>=bounds.Left&&pointer.X<bounds.Right&&pointer.Y>=bounds.Top&&pointer.Y<bounds.Bottom;
                Rect work;bool hasWork=TryWorkArea(hwnd,out work);
                bool onWorkArea=hasWork&&bounds.Left>=work.Left&&bounds.Right<=work.Right
                    &&bounds.Top>=work.Top&&bounds.Bottom<=work.Bottom;
                context.SetVarValue("response", "{\"ok\":true,\"frameless\":" +
                    ((GetStyle(hwnd, -16) & 0x00C40000) == 0 ? "true" : "false") + ",\"rounded\":" +
                    (hasRgn ? "true" : "false") + ",\"topmost\":"+(panelWindow!=null&&panelWindow.Topmost?"true":"false")+
                    ",\"autoCollapse\":"+(panelState!=null&&panelState.AutoCollapse?"true":"false")+
                    ",\"collapsed\":"+(panelState!=null&&panelState.Collapsed?"true":"false")+
                    ",\"left\":"+bounds.Left+",\"top\":"+bounds.Top+",\"right\":"+bounds.Right+",\"bottom\":"+bounds.Bottom+
                    ",\"cursorInside\":"+(cursorInside?"true":"false")+
                    ",\"dpiScale\":"+DpiScale(hwnd).ToString(System.Globalization.CultureInfo.InvariantCulture)+
                    ",\"onWorkArea\":"+(onWorkArea?"true":"false")+
                    ",\"workArea\":"+(hasWork?("{\"left\":"+work.Left+",\"top\":"+work.Top+",\"right\":"+work.Right+",\"bottom\":"+work.Bottom+"}"):"null")+"}");
                return true;
            }
            
            private static void Window_SizeChanged(object sender, System.Windows.SizeChangedEventArgs e) {
                var window = sender as System.Windows.Window;
                if (window != null) {
                    FitPanelContent(window);
                    var source = System.Windows.PresentationSource.FromVisual(window) as System.Windows.Interop.HwndSource;
                    if (source != null && source.Handle != System.IntPtr.Zero) UpdateWindowRegion(source.Handle);
                }
            }
            
            private static void Window_StateChanged(object sender, System.EventArgs e) {
                var window = sender as System.Windows.Window;
                if (window != null && window.WindowState == System.Windows.WindowState.Normal) {
                    var source = System.Windows.PresentationSource.FromVisual(window) as System.Windows.Interop.HwndSource;
                    if (source != null && source.Handle != System.IntPtr.Zero) UpdateWindowRegion(source.Handle);
                }
            }
        }
      runOnUiThread: ui
subPrograms:
  - name: PsFlowMaintenance
    variables:
      - key: operation
        varType: text
        isInput: true
      - key: restarted
        varType: boolean
      - key: response
        varType: text
        isOutput: true
    steps:
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                var operation=((string)context.GetVarValue("operation"));
                if(operation!="repair-runtime"&&operation!="rollback-app"&&operation!="install-local")throw new System.Exception("维护操作无效，未修改运行环境。");
                return true;
            }
          runOnUiThread: background
      - runAction:
          type: StartCurrentAction
          wait: false
          inputParam:
            var: operation
          outputs:
            isSuccess: restarted
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                var started=((bool)context.GetVarValue("restarted"));
                context.SetVarValue("response",new Newtonsoft.Json.Linq.JObject{["ok"]=started,["requested"]=started,["error"]=started?null:"维护动作未能启动，请关闭多余助手窗口后重试。"}.ToString(Newtonsoft.Json.Formatting.None));
                return true;
            }
  - name: PsFlowRestart
    variables:
      - key: restarted
        varType: boolean
      - key: response
        varType: text
        isOutput: true
    steps:
      - runAction:
          type: StartCurrentAction
          wait: false
          inputParam: ''
          outputs:
            isSuccess: restarted
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                context.SetVarValue("response",new Newtonsoft.Json.Linq.JObject{["ok"]=((bool)context.GetVarValue("restarted"))}.ToString(Newtonsoft.Json.Formatting.None));
                return true;
            }
  - name: PsFlowManagedOpen
    steps:
      - webview2:
          type: OpenUrl
          url: https://flow.google.com
          title: Flow 内置浏览器
          profileName: PSFlowBridge
          autoCloseKey: psfb-managed-flow
          modeForExists: SkipThisStep
          winLocation: RightCenter
          winSize: '960,760'
          script: "window.$quicker?.setWindowNoActivate(true);"
  - name: PsFlowManagedWindow
    variables:
      - key: managedView
        varType: any
      - key: operation
        varType: text
        isInput: true
      - key: response
        varType: text
        isOutput: true
    steps:
      - webview2:
          type: CheckWindowState
          autoCloseKey: psfb-managed-flow
          outputs:
            webView: managedView
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                var view=context.GetVarValue("managedView");
                if(view==null)throw new System.Exception("内置 Flow 窗口未打开。");
                var operation=((string)context.GetVarValue("operation"))??"show";
                bool visible=false;
                var dispatcher=(System.Windows.Threading.Dispatcher)view.GetType().GetProperty("Dispatcher").GetValue(view);
                dispatcher.Invoke(new System.Action(()=>{
                    var window=System.Windows.Window.GetWindow(view as System.Windows.DependencyObject);
                    if(window==null)throw new System.Exception("未找到内置 Flow 窗口。");
                    if(operation=="hide")window.Hide();
                    else if(operation!="probe") {window.Show();if(operation=="login")context.WriteState("managedLoginPending","true");}
                    visible=window.IsVisible;
                }));
                context.SetVarValue("response","{\"ok\":true,\"visible\":"+(visible?"true":"false")+"}");
                return true;
            }
          runOnUiThread: background
  - name: PsFlowManagedDownload
    variables:
      - key: managedView
        varType: any
      - key: request
        varType: text
        isInput: true
      - key: response
        varType: text
        isOutput: true
    steps:
      - webview2:
          type: CheckWindowState
          autoCloseKey: psfb-managed-flow
          outputs:
            webView: managedView
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
