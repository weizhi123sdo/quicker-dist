                var url="https://getquicker.net/sharedaction?code=dcde4403-c6f2-4d80-8231-c073e2504a71";
                if(operation=="copy")System.Windows.Clipboard.SetText(url);
                if(operation=="open")System.Diagnostics.Process.Start(new System.Diagnostics.ProcessStartInfo { FileName=url,UseShellExecute=true });
                context.SetVarValue("response",new Newtonsoft.Json.Linq.JObject { ["ok"]=true,["copied"]=operation=="copy",["url"]=url }.ToString(Newtonsoft.Json.Formatting.None));
