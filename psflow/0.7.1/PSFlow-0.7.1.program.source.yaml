                    }
                    var prepared=Newtonsoft.Json.Linq.JObject.Parse(api("/jobs/"+id+"/browser-input","POST",System.Text.Encoding.UTF8.GetBytes(new Newtonsoft.Json.Linq.JObject{["aspect"]=chosenRatio}.ToString(Newtonsoft.Json.Formatting.None)),"application/json"));
                    var arg=new Newtonsoft.Json.Linq.JObject{["id"]=id,["prompt"]=prepared["prompt"],["model"]=job["model"],["count"]=job["count"],["aspect"]=prepared["aspect"]};
                    var hasExtra=false;
                    if(isText){
                        // The helper returns base64:null for text jobs; never fabricate an image.
                        arg["kind"]="text2image";
                        arg["hasExtraImage"]=false;
                    }else{
                        var source=System.Convert.FromBase64String((string)prepared["base64"]);
                        if(source.Length==0||source.Length>64*1024*1024)throw new System.Exception("参考图大小无效。");
                        arg["base64"]=System.Convert.ToBase64String(source);
                        if(prepared["extraBase64"]!=null){arg["extraBase64"]=(string)prepared["extraBase64"];}
                        hasExtra=prepared["extraBase64"]!=null;
                    }
                    var references=prepared["references"] as Newtonsoft.Json.Linq.JArray;
                    if(references!=null)arg["references"]=references.DeepClone();
                    var expectedRefs=(isText?0:(hasExtra?2:1))+(references==null?0:references.Count);
                    if(expectedRefs>4)throw new System.Exception("参考图不能超过 4 张，未提交生成。");
                    checkCancelled();page("attach",arg);arg.Remove("base64");arg.Remove("extraBase64");arg.Remove("references");
                    // Text jobs must end with zero reference chips; image jobs keep 1 (or 2 with
                    // an extra reference). A leftover chip from a previous job must fail loudly.
                    arg["hasExtraImage"]=hasExtra;
                    // A reference chip can exist while it is still uploading, so the count is
                    // only half the gate: every chip must also report settled.
                    var deadline=System.DateTime.UtcNow.AddSeconds(90);
                    var referencesReady=false;
                    do {
                        checkCancelled();current=page("probe",empty);report(current,"ready");
                        referencesReady=(bool?)current["referencesReady"]==true;
                        if((int?)current["references"]==expectedRefs&&(expectedRefs==0||referencesReady))break;
                        System.Threading.Thread.Sleep(500);
                    }while(System.DateTime.UtcNow<deadline);
                    if((int?)current["references"]!=expectedRefs||(expectedRefs>0&&!referencesReady))
                        throw new System.Exception("Flow 未确认参考图或素材未就绪，未提交生成。");
                    checkCancelled();phase="configure";page("configure",arg);checkCancelled();phase="arm";page("arm",arg);armed=true;
                    // Persist uncertain submission BEFORE input. A crash from now on cannot
                    // requeue this job and cannot trigger a second generation.
                    post("/jobs/"+id+"/status",new Newtonsoft.Json.Linq.JObject{["status"]="unknown",["submissionSent"]=true,["error"]="已准备提交，等待 Flow 确认；不会自动重复提交。"});
                    checkCancelled();
                    // Flow ignores untrusted synthetic clicks, so ask the page for the send
                    // button centre and dispatch a real CDP mouse event there. This preserves
                    // the one-shot receipt above: the button locks itself after the first click.
                    // A hidden window can occasionally swallow the synthesised click before Flow
                    // reacts. Retry only while the page still proves nothing was submitted: the
                    // one-shot receipt exists, the prompt is still in the editor, the button is
                    // enabled and no watched request has been seen. Anything else aborts instead
                    // of risking a second generation.
                    var requested=false;var submitDeadline=System.DateTime.UtcNow.AddSeconds(45);
                    // A hidden owner window can leave the renderer without focus, which makes
                    // Chromium drop the first synthesised input. Focus emulation is a no-op for
                    // the page's own logic but keeps input delivery reliable; ignore hosts that
                    // do not expose the method.
                    try{cdp("Emulation.setFocusEmulationEnabled",new Newtonsoft.Json.Linq.JObject{["enabled"]=true}.ToString(Newtonsoft.Json.Formatting.None));}catch(System.Exception){}
                    for(var attempt=0;attempt<5&&!requested&&System.DateTime.UtcNow<submitDeadline;attempt++){
                        Newtonsoft.Json.Linq.JObject point;
                        // A transient disabled state (Flow re-validating the prompt/reference) makes
                        // Material swallow the click silently. Wait briefly and re-check instead of
                        // abandoning the job; the guard below still refuses to click twice.
                        try{point=page("submitPoint",arg);}
                        catch(System.Exception){
                            System.Threading.Thread.Sleep(900);
                            current=page("probe",empty);report(current,"ready");
                            if((int?)current["requests"]>0)requested=true;
                            continue;
                        }
                        var px=(double?)point["x"];
                        var py=(double?)point["y"];
                        if(px==null||py==null)throw new System.Exception("生成按钮不可见，未提交生成。");
                        cdp("Input.dispatchMouseEvent",new Newtonsoft.Json.Linq.JObject{["type"]="mouseMoved",["x"]=px,["y"]=py,["button"]="none",["clickCount"]=0}.ToString(Newtonsoft.Json.Formatting.None));
                        System.Threading.Thread.Sleep(120);
                        cdp("Input.dispatchMouseEvent",new Newtonsoft.Json.Linq.JObject{["type"]="mousePressed",["x"]=px,["y"]=py,["button"]="left",["buttons"]=1,["clickCount"]=1}.ToString(Newtonsoft.Json.Formatting.None));
                        System.Threading.Thread.Sleep(80);
                        cdp("Input.dispatchMouseEvent",new Newtonsoft.Json.Linq.JObject{["type"]="mouseReleased",["x"]=px,["y"]=py,["button"]="left",["buttons"]=0,["clickCount"]=1}.ToString(Newtonsoft.Json.Formatting.None));
                        var confirmDeadline=System.DateTime.UtcNow.AddSeconds(12);
                        do{
                            checkCancelled();current=page("probe",empty);report(current,"ready");
                            // Treat the button locking itself as acceptance even before the network
                            // counter ticks: Flow disables it the moment it takes the click, so a
                            // locked button means another dispatch would be a real second submit.
                            // A fresh output image equally proves acceptance when the endpoint sniffer
                            // misses a changed Flow URL.
                            if((int?)current["requests"]>0||(bool?)current["submitLocked"]==true||(int?)current["outputs"]>0){requested=true;break;}
                            System.Threading.Thread.Sleep(700);
                        }while(System.DateTime.UtcNow<confirmDeadline);
                        if(!requested)System.Threading.Thread.Sleep(600);
                    }
                    // Nothing on the wire proved Flow accepted the click. Waiting five minutes for
                    // outputs that were never requested only makes the panel claim "generating"
                    // while nothing is happening, so end this tick now. The one-shot receipt and
                    // the unknown status posted above stand: the job can still be harvested if the
                    // click did land late, and it will never be clicked a second time.
                    if(!requested)throw new System.Exception("Flow 提交无响应，等待 Flow 确认；不会自动重新提交。");
                    try{post("/jobs/"+id+"/status",new Newtonsoft.Json.Linq.JObject{["status"]="generating",["submissionSent"]=true,["error"]=null});}catch{}
                    deadline=System.DateTime.UtcNow.AddMinutes(5);
                    do {
                        checkCancelled();current=page("probe",empty);
                        var outputs=(int?)current["outputs"]??0;
                        var reqCount=(int?)current["requests"]??0;
                        var stage=outputs>0||reqCount>0||(bool?)current["submitLocked"]==true?"generating":"ready";
                        report(current,stage);
                        // Flow shows a blocked/failed attempt as an error tile that never becomes an
                        // image. Once every requested slot is resolved (image or error) there is
                        // nothing left to wait for; without this the loop would burn the full five
                        // minutes and then report a misleading "结果待确认".
                        if((int?)current["failures"]>0&&(outputs+((int?)current["failures"]??0))>=(int?)job["count"])break;
                        var responses=current["responses"] as Newtonsoft.Json.Linq.JArray;
                        if(responses!=null&&responses.Count>0){
                            foreach(var result in responses)if((int?)result["status"]!=200||!string.IsNullOrEmpty((string)result["error"]))throw new System.Exception("Flow 返回生成错误，请核对现有任务；不会重新提交。");
                        }
                        if(outputs>=(int?)job["count"])break;
                        System.Threading.Thread.Sleep(1000);
                    }while(System.DateTime.UtcNow<deadline);
                    // Flow resolved this job with at least one error tile. Upload whatever images did
                    // come back, then surface the terminal failure so the panel can say what happened
                    // instead of parking the job in a dead "unknown". The code decides whether the
                    // attempt is safe to retry (Flow says a policy block is not billed).
                    var freshFailures=(int?)current["failures"]??0;
                    if(freshFailures>0){
                        var available=System.Math.Min((int?)current["outputs"]??0,(int?)job["count"]??0);
                        for(int i=0;i<available;i++){
                            checkCancelled();
                            current["transferStage"]="reading";current["completedItems"]=i;report(current,"generating");
                            arg["index"]=i;var partial=page("readResults",arg);
                            var partialBytes=System.Convert.FromBase64String((string)partial["base64"]);
                            if(partialBytes.Length==0||partialBytes.Length>64*1024*1024)throw new System.Exception("生成图片大小无效。");
                            current["transferStage"]="transferring";report(current,"generating");
                            api("/jobs/"+id+"/result-upload?index="+i+"&aspect="+System.Uri.EscapeDataString((string)arg["aspect"])+"&assetKey="+System.Uri.EscapeDataString((string)partial["assetKey"]??"")+"&project="+System.Uri.EscapeDataString((string)partial["project"]??""),"POST",partialBytes,"image/png");
                        }
                        var code=(string)current["failureCode"];if(string.IsNullOrEmpty(code))code="generation_failed";
                        var detail=((string)current["failureText"]??"").Replace("\n"," ");
                        throw new System.Exception("PSFB_GENERATION_FAILED:"+code+":"+available+":"+detail);
                    }
                    if((int?)current["outputs"]!=(int?)job["count"])throw new System.Exception("Flow 结果待确认；查询不会重新生成。");
                    for(int i=0;i<(int)job["count"];i++){
                        checkCancelled();
                        current["transferStage"]="reading";current["completedItems"]=i;report(current,"generating");
                        arg["index"]=i;var output=page("readResults",arg);
                        var bytes=System.Convert.FromBase64String((string)output["base64"]);
                        if(bytes.Length==0||bytes.Length>64*1024*1024)throw new System.Exception("生成图片大小无效。");
                        current["transferStage"]="transferring";report(current,"generating");
                        api("/jobs/"+id+"/result-upload?index="+i+"&aspect="+System.Uri.EscapeDataString((string)arg["aspect"])+"&assetKey="+System.Uri.EscapeDataString((string)output["assetKey"]??"")+"&project="+System.Uri.EscapeDataString((string)output["project"]??""),"POST",bytes,"image/png");
                    }
                    report(current,"complete");responseValue["jobID"]=id;responseValue["completed"]=true;
                }catch(System.Exception error){
                    if(error.Message.Contains("PSFB_ALREADY_SUBMITTED"))armed=true;
                    if(!string.IsNullOrEmpty(id)&&!(error is System.OperationCanceledException)){
                        try{
                            var cfg=Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(System.IO.Path.Combine(dataRoot,"config.json")));
                            var req=(System.Net.HttpWebRequest)System.Net.WebRequest.Create("http://127.0.0.1:47831/api/jobs/"+id+"/status");
                            req.Proxy=null;req.Method="POST";req.Timeout=10000;req.ContentType="application/json";req.Headers["Authorization"]="Bearer "+(string)cfg["pairingToken"];
                            // A resolved generation failure is a real terminal state, not an uncertain
                            // submission: the controller only throws this after the page showed Flow's
                            // own error tile and every slot was accounted for. Report it as failed with
                            // the code so the helper can decide whether a retry is safe (Flow states a
                            // policy block is not billed) instead of parking the job in "unknown".
                            var body=new Newtonsoft.Json.Linq.JObject();
                            if(error.Message.StartsWith("PSFB_GENERATION_FAILED:",System.StringComparison.Ordinal)){
                                var parts=error.Message.Split(new[]{':'},4);
                                var code=parts.Length>1?parts[1]:"generation_failed";
                                var saved=parts.Length>2?parts[2]:"0";
                                var detail=parts.Length>3?parts[3]:"";
                                var charged=code!="policy_rejected";
                                body["status"]="failed";body["submissionSent"]=true;body["failureCode"]=code;body["charged"]=charged;
                                body["error"]=(code=="policy_rejected"
                                    ? "Flow 判定该提示词违反政策，未生成图片，本次生成不计费。请修改提示词后重试。"
                                    : "Flow 生成失败，未返回图片。请在 Flow 中确认后再决定是否重新生成。")
                                    +"（已完成 "+saved+" 张）"+(string.IsNullOrEmpty(detail)?"":" Flow 提示："+detail);
                            }else{
                                body["status"]=armed?"unknown":"failed";body["submissionSent"]=armed;body["error"]=error.Message;
                                if(!armed&&phase=="configure")body["failureCode"]="pre_submission_configuration";
                            }
                            var bytes=System.Text.Encoding.UTF8.GetBytes(body.ToString(Newtonsoft.Json.Formatting.None));req.ContentLength=bytes.Length;
                            using(var stream=req.GetRequestStream())stream.Write(bytes,0,bytes.Length);
                            try{using(var res=req.GetResponse()){}}
                            catch(System.Net.WebException){ /* 终端状态上报失败不影响主流程 */ }
                        }catch{}
                    }
                    responseValue["ok"]=false;responseValue["error"]=error.Message;responseValue["jobID"]=string.IsNullOrEmpty(id)?null:id;responseValue["submissionSent"]=armed;
                }finally{if(owned)gate.ReleaseMutex();}
                }
                context.SetVarValue("response",responseValue.ToString(Newtonsoft.Json.Formatting.None));
                return true;
            }
          runOnUiThread: background
  - name: PsFlowCommand
    variables:
      - key: request
        varType: text
        isInput: true
      - key: response
        varType: text
        isOutput: true
    steps:
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                var root = context.ReadState("packageRoot", null);
                if (string.IsNullOrWhiteSpace(root)) {
                    context.SetVarValue("response", "{\"ok\":false,\"error\":\"请先启动 PS Flow 侧边助手。\"}");
                    return false;
                }
                try {
                    var configPath = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge", "config.json");
                    var config = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(configPath));
                    var token = (string)config["pairingToken"];
                    if (string.IsNullOrWhiteSpace(token)) throw new System.Exception("本地连接尚未准备好，请重新打开动作。");
                    var request = (System.Net.HttpWebRequest)System.Net.WebRequest.Create("http://127.0.0.1:47831/api/action-command");
                    request.Proxy = null;
                    request.Method = "POST";
                    request.Timeout = 90000;
                    request.ReadWriteTimeout = 90000;
                    request.ContentType = "application/json; charset=utf-8";
                    request.Headers["Authorization"] = "Bearer " + token;
                    var bytes = new System.Text.UTF8Encoding(false).GetBytes(((string)context.GetVarValue("request")));
                    request.ContentLength = bytes.Length;
                    using (var stream = request.GetRequestStream()) stream.Write(bytes, 0, bytes.Length);
                    using (var response = request.GetResponse())
                    using (var reader = new System.IO.StreamReader(response.GetResponseStream(), System.Text.Encoding.UTF8)) {
                        var result = reader.ReadToEnd();
                        Newtonsoft.Json.Linq.JObject.Parse(result);
                        context.SetVarValue("response", result);
                    }
                    return true;
                } catch (System.Net.WebException error) {
                    var code = "(连接失败)"; var body = "";
                    try {
                        using (var er = error.Response as System.Net.HttpWebResponse) {
                            if (er != null) {
                                code = ((int)er.StatusCode).ToString();
                                using (var reader = new System.IO.StreamReader(er.GetResponseStream(), System.Text.Encoding.UTF8)) body = reader.ReadToEnd();
                            }
                        }
                    } catch { }
                    var detail = body.Length > 120 ? body.Substring(0, 120) : body;
                    context.SetVarValue("response", new Newtonsoft.Json.Linq.JObject {
                        ["ok"] = false, ["error"] = "操作请求失败（HTTP " + code + "，路径 /api/action-command）" + (string.IsNullOrEmpty(detail) ? "" : "：" + detail),
                        ["uncertain"] = true
                    }.ToString(Newtonsoft.Json.Formatting.None));
                    return false;
                } catch (System.Exception error) {
                    context.SetVarValue("response", new Newtonsoft.Json.Linq.JObject {
                        ["ok"] = false, ["error"] = "操作结果尚未确认，请查询当前任务。 " + error.Message,
                        ["uncertain"] = true
                    }.ToString(Newtonsoft.Json.Formatting.None));
                    return false;
                }
            }
          runOnUiThread: background


  - name: PsFlowSaveFile
    variables:
      - key: request
        varType: text
        isInput: true
      - key: savePath
        varType: text
      - key: savePicked
        varType: boolean
      - key: response
        varType: text
        isOutput: true
    steps:
      - selectFile:
          type: saveFile
          filter: PNG 图片|*.png
          defaultExt: .png
          initFileName: PSFlow.png
          title: 选择图片保存位置
          stopIfFail: false
          outputs:
            path: savePath
            isSuccess: savePicked
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                var target = System.Convert.ToString(context.GetVarValue("savePath"));
                var picked = System.Convert.ToBoolean(context.GetVarValue("savePicked")) && !string.IsNullOrWhiteSpace(target);
                var result = new Newtonsoft.Json.Linq.JObject { ["ok"] = picked, ["cancelled"] = !picked };
                if (picked) result["path"] = target;
                context.SetVarValue("response", result.ToString(Newtonsoft.Json.Formatting.None));
                return true;
            }
          runOnUiThread: background

  - name: PsFlowLogin
    variables:
      - key: cookies
        varType: text
        default: ""
      - key: result
        varType: text
        isOutput: true
    steps:
      - webview2:
          type: OpenUrl
          url: https://flow.google.com
          title: Flow 登录（动作内嵌）
          autoCloseKey: psfb-login
          modeForExists: BringToFront
          profileName: PSFlowBridge
          clearCookies: false
          winLocation: RightCenter
          winSize: 480,780
      - delay:
          delayMs: 500
      - webview2:
          type: CheckWindowState
          autoCloseKey: psfb-login
          outputs:
            cookies: cookies
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                // Bridge the Quicker WebView2 Flow session into the local Playwright profile.
                var result = new Newtonsoft.Json.Linq.JObject { ["ok"] = false, ["message"] = "" };
                try {
                    var cookies = ((string)context.GetVarValue("cookies")) ?? "";
                    if (string.IsNullOrWhiteSpace(cookies)) throw new System.Exception("内嵌登录窗口未返回登录 Cookie（若重复出现，说明该窗口没有带出 Cookie，请重试登录）。");
                    var stateRoot = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
                    var backendPath = System.IO.Path.Combine(stateRoot, "backend.json");
                    if (!System.IO.File.Exists(backendPath)) throw new System.Exception("生成服务尚未配置，请先打开一次 PS Flow 动作面板。");
                    var backend = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(backendPath));
                    if ((bool?)backend["enabled"] != true) throw new System.Exception("生成服务未启用，请在设置中开启 PS Flow 服务。");
                    var baseUrl = ((string)backend["baseUrl"] ?? "").TrimEnd('/');
                    var apiKey = (string)backend["apiKey"];
                    if (string.IsNullOrWhiteSpace(baseUrl) || string.IsNullOrWhiteSpace(apiKey)) throw new System.Exception("生成服务配置不完整。");
                    var request = (System.Net.HttpWebRequest)System.Net.WebRequest.Create(baseUrl + "/setup/import-cookies");
                    request.Proxy = null;
                    request.Method = "POST";
                    request.Timeout = 30000;
                    request.ReadWriteTimeout = 30000;
                    request.ContentType = "application/json; charset=utf-8";
                    request.Headers["Authorization"] = "Bearer " + apiKey;
                    var payload = new Newtonsoft.Json.Linq.JObject { ["cookies"] = cookies, ["origin"] = "https://flow.google.com" };
                    var bytes = new System.Text.UTF8Encoding(false).GetBytes(payload.ToString(Newtonsoft.Json.Formatting.None));
                    request.ContentLength = bytes.Length;
                    using (var stream = request.GetRequestStream()) stream.Write(bytes, 0, bytes.Length);
                    using (var response = request.GetResponse())
                    using (var reader = new System.IO.StreamReader(response.GetResponseStream(), System.Text.Encoding.UTF8)) {
                        var body = Newtonsoft.Json.Linq.JObject.Parse(reader.ReadToEnd());
                        var ready = (bool?)body["session_ready"] == true;
                        result["ok"] = true;
                        result["sessionReady"] = ready;
                        result["imported"] = body["imported"];
                        result["message"] = ready
                            ? "已通过动作内嵌窗口完成登录，会话已经就绪。"
                            : "登录 Cookie 已导入，但会话尚未确认；请在窗口中确认已进入 Flow。";
                    }
                } catch (System.Net.WebException error) {
                    var code = "(连接失败)"; var detail = error.Message;
                    try {
                        using (var response = error.Response)
                        {
                            if (response is System.Net.HttpWebResponse hr) code = ((int)hr.StatusCode).ToString();
                            using (var reader = new System.IO.StreamReader(response.GetResponseStream(), System.Text.Encoding.UTF8)) {
                                var body = Newtonsoft.Json.Linq.JObject.Parse(reader.ReadToEnd());
                                var message = (string)(body["error"]?["message"] ?? body["error"] ?? body["detail"]);
                                if (!string.IsNullOrWhiteSpace(message)) detail = message;
                            }
                        }
                    } catch { }
                    result["message"] = "登录会话导入失败（HTTP " + code + "，路径 /setup/import-cookies）：" + detail;
                } catch (System.Exception error) {
                    result["waitingForLogin"] = error.Message.Contains("未返回登录 Cookie");
                    result["message"] = error.Message;
                }
                context.SetVarValue("result", result.ToString(Newtonsoft.Json.Formatting.None));
                return null;
            }
          runOnUiThread: background
