$schema: quicker.program.source.v1
variables:
  - key: root
    varType: text
  - key: uiProbe
    varType: text
  - key: panelWindow
    varType: text
  - key: legacyRoot
    varType: text
  - key: needsUserMigration
    varType: boolean
  - key: maintenance
    varType: text
    default: ''
  - key: rollbackStateScript
    varType: text
  - key: migrationRevision
    varType: text
  - key: installRunning
    varType: boolean
    default: false
  - key: installDone
    varType: boolean
    default: false
  - key: installProgress
    varType: text
    default: '{"phase":"","detail":"","percent":-1}'
  - key: needsSetup
    varType: boolean
  - key: setupHtml
    varType: text
  - key: setupChoice
    varType: text
    default: ''
  - key: setupExpected
    varType: text
  - key: installMode
    varType: text
    default: ''
  - key: setupRequestId
    varType: text
    default: ''
  - key: installerRequest
    varType: text
    default: ''
  - key: installerSuccess
    varType: boolean
  - key: installerOutput
    varType: text
    default: ''
  - key: installerActionTitle
    varType: text
    default: ''
steps:
  - if:
      condition: '$=({quicker_in_param} ?? "").StartsWith("hd:")'
      then:
        - subProgram: PsFlowManagedDownload
          inputs:
            request: '$={quicker_in_param}.Substring(3)'
          outputs:
            response: uiProbe
        - stop:
  - if:
      condition: '$=new [] {"probe-managed-window","hide-managed-window","show-managed-window"}.Contains({quicker_in_param})'
      then:
        - subProgram: PsFlowManagedWindow
          inputs:
            operation: '$={quicker_in_param} == "probe-managed-window" ? "probe" : {quicker_in_param} == "hide-managed-window" ? "hide" : "show"'
          outputs:
            response: uiProbe
        - stop:
  - if:
      condition: '$=new [] {"probe-window","probe-state","collapse-window","expand-window","pin-window","auto-window"}.Contains({quicker_in_param})'
      then:
        - subProgram: PsFlowWindow
          inputs:
            operation: '$={quicker_in_param} == "collapse-window" ? "collapse" : {quicker_in_param} == "expand-window" ? "expand" : {quicker_in_param} == "pin-window" ? "toggle-topmost" : {quicker_in_param} == "auto-window" ? "toggle-autocollapse" : {quicker_in_param} == "probe-state" ? "probe-state" : "probe"'
          outputs:
            response: uiProbe
        - stop:
  - if:
      condition: '$={quicker_in_param} == "connect" || {quicker_in_param} == "probe-ui"'
      then:
        - if:
            condition: '$={quicker_in_param} == "connect"'
            then:
              - webview2:
                  type: ExecuteScript
                  autoCloseKey: '='
                  script: "document.getElementById('connect').click(); 'connecting'"
                  outputs:
                    scriptResult: uiProbe
            else:
              - webview2:
                  type: ExecuteScript
                  autoCloseKey: '='
                  script: "JSON.stringify({status:document.getElementById('status-text').textContent,message:document.getElementById('message').textContent,presets:document.querySelectorAll('[data-prompt]').length,capsule:document.body.classList.contains('is-capsule'),pin:document.getElementById('window-pin').getAttribute('aria-pressed'),autoCollapse:document.getElementById('window-auto-collapse').getAttribute('aria-pressed'),width:innerWidth,height:innerHeight,connectDisabled:document.getElementById('connect').disabled})"
                  outputs:
                    scriptResult: uiProbe
        - stop:
  - if:
      condition: '$=string.IsNullOrEmpty({quicker_in_param}) || {quicker_in_param} == "setup"'
      then:
        - csscript:
            script: |-
              var data = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
              var setupFile = System.IO.Path.Combine(data, "setup.json");
              var requested = context.GetVarValue<string>("quicker_in_param", "") ?? "";
              context.SetVarValue("needsSetup", false);
              context.SetVarValue("setupChoice", "");
              context.SetVarValue("installMode", "");
              var existing = System.IO.File.Exists(setupFile) ? System.IO.File.ReadAllText(setupFile) : "";
              if (existing.Length > 8192) throw new System.Exception("首次设置文件过大，原文件已保留，请检查后再启动。");
              var selected = "browser";
              if (existing.Length > 0) {
                  Newtonsoft.Json.Linq.JObject state = null;
                  try { state = Newtonsoft.Json.Linq.JObject.Parse(existing); }
                  catch { throw new System.Exception("首次设置文件无效，原设置已保留。"); }
                  if ((int?)state["schemaVersion"] != 1) throw new System.Exception("首次设置文件无效，原设置已保留。");
                  selected = (string)state["mode"] ?? "browser";
                  if (selected != "browser" && selected != "local") throw new System.Exception("首次设置文件无效，原设置已保留。");
                  var completed = (bool?)state["completed"] == true;
                  var runtimePresent = false;
                  try {
                      var curPointer = System.IO.Path.Combine(data, "apps", "current");
                      if (System.IO.File.Exists(curPointer)) {
                          var cName = (System.IO.File.ReadAllText(curPointer) ?? "").Trim();
                          if (!string.IsNullOrEmpty(cName)) {
                              var bFile = System.IO.Path.Combine(data, "apps", cName, "runtime-binding.json");
                              if (System.IO.File.Exists(bFile)) {
                                  var b = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(bFile));
                                  var dir = (string)b["directory"];
                                  if (!string.IsNullOrEmpty(dir)) {
                                      var candidate = System.IO.Path.Combine(data, "runtime", "portable", dir, "node.exe");
                                      if (System.IO.File.Exists(candidate)) runtimePresent = true;
                                  }
                              }
                          }
                      }
                      if (!runtimePresent) {
                          var portDir = System.IO.Path.Combine(data, "runtime", "portable");
                          if (System.IO.Directory.Exists(portDir)) {
                              foreach (var sub in System.IO.Directory.GetDirectories(portDir)) {
                                  if (System.IO.File.Exists(System.IO.Path.Combine(sub, "node.exe"))) {
                                      runtimePresent = true;
                                      break;
                                  }
                              }
                          }
                      }
                      if (!runtimePresent) {
                          if (System.IO.File.Exists(System.IO.Path.Combine(data, "runtime", "node.exe"))) runtimePresent = true;
                      }
                  } catch { }
                  if (completed && runtimePresent && requested != "setup") return true;
              } else {
                  var modeFile = System.IO.Path.Combine(data, "mode.json");
                  if (System.IO.File.Exists(modeFile)) {
                      var mode = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(modeFile));
                      if ((string)mode["mode"] == "local") selected = "local";
                  }
              }
              context.SetVarValue("needsSetup", true);
              context.SetVarValue("installMode", selected);
              context.SetVarValue("setupExpected", existing);
              // Bind this launch to one fresh request id; the downloader echoes it back and
              // the verify step refuses any other envelope (stale window, concurrent run).
              var requestId = "req-firstrun-local-" + System.Guid.NewGuid().ToString("N");
              context.SetVarValue("setupRequestId", requestId);
              context.SetVarValue("installerRequest", new Newtonsoft.Json.Linq.JObject {
                  ["protocolVersion"] = 1,
                  ["requestId"] = requestId,
                  ["expectedBuildId"] = "d65928024953cfc6",
                  ["op"] = "install",
                  ["mode"] = "local"
              }.ToString(Newtonsoft.Json.Formatting.None));
              context.SetVarValue("setupHtml", System.Text.Encoding.UTF8.GetString(System.Convert.FromBase64String("")));
              return true;
            runOnUiThread: background
        - if:
            condition: '$={needsSetup}'
            then:
              - webview2:
                  type: OpenUrlAndWaitClose
                  url:
                    var: setupHtml
                  title: PS Flow · 首次设置
                  autoCloseKey: psflow-first-run
                  defaultBgColor: '#26282b'
                  winLocation: CenterScreen
                  winSize: '460,660'
              - if:
                  condition: '$=string.IsNullOrEmpty({setupChoice})'
                  then:
                    - stop:
              - if:
                  condition: '$={setupChoice} == "download-local"'
                  then:
                    - runAction:
                        type: StartAction
                        # Use the exact installed title across recipient machines.
                        # Source catalog identity: dcde4403-c6f2-4d80-8231-c073e2504a71
                        actionId: '测试 PS Flow 下载包'
                        inputParam:
                          var: installerRequest
                        wait: true
                        stopIfFail: false
                        outputs:
                          isSuccess: installerSuccess
                          output: installerOutput
                          actionTitle: installerActionTitle
                    - csscript:
                        script: |-
                          var success = context.GetVarValue<bool>("installerSuccess", false);
                          var output = (context.GetVarValue<string>("installerOutput", "") ?? "").Trim();
                          var title = (context.GetVarValue<string>("installerActionTitle", "") ?? "").Trim();
                          var share = "https://getquicker.net/Sharedaction?code=dcde4403-c6f2-4d80-8231-c073e2504a71";
                          var expectedBuildId = "d65928024953cfc6";
                          var requestId = (context.GetVarValue<string>("setupRequestId", "") ?? "").Trim();
                          if (requestId.Length != 51 || !requestId.StartsWith("req-firstrun-local-")) {
                              throw new System.Exception("本次首次设置缺少请求标识，未执行安装。请关闭窗口后重新打开助手。");
                          }
                          System.Guid requestGuid;
                          if (!System.Guid.TryParseExact(requestId.Substring("req-firstrun-local-".Length), "N", out requestGuid)) {
                              throw new System.Exception("本次首次设置请求标识无效，未执行安装。请关闭窗口后重新打开助手。");
                          }
                          Newtonsoft.Json.Linq.JObject res = null;
                          if (!string.IsNullOrEmpty(output)) {
                              try {
                                  res = Newtonsoft.Json.Linq.JObject.Parse(output);
                              } catch {
                                  throw new System.Exception("组件下载动作返回的结果格式无效。请检查下载动作是否为最新版本。\n网页地址：" + share);
                              }
                          }
                          if ((bool?)res?["cancelled"] == true) {
                              context.SetVarValue("setupChoice", "");
                              context.SetVarValue("setupRequestId", "");
                              return true;
                          }
                          if (!success) {
                              if (string.IsNullOrEmpty(title)) {
                                  throw new System.Exception("未找到组件下载动作。请从下载动作网页安装后重试；原设置和记录已保留。\n网页地址：" + share);
                              }
                              throw new System.Exception("组件下载动作“" + title + "”执行失败，没有返回可用结果。请更新下载动作后重试；原设置和记录已保留。\n网页地址：" + share);
                          }
                          if (res == null) {
                              throw new System.Exception("组件下载动作已运行，但没有返回执行结果。请确认下载已完成，或从网页更新下载动作后重试：\n" + share);
                          }
                          if ((bool?)res["ok"] != true) {
                              var err = (string)res["error"] ?? "运行组件准备未完成。";
                              throw new System.Exception("组件准备失败：" + err);
                          }
                          if ((string)res["productId"] != "PSFlowBridge" || (int?)res["protocolVersion"] != 1 ||
                              (string)res["operation"] != "install" ||
                              (string)res["effectiveMode"] != "local" ||
                              (string)res["buildId"] != expectedBuildId) {
                              throw new System.Exception("组件准备动作版本不兼容，请从网页更新下载动作：\n" + share);
                          }
                          if ((string)res["requestId"] != requestId) {
                              throw new System.Exception("组件准备结果与本次设置请求不匹配，可能来自其他窗口或旧任务，未保存设置。请重新打开助手。");
                          }
                          return true;
                        runOnUiThread: background
              - if:
                  condition: '$=string.IsNullOrEmpty({setupChoice})'
                  then:
                    - stop:
  - assign:
      input: '$=new [] {"repair-runtime","rollback-app","install-local"}.Contains({quicker_in_param} ?? "") ? {quicker_in_param} : ""'
      >>: maintenance
  - csscript:
      script: |
        context.SetVarValue("needsUserMigration",false);
        context.SetVarValue("migrationRevision","");
        var data=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData),"PSFlowBridge");
        var stateFile=System.IO.Path.Combine(data,"user-state.json");
        {
          var pointer=System.IO.Path.Combine(data,"apps","current");
          if(System.IO.File.Exists(pointer)) {
            var build=System.IO.File.ReadAllText(pointer).Trim();
            if(!System.Text.RegularExpressions.Regex.IsMatch(build,"^[0-9a-f]{16}(?:-repair-[0-9a-f]+)?$"))throw new System.Exception("原版本位置无效，未迁移用户设置。");
            var oldRoot=System.IO.Path.Combine(data,"apps",build,"PSFlowBridge-package");
            var oldPanel=System.IO.Path.Combine(oldRoot,"action-ui","panel.html");
            if(System.IO.File.Exists(oldPanel)&&(!System.IO.File.Exists(stateFile)||!System.IO.File.ReadAllText(oldPanel).Contains("user-state-client-js:begin"))) {
              if(System.IO.File.Exists(stateFile)) {
                var state=Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(stateFile));
                var revision=(long?)state["revision"]??0;
                if((int?)state["schemaVersion"]!=1||revision<1)throw new System.Exception("用户设置格式无效，未覆盖数据。");
                context.SetVarValue("migrationRevision",revision.ToString(System.Globalization.CultureInfo.InvariantCulture));
              }
              context.SetVarValue("legacyRoot",oldRoot);
              context.SetVarValue("needsUserMigration",true);
            }
          }
        }
        return true;
      runOnUiThread: background
  - if:
      condition: '$={needsUserMigration}'
      then:
        - webview2:
            type: OpenAndWaitLoad
            url: '$=Path.Combine({legacyRoot}, "action-ui", "panel.html")'
            title: PS Flow 侧边助手
            autoCloseKey: '='
            modeForExists: SkipThisStep
            defaultBgColor: '#26282b'
            winLocation: RightCenter
            winSize: '360,680'
        - webview2:
            type: ExecuteScript
            autoCloseKey: '='
            script: "(()=>{const p=document.getElementById('prompt');if(p)p.dispatchEvent(new Event('blur'));return JSON.stringify({url:location.href,values:Object.fromEntries(['psflow.action-ui.v1','psflow.text-draft.v1','psflow.generation-kind','psflow_drafts','psflow.personal-presets.v1','psflow.personal-presets.v2'].map(k=>[k,localStorage.getItem(k)]).filter(p=>p[1]!==null))});})()"
            outputs:
              scriptResult: uiProbe
        - csscript:
            script: |
              var raw=context.GetVarValue<string>("uiProbe");
              var snapshot=Newtonsoft.Json.Linq.JObject.Parse(raw);
              var expectedPanel=System.IO.Path.GetFullPath(System.IO.Path.Combine(context.GetVarValue<string>("legacyRoot"),"action-ui","panel.html"));
              System.Uri oldPanel;
              if(!System.Uri.TryCreate((string)snapshot["url"],System.UriKind.Absolute,out oldPanel)||!oldPanel.IsFile||!string.Equals(System.IO.Path.GetFullPath(oldPanel.LocalPath),expectedPanel,System.StringComparison.OrdinalIgnoreCase))throw new System.Exception("原面板位置不匹配，未迁移或覆盖用户数据。");
              var values=snapshot["values"] as Newtonsoft.Json.Linq.JObject;
              if(values==null)throw new System.Exception("原面板未返回有效设置，未覆盖数据。");
              var keys=new System.Collections.Generic.HashSet<string>(new[]{"psflow.action-ui.v1","psflow.text-draft.v1","psflow.generation-kind","psflow_drafts","psflow.personal-presets.v1","psflow.personal-presets.v2"});
              foreach(var item in values.Properties())if(!keys.Contains(item.Name)||item.Value.Type!=Newtonsoft.Json.Linq.JTokenType.String)throw new System.Exception("原用户设置格式无效，未覆盖数据。");
              if(System.Text.Encoding.UTF8.GetByteCount(values.ToString(Newtonsoft.Json.Formatting.None))>4*1024*1024)throw new System.Exception("原用户设置过大，未覆盖数据。");
              var data=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData),"PSFlowBridge");
              var file=System.IO.Path.Combine(data,"user-state.json");
              using(var migrationLock=new System.Threading.Mutex(false,"Local\\PSFlowUserStateMigration")) {
                var acquired=false;
                try {
                  try{acquired=migrationLock.WaitOne(5000);}catch(System.Threading.AbandonedMutexException){acquired=true;}
                  if(!acquired)throw new System.Exception("用户设置迁移正在进行，请稍后重开助手。");
                  var expected=context.GetVarValue<string>("migrationRevision")??"";
                  var exists=System.IO.File.Exists(file);
                  if(exists&&expected.Length==0)return true;
                  long revision=0;
                  if(expected.Length>0) {
                    if(!exists)throw new System.Exception("用户设置已变化，未覆盖数据，请重新打开助手。");
                    var currentRaw=System.IO.File.ReadAllText(file);
                    if(System.Text.Encoding.UTF8.GetByteCount(currentRaw)>4*1024*1024+8192)throw new System.Exception("用户设置过大，未覆盖原文件。");
                    var current=Newtonsoft.Json.Linq.JObject.Parse(currentRaw);
                    revision=(long?)current["revision"]??0;
                    if((int?)current["schemaVersion"]!=1||revision.ToString(System.Globalization.CultureInfo.InvariantCulture)!=expected)throw new System.Exception("另一个窗口已更新设置，未覆盖数据，请重新打开助手。");
                    var currentValues=current["values"] as Newtonsoft.Json.Linq.JObject;
                    if(currentValues==null)throw new System.Exception("用户设置损坏，未覆盖原文件。");
                    foreach(var item in currentValues.Properties())if(!keys.Contains(item.Name)||item.Value.Type!=Newtonsoft.Json.Linq.JTokenType.String)throw new System.Exception("用户设置损坏，未覆盖原文件。");
                  }
              var encoded=new System.Text.UTF8Encoding(false).GetBytes(new Newtonsoft.Json.Linq.JObject(new Newtonsoft.Json.Linq.JProperty("schemaVersion",1),new Newtonsoft.Json.Linq.JProperty("revision",revision+1),new Newtonsoft.Json.Linq.JProperty("values",values)).ToString(Newtonsoft.Json.Formatting.Indented));
                var backup=file+".legacy.json";
                if(!System.IO.File.Exists(backup))using(var stream=new System.IO.FileStream(backup,System.IO.FileMode.CreateNew,System.IO.FileAccess.Write,System.IO.FileShare.Read))stream.Write(encoded,0,encoded.Length);
                var temporary=file+"."+System.Guid.NewGuid().ToString("N")+".tmp";
                try {System.IO.File.WriteAllBytes(temporary,encoded);if(exists)System.IO.File.Replace(temporary,file,file+".before-legacy-"+System.Guid.NewGuid().ToString("N")+".json");else try{System.IO.File.Move(temporary,file);}catch(System.IO.IOException){if(!System.IO.File.Exists(file))throw;}}
                finally {if(System.IO.File.Exists(temporary))System.IO.File.Delete(temporary);}
                } finally {if(acquired)migrationLock.ReleaseMutex();}
              }
              return true;
            runOnUiThread: background
        - webview2:
            type: Close
            autoCloseKey: '='
  - notify:
      type: Info
      msg: ⚡ PS Flow 侧边助手启动中…
  - webview2:
      type: Close
      autoCloseKey: psfb-install-progress
  - csscript:
      script: |-
        var stateRoot = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
        var script = System.Text.Encoding.UTF8.GetString(System.Convert.FromBase64String(""));
        var expectedScript = "32197210f72d091ad98430c3b23bc2328e7ea172969a38404382bbd5b7399e97";
        var installerDir = System.IO.Path.Combine(stateRoot,"installers",expectedScript.Substring(0,16));
        System.IO.Directory.CreateDirectory(installerDir);
        var installer = System.IO.Path.Combine(installerDir,"Install.ps1");
        System.Func<string,string> hash = file => {
            using(var algorithm=System.Security.Cryptography.SHA256.Create())
            using(var stream=System.IO.File.OpenRead(file))
                return System.BitConverter.ToString(algorithm.ComputeHash(stream)).Replace("-","").ToLowerInvariant();
        };
        using(var mutex=new System.Threading.Mutex(false,"Local\\PSFlowBridgeInstallerSource")) {
            var acquired=false;
            try {
                try{acquired=mutex.WaitOne(10000);}catch(System.Threading.AbandonedMutexException){acquired=true;}
                if(!acquired)throw new System.Exception("运行入口正在准备，请稍后重开。");
                if(!System.IO.File.Exists(installer)||hash(installer)!=expectedScript) {
                    var temporary=installer+"."+System.Guid.NewGuid().ToString("N")+".tmp";
                    try {
                        System.IO.File.WriteAllText(temporary,script,new System.Text.UTF8Encoding(false));
                        if(hash(temporary)!=expectedScript)throw new System.Exception("安装入口校验失败，未启动。");
                        if(System.IO.File.Exists(installer))System.IO.File.Replace(temporary,installer,null);
                        else System.IO.File.Move(temporary,installer);
                    } finally {if(System.IO.File.Exists(temporary))System.IO.File.Delete(temporary);}
                }
            } finally {if(acquired)mutex.ReleaseMutex();}
        }
        var operation="";
        try { operation=context.GetVarValue<string>("op","")??""; } catch { }
        if(string.IsNullOrEmpty(operation)){try{operation=context.GetVarValue<string>("maintenance","")??"";}catch{}}
        if(operation=="install")operation="";
        var validOps=new System.Collections.Generic.HashSet<string>{
            "","inspect","install-local","repair-runtime","rollback-app","clear-cache","remove-local","uninstall-runtime","delete-user-data","remove-components"
        };
        if(!validOps.Contains(operation))throw new System.Exception("维护操作无效："+operation);
        var installMode="";
        try { installMode=context.GetVarValue<string>("installMode","")??""; } catch { }
        if(string.IsNullOrEmpty(installMode)){try{installMode=context.GetVarValue<string>("mode","")??"";}catch{}}
        if(installMode!=""&&installMode!="browser"&&installMode!="local")throw new System.Exception("运行方式无效。");
        var expectedBuildId="";
        try { expectedBuildId=context.GetVarValue<string>("expectedBuildId","")??""; } catch { }
        var requestId="";
        try { requestId=context.GetVarValue<string>("requestId","")??""; } catch { }
        var confirmDelete=false;
        try { confirmDelete=context.GetVarValue<bool>("confirmDeleteData",false); } catch { }
        var statusFile=System.IO.Path.Combine(System.IO.Path.GetTempPath(),"psfb-distribution-"+System.Guid.NewGuid().ToString("N")+".json");
        var outerProgressFile=System.Environment.GetEnvironmentVariable("PSFB_INSTALL_PROGRESS_FILE");
        var progressFile=!string.IsNullOrEmpty(outerProgressFile)?outerProgressFile:System.IO.Path.Combine(System.IO.Path.GetTempPath(),"psfb-install-progress-"+System.Guid.NewGuid().ToString("N")+".json");
        var isProgressOwner=string.IsNullOrEmpty(outerProgressFile) && (operation==""||operation=="install-local"||operation=="repair-runtime"||operation=="rollback-app");
        context.SetVarValue("installRunning",false);
        context.SetVarValue("installDone",false);
        var initProgress = new Newtonsoft.Json.Linq.JObject();
        initProgress["phase"] = "prepare";
        initProgress["detail"] = "正在准备运行环境";
        initProgress["percent"] = 0;
        context.SetVarValue("installProgress",initProgress.ToString(Newtonsoft.Json.Formatting.None));
        System.Windows.Window progressWin = null;
        System.Windows.Threading.Dispatcher progressDispatcher = null;
        System.Windows.Controls.ProgressBar pBar = null;
        System.Windows.Controls.TextBlock pMsg = null;
        System.Windows.Controls.TextBlock pPct = null;
        System.Threading.Thread progressUiThread = null;
        bool progressFinished = false;
        if (isProgressOwner) {
            var readyEvt = new System.Threading.ManualResetEventSlim(false);
            progressUiThread = new System.Threading.Thread(() => {
                try {
                    if (progressFinished) { readyEvt.Set(); return; }
                    var w = new System.Windows.Window {
                        Title = "PS Flow · 安装进度",
                        Width = 360,
                        Height = 220,
                        WindowStartupLocation = System.Windows.WindowStartupLocation.CenterScreen,
                        ResizeMode = System.Windows.ResizeMode.NoResize,
                        Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(38, 40, 43)),
                        ShowActivated = false,
                        Visibility = System.Windows.Visibility.Hidden
                    };
                    var stack = new System.Windows.Controls.StackPanel { Margin = new System.Windows.Thickness(24, 22, 24, 22) };
                    var title = new System.Windows.Controls.TextBlock {
                        Text = "PS Flow 正在准备运行组件",
                        FontSize = 14,
                        FontWeight = System.Windows.FontWeights.SemiBold,
                        Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(230, 230, 230)),
                        Margin = new System.Windows.Thickness(0, 0, 0, 14)
                    };
                    pBar = new System.Windows.Controls.ProgressBar {
                        Height = 8,
                        IsIndeterminate = true,
                        Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(58, 61, 66)),
                        Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(91, 157, 255))
                    };
                    var row = new System.Windows.Controls.Grid { Margin = new System.Windows.Thickness(0, 10, 0, 0) };
                    row.ColumnDefinitions.Add(new System.Windows.Controls.ColumnDefinition { Width = new System.Windows.GridLength(1, System.Windows.GridUnitType.Star) });
                    row.ColumnDefinitions.Add(new System.Windows.Controls.ColumnDefinition { Width = System.Windows.GridLength.Auto });
                    pMsg = new System.Windows.Controls.TextBlock {
                        Text = "正在准备…",
                        FontSize = 12,
                        Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(154, 160, 166)),
                        TextTrimming = System.Windows.TextTrimming.CharacterEllipsis
                    };
                    pPct = new System.Windows.Controls.TextBlock {
                        Text = "",
                        FontSize = 12,
                        Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(200, 204, 208)),
                        Margin = new System.Windows.Thickness(10, 0, 0, 0)
                    };
                    System.Windows.Controls.Grid.SetColumn(pMsg, 0);
                    System.Windows.Controls.Grid.SetColumn(pPct, 1);
                    row.Children.Add(pMsg);
                    row.Children.Add(pPct);
                    stack.Children.Add(title);
                    stack.Children.Add(pBar);
                    stack.Children.Add(row);
                    w.Content = stack;
                    progressWin = w;
                    progressDispatcher = w.Dispatcher;
                    readyEvt.Set();
                    if (progressFinished) {
                        try { w.Close(); } catch { }
                        return;
                    }
                    System.Windows.Threading.Dispatcher.Run();
                } catch { readyEvt.Set(); }
            });
            progressUiThread.SetApartmentState(System.Threading.ApartmentState.STA);
            progressUiThread.IsBackground = true;
            progressUiThread.Start();
            readyEvt.Wait(1000);
        }
        try {
            var start=new System.Diagnostics.ProcessStartInfo {
                FileName=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.Windows),"System32","WindowsPowerShell","v1.0","powershell.exe"),
                Arguments="-NoProfile -ExecutionPolicy Bypass -File \""+installer+"\""+
                    (operation.Length>0?" -Maintenance \""+operation+"\"":"")+
                    (installMode.Length>0?" -Mode \""+installMode+"\"":"")+
                    (expectedBuildId.Length>0?" -ExpectedBuildId \""+expectedBuildId+"\"":"")+
                    (requestId.Length>0?" -RequestId \""+requestId+"\"":"")+
                    (confirmDelete?" -ConfirmDeleteData":""),
                UseShellExecute=false,CreateNoWindow=true,WindowStyle=System.Diagnostics.ProcessWindowStyle.Hidden,
                RedirectStandardOutput=true,RedirectStandardError=true
            };
            start.EnvironmentVariables["PSFB_INSTALL_STATUS_FILE"]=statusFile;
            start.EnvironmentVariables["PSFB_INSTALL_PROGRESS_FILE"]=progressFile;
            var effectiveOp = (string.IsNullOrEmpty(operation) || operation == "install") ? "install" : operation;
            System.DateTime initialOuterFileTime = System.DateTime.MinValue;
            bool initialOuterFileExisted = false;
            if (!isProgressOwner && System.IO.File.Exists(progressFile)) {
                initialOuterFileExisted = true;
                initialOuterFileTime = System.IO.File.GetLastWriteTimeUtc(progressFile);
            }
            context.SetVarValue("installRunning",true);
            using(var process=System.Diagnostics.Process.Start(start)) {
                process.BeginOutputReadLine();
                process.BeginErrorReadLine();
                var deadline=System.DateTime.UtcNow.AddSeconds(600);
                var startTime=System.DateTime.UtcNow;
                bool windowShown = false;
                while(!process.WaitForExit(700)) {
                    try {
                        if(System.IO.File.Exists(progressFile)) {
                            if (initialOuterFileExisted && System.IO.File.GetLastWriteTimeUtc(progressFile) == initialOuterFileTime) {
                                // stale external progress file from before this launch
                            } else {
                                initialOuterFileExisted = false;
                                string ptext = null;
                                try {
                                    using (var fs = new System.IO.FileStream(progressFile, System.IO.FileMode.Open, System.IO.FileAccess.Read, System.IO.FileShare.ReadWrite))
                                    using (var sr = new System.IO.StreamReader(fs, System.Text.Encoding.UTF8)) {
                                        ptext = sr.ReadToEnd();
                                    }
                                } catch { }
                                if(!string.IsNullOrEmpty(ptext)) {
                                    try {
                                        var pObj = Newtonsoft.Json.Linq.JObject.Parse(ptext);
                                        var pPhase = (string)pObj["phase"];
                                        if (!string.IsNullOrEmpty(pPhase)) {
                                            context.SetVarValue("installProgress",ptext);
                                            if (progressDispatcher != null && progressWin != null) {
                                                var pPctVal = (int?)pObj["percent"] ?? -1;
                                                var pDetailVal = (string)pObj["detail"] ?? pPhase ?? "正在准备…";
                                                progressDispatcher.BeginInvoke(new System.Action(() => {
                                                    if (pPctVal >= 0) {
                                                        pBar.IsIndeterminate = false;
                                                        pBar.Value = System.Math.Max(0, System.Math.Min(100, pPctVal));
                                                        pPct.Text = pPctVal + "%";
                                                    } else {
                                                        pBar.IsIndeterminate = true;
                                                        pPct.Text = "";
                                                    }
                                                    pMsg.Text = pDetailVal;
                                                }));
                                            }
                                        }
                                    } catch (System.Exception parseEx) {
                                        try { context.SetVarValue("diag:progressParseError", parseEx.Message); } catch { }
                                    }
                                }
                            }
                        }
                        if (!windowShown && (System.DateTime.UtcNow - startTime).TotalMilliseconds >= 1200) {
                            if (!progressFinished && progressDispatcher != null && progressWin != null) {
                                progressDispatcher.BeginInvoke(new System.Action(() => {
                                    if (progressFinished) return;
                                    progressWin.Visibility = System.Windows.Visibility.Visible;
                                    progressWin.Show();
                                }));
                                windowShown = true;
                            }
                        }
                    } catch {}
                    if(System.DateTime.UtcNow>=deadline) {
                        try{process.Kill();}catch{}
                        var timeoutObj = new Newtonsoft.Json.Linq.JObject();
                        timeoutObj["protocolVersion"] = 1;
                        timeoutObj["productId"] = "PSFlowBridge";
                        timeoutObj["operation"] = effectiveOp;
                        if (!string.IsNullOrEmpty(requestId)) timeoutObj["requestId"] = requestId;
                        timeoutObj["ok"] = false;
                        timeoutObj["status"] = "failed";
                        timeoutObj["error"] = "准备超时（已等待超过 600 秒），请先查询当前运行状态再重试。";
                        var timeoutJson = timeoutObj.ToString(Newtonsoft.Json.Formatting.None);
                        try { context.SetVarValue("installerResult", timeoutJson); } catch { }
                        try { context.SetVarValue("response", timeoutJson); } catch { }
                        throw new System.Exception((string)timeoutObj["error"]);
                    }
                }
                try { if(System.IO.File.Exists(progressFile)) { var text=System.IO.File.ReadAllText(progressFile); if(!string.IsNullOrEmpty(text)) context.SetVarValue("installProgress",text); } } catch {}
                if(!System.IO.File.Exists(statusFile)) {
                    var failObj = new Newtonsoft.Json.Linq.JObject();
                    failObj["protocolVersion"] = 1;
                    failObj["productId"] = "PSFlowBridge";
                    failObj["operation"] = effectiveOp;
                    if (!string.IsNullOrEmpty(requestId)) failObj["requestId"] = requestId;
                    failObj["ok"] = false;
                    failObj["status"] = "failed";
                    failObj["error"] = "Installer process exited with code " + process.ExitCode + " without writing status file.";
                    var failJson = failObj.ToString(Newtonsoft.Json.Formatting.None);
                    try { context.SetVarValue("installerResult", failJson); } catch { }
                    try { context.SetVarValue("response", failJson); } catch { }
                    throw new System.Exception((string)failObj["error"]);
                }
                var result=Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(statusFile));
                var rawJson=result.ToString(Newtonsoft.Json.Formatting.None);
                try { context.SetVarValue("installerResult",rawJson); } catch { }
                try { context.SetVarValue("response",rawJson); } catch { }
                if(process.ExitCode!=0||(bool?)result["ok"]!=true)throw new System.Exception((string)result["error"]??"运行组件准备失败。");
                var isNonRunningOp=(operation=="inspect"||operation=="remove-components"||operation=="clear-cache"||operation=="remove-local"||operation=="uninstall-runtime"||operation=="delete-user-data");
                if(isNonRunningOp)return true;
                var root=(string)result["packageRoot"];var node=(string)result["nodePath"];
                if(string.IsNullOrEmpty(root)||string.IsNullOrEmpty(node)||!System.IO.File.Exists(System.IO.Path.Combine(root,"action-ui","panel.html"))||!System.IO.File.Exists(node))throw new System.Exception("运行位置无效，未打开面板。");
                context.WriteState("packageRoot",root);context.WriteState("nodePath",node);
                context.SetVarValue("root",root);
            }
        } finally {
            context.SetVarValue("installDone",true);
            context.SetVarValue("installRunning",false);
            progressFinished = true;
            if (progressDispatcher != null) {
                try {
                    progressDispatcher.BeginInvoke(new System.Action(() => {
                        try {
                            if (progressWin != null) {
                                progressWin.Close();
                            }
                        } catch { }
                        try {
                            progressDispatcher.InvokeShutdown();
                        } catch { }
                    }));
                } catch {}
            }
            if (progressUiThread != null) {
                try {
                    progressUiThread.Join(1500);
                } catch { }
            }
            try{if(System.IO.File.Exists(statusFile))System.IO.File.Delete(statusFile);}catch{}
            if(isProgressOwner){try{if(System.IO.File.Exists(progressFile))System.IO.File.Delete(progressFile);}catch{}}
        }
        return true;
      runOnUiThread: background
  - csscript:
      script: |-
        if (string.IsNullOrEmpty(context.GetVarValue<string>("setupChoice", ""))) return true;
        var selected = context.GetVarValue<string>("installMode", "");
        if (selected != "browser" && selected != "local") throw new System.Exception("运行方式未确认，未保存首次设置。");
        var data = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
        var config = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(System.IO.Path.Combine(data, "config.json")));
        Newtonsoft.Json.Linq.JObject health = null;
        System.Func<Newtonsoft.Json.Linq.JObject> TryHealth = () => {
            var req = (System.Net.HttpWebRequest)System.Net.WebRequest.Create("http://127.0.0.1:47831/api/health");
            req.Timeout = 5000;
            req.Headers["Authorization"] = "Bearer " + (string)config["pairingToken"];
            using (var response = (System.Net.HttpWebResponse)req.GetResponse())
            using (var reader = new System.IO.StreamReader(response.GetResponseStream())) return Newtonsoft.Json.Linq.JObject.Parse(reader.ReadToEnd());
        };
        var attempts = 0; var statusText = "(连接失败)";
        while (attempts < 20) {
            attempts++;
            try { health = TryHealth(); break; }
            catch (System.Net.WebException we) {
                try {
                    using (var er = we.Response as System.Net.HttpWebResponse)
                        statusText = er != null ? ((int)er.StatusCode).ToString() : "(连接失败)";
                } catch { statusText = "(连接失败)"; }
                System.Threading.Thread.Sleep(500);
                health = null;
            }
        }
        if (health == null) throw new System.Exception("本地服务未就绪或端口被其它程序占用（状态码 " + statusText + "，路径 /api/health）。请稍等几秒，或关闭占用 47831 端口的程序后重试。");
        if ((string)health["app"] != "PSFlowBridge" || (string)health["effectiveMode"] != selected || (bool?)health["draining"] != false) throw new System.Exception("安装后的运行方式未通过检查，首次设置尚未保存。");
        var file = System.IO.Path.Combine(data, "setup.json");
        using (var mutex = new System.Threading.Mutex(false, "Local\\PSFlowBridgeFirstRun")) {
            var acquired = false;
            try {
                try { acquired = mutex.WaitOne(5000); } catch (System.Threading.AbandonedMutexException) { acquired = true; }
                if (!acquired) throw new System.Exception("另一个首次设置正在保存，请稍后再试。");
                var current = System.IO.File.Exists(file) ? System.IO.File.ReadAllText(file) : "";
                if (current != (context.GetVarValue<string>("setupExpected", "") ?? "")) throw new System.Exception("另一个窗口已更新首次设置，请重新打开助手。");
                var snapshot = new Newtonsoft.Json.Linq.JObject { ["schemaVersion"] = 1, ["completed"] = true, ["mode"] = selected, ["updatedAt"] = System.DateTime.UtcNow.ToString("o") };
                var temporary = file + "." + System.Guid.NewGuid().ToString("N") + ".tmp";
                try {
                    System.IO.File.WriteAllText(temporary, snapshot.ToString(Newtonsoft.Json.Formatting.Indented), new System.Text.UTF8Encoding(false));
                    if (System.IO.File.Exists(file)) System.IO.File.Replace(temporary, file, null); else System.IO.File.Move(temporary, file);
                } finally { if (System.IO.File.Exists(temporary)) System.IO.File.Delete(temporary); }
            } finally { if (acquired) mutex.ReleaseMutex(); }
        }
        return true;
      runOnUiThread: background
