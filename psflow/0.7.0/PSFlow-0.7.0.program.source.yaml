  - if:
      condition: '$={maintenance} == "rollback-app"'
      then:
        - csscript:
            script: |
              var data=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData),"PSFlowBridge");
              var file=System.IO.Path.Combine(data,"user-state.json");
              context.SetVarValue("rollbackStateScript","'no fixed settings to restore'");
              if(System.IO.File.Exists(file)) {
                var raw=System.IO.File.ReadAllText(file);
                if(System.Text.Encoding.UTF8.GetByteCount(raw)>4*1024*1024+8192)throw new System.Exception("用户设置过大，未覆盖回退版本的设置。");
                var snapshot=Newtonsoft.Json.Linq.JObject.Parse(raw);
                var values=snapshot["values"] as Newtonsoft.Json.Linq.JObject;
                var keys=new[]{"psflow.action-ui.v1","psflow.text-draft.v1","psflow.generation-kind","psflow_drafts","psflow.personal-presets.v1","psflow.personal-presets.v2"};
                if((int?)snapshot["schemaVersion"]!=1||((long?)snapshot["revision"]??0)<1||values==null)throw new System.Exception("用户设置格式无效，原数据已保留。");
                foreach(var item in values.Properties())if(!System.Linq.Enumerable.Contains(keys,item.Name)||item.Value.Type!=Newtonsoft.Json.Linq.JTokenType.String)throw new System.Exception("用户设置包含不支持的数据，未覆盖回退版本。");
                var script="(()=>{if(window.PSFlowUserState)return 'fixed settings supported';const values="+values.ToString(Newtonsoft.Json.Formatting.None)+",keys="+Newtonsoft.Json.JsonConvert.SerializeObject(keys)+";const restore=()=>{for(const k of keys){if(Object.prototype.hasOwnProperty.call(values,k))localStorage.setItem(k,values[k]);else localStorage.removeItem(k);}};restore();window.addEventListener('pagehide',restore,{once:true});location.reload();return 'settings restored';})()";
                context.SetVarValue("rollbackStateScript",script);
              }
              return true;
            runOnUiThread: background
        - webview2:
            type: ExecuteScript
            autoCloseKey: '='
            script: '$={rollbackStateScript}'
  - csscript:
      script: |-
        // Only the panel HWND returned by WebView2 may be controlled. Foreground lookup is read-only.
        public class PsFlowPanelWindow
        {
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool IsWindow(System.IntPtr hwnd);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern System.IntPtr GetAncestor(System.IntPtr hwnd, uint flags);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(System.IntPtr hwnd, out uint pid);
            [System.Runtime.InteropServices.DllImport("user32.dll", EntryPoint="GetWindowLongW")] static extern int GetStyle(System.IntPtr hwnd, int index);
            [System.Runtime.InteropServices.DllImport("user32.dll", EntryPoint="SetWindowLongW")] static extern int SetStyle(System.IntPtr hwnd, int index, int style);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool SetWindowPos(System.IntPtr hwnd, System.IntPtr after, int x, int y, int w, int h, uint flags);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool ReleaseCapture();
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool PostMessage(System.IntPtr hwnd, uint message, System.IntPtr wp, System.IntPtr lp);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool ShowWindow(System.IntPtr hwnd, int command);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool GetWindowRect(System.IntPtr hwnd, out Rect rect);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern uint GetDpiForWindow(System.IntPtr hwnd);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern uint GetDpiForSystem();
            [System.Runtime.InteropServices.DllImport("user32.dll", EntryPoint="GetMonitorInfoW", CharSet=System.Runtime.InteropServices.CharSet.Unicode)] static extern bool GetMonitorInfo(System.IntPtr monitor, ref MonitorInfo info);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern System.IntPtr MonitorFromWindow(System.IntPtr hwnd, uint flags);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern System.IntPtr MonitorFromPoint(Point point, uint flags);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern bool GetCursorPos(out CursorPoint point);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern short GetAsyncKeyState(int key);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern System.IntPtr GetForegroundWindow();
            struct CursorPoint { public int X, Y; }
            [System.Runtime.InteropServices.DllImport("gdi32.dll")] static extern System.IntPtr CreateRoundRectRgn(int left, int top, int right, int bottom, int ellipseWidth, int ellipseHeight);
            [System.Runtime.InteropServices.DllImport("gdi32.dll")] static extern System.IntPtr CreateRectRgn(int nLeftRect, int nTopRect, int nRightRect, int nBottomRect);
            [System.Runtime.InteropServices.DllImport("gdi32.dll")] static extern bool DeleteObject(System.IntPtr value);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern int SetWindowRgn(System.IntPtr hwnd, System.IntPtr region, bool redraw);
            [System.Runtime.InteropServices.DllImport("user32.dll")] static extern int GetWindowRgn(System.IntPtr hwnd, System.IntPtr hRgn);
            [System.Runtime.InteropServices.DllImport("dwmapi.dll")] static extern int DwmSetWindowAttribute(System.IntPtr hwnd, int attribute, ref int value, int size);
            [System.Runtime.InteropServices.DllImport("dwmapi.dll")] static extern int DwmExtendFrameIntoClientArea(System.IntPtr hwnd, ref Margins margins);
            struct Rect { public int Left, Top, Right, Bottom; }
            struct Margins { public int Left, Right, Top, Bottom; }
            struct Point { public int X, Y; }
            [System.Runtime.InteropServices.StructLayout(System.Runtime.InteropServices.LayoutKind.Sequential)]
            struct MonitorInfo {
                public int Size; public Rect Monitor; public Rect Work; public uint Flags;
            }
            
            class PanelState {
                public System.Windows.Window Window;
                public System.Windows.Threading.DispatcherTimer Timer;
                public bool AutoCollapse, Collapsed;
                public double Left, Top, Width, Height;
                // Capsule position is remembered separately so expanding keeps the
                // capsule where the user left it instead of jumping to a stale corner.
                public double CollapsedLeft, CollapsedTop;
                public System.DateTime InteractionProtectedUntil;
                public System.IntPtr Handle;
                public System.DateTime OutsideSince, InsideSince, SettledAfter;
                public Quicker.Public.IStepContext Context;
            }
            static readonly System.Collections.Generic.Dictionary<long, PanelState> Panels = new System.Collections.Generic.Dictionary<long, PanelState>();
        
            // ---- DPI and work-area helpers -------------------------------------
            // WPF positions/sizes are device-independent pixels (DIPs). GetWindowRect,
            // GetMonitorInfo and SetWindowPos all speak physical pixels. The two must be
            // converted with the window's own DPI, otherwise a 150% monitor puts the
            // panel in the wrong place or reports a size that never matches the probe.
            static double DpiScale(System.IntPtr hwnd) {
                uint dpi = 0;
                try { dpi = GetDpiForWindow(hwnd); } catch { }
                if (dpi == 0) { try { dpi = GetDpiForSystem(); } catch { } }
                if (dpi == 0) dpi = 96;
                return dpi / 96.0;
            }
            static int DipToPx(System.IntPtr hwnd, double dip) { return (int)System.Math.Round(dip * DpiScale(hwnd)); }
            static double PxToDip(System.IntPtr hwnd, int px) { return px / DpiScale(hwnd); }
            static bool TryWorkArea(System.IntPtr hwnd, out Rect work) {
                work = new Rect();
                System.IntPtr monitor = System.IntPtr.Zero;
                try { monitor = MonitorFromWindow(hwnd, 2); } catch { } // MONITOR_DEFAULTTONEAREST
                if (monitor == System.IntPtr.Zero) return false;
                var info = new MonitorInfo();
                info.Size = System.Runtime.InteropServices.Marshal.SizeOf(typeof(MonitorInfo));
                if (!GetMonitorInfo(monitor, ref info)) return false;
                work = info.Work;
                return work.Right > work.Left && work.Bottom > work.Top;
            }
            // Keep a window inside a usable work area. Called after setup, after every
            // expand/collapse and when a monitor disappears: a window that was placed on
            // a disconnected monitor is pulled back instead of staying unreachable.
            static void ClampToWorkArea(PanelState state) {
                var w = state.Window;
                if (w == null || w.WindowState != System.Windows.WindowState.Normal) return;
                if (GetAsyncKeyState(1) < 0 || System.Windows.Input.Mouse.Captured != null ||
                    System.DateTime.UtcNow < state.InteractionProtectedUntil) return;
                var source = System.Windows.PresentationSource.FromVisual(w) as System.Windows.Interop.HwndSource;
                if (source == null || source.Handle == System.IntPtr.Zero) return;
                System.IntPtr hwnd = source.Handle;
                Rect work;
                if (!TryWorkArea(hwnd, out work)) return;
                Rect current;
                if (!GetWindowRect(hwnd, out current)) return;
                int width = current.Right - current.Left, height = current.Bottom - current.Top;
                if (width < 1 || height < 1) return;
                // The panel's full bounding rectangle must stay entirely within the usable work area
                // so header buttons, close controls and edge margins are not clipped.
                int workWidth = work.Right - work.Left, workHeight = work.Bottom - work.Top;
                double dipWorkWidth = PxToDip(hwnd, workWidth), dipWorkHeight = PxToDip(hwnd, workHeight);
                if (width > workWidth) {
                    w.MaxWidth = dipWorkWidth;
                    w.Width = w.MaxWidth;
                    width = workWidth;
                } else {
                    w.MaxWidth = dipWorkWidth;
                }
                if (height > workHeight) {
                    w.MaxHeight = dipWorkHeight;
                    w.Height = w.MaxHeight;
                    height = workHeight;
                } else {
                    w.MaxHeight = dipWorkHeight;
                }
                int overlapX = System.Math.Min(current.Right, work.Right) - System.Math.Max(current.Left, work.Left);
                int overlapY = System.Math.Min(current.Bottom, work.Bottom) - System.Math.Max(current.Top, work.Top);
                bool visible = overlapX >= 40 && overlapY >= 24 && current.Right <= work.Right && current.Bottom <= work.Bottom && current.Left >= work.Left && current.Top >= work.Top;
                if (visible) return;
                int left = System.Math.Max(work.Left, System.Math.Min(current.Left, work.Right - width));
                int top = System.Math.Max(work.Top, System.Math.Min(current.Top, work.Bottom - height));
                // Write the corrected physical rect back through WPF DIPs so the next
                // SizeChanged/StateChanged pass sees a consistent position.
                double dipLeft = PxToDip(hwnd, left), dipTop = PxToDip(hwnd, top);
                w.Left = dipLeft; w.Top = dipTop;
                state.Left = dipLeft; state.Top = dipTop;
                if (state.Collapsed) { state.CollapsedLeft = dipLeft; state.CollapsedTop = dipTop; }
                SetWindowPos(hwnd, System.IntPtr.Zero, left, top, 0, 0, 0x0015); // NOSIZE | NOZORDER | NOACTIVATE
            }
            static bool PhotoshopIsForeground() {
                uint foregroundPid;
                GetWindowThreadProcessId(GetForegroundWindow(), out foregroundPid);
                try {
                    using(var process=System.Diagnostics.Process.GetProcessById((int)foregroundPid))
                        return string.Equals(process.ProcessName,"Photoshop",System.StringComparison.OrdinalIgnoreCase);
                } catch { return false; }
            }
            static void SetCollapsed(PanelState state, bool collapsed) {
                if (state.Collapsed == collapsed) return;
                var w=state.Window;
                if (collapsed) {
                    if (w.WindowState != System.Windows.WindowState.Normal) return;
                    state.Left=w.Left;state.Top=w.Top;state.Width=w.Width;state.Height=w.Height;
                    state.Collapsed=true;
                    w.MinWidth=0;w.MinHeight=0;w.Width=220;w.Height=48;
                    // Keep the capsule anchored to the same right edge as the panel.
                    w.Left=state.Left+state.Width-w.Width;
                    state.CollapsedLeft=w.Left;state.CollapsedTop=w.Top;
                } else {
                    // Preserve moves made while collapsed; restore around its current right edge.
                    double right=w.Left+w.Width;
                    state.Collapsed=false;w.Width=state.Width;w.Height=state.Height;
                    w.Left=right-w.Width;
                }
                ClampToWorkArea(state);
                state.OutsideSince=state.InsideSince=System.DateTime.MinValue;
                state.SettledAfter=System.DateTime.UtcNow.AddMilliseconds(650);
                var source=System.Windows.PresentationSource.FromVisual(w) as System.Windows.Interop.HwndSource;
                if(source!=null)UpdateWindowRegion(source.Handle);
            }
            static PanelState ConfigurePanel(System.Windows.Window w, long handle, Quicker.Public.IStepContext context) {
                PanelState state;
                if(Panels.TryGetValue(handle,out state))return state;
                state=new PanelState {Window=w,Handle=new System.IntPtr(handle),Context=context,AutoCollapse=context.ReadState("panelAutoCollapse","true")=="true"};
                w.Topmost=context.ReadState("panelTopmost","false")=="true";
                state.Timer=new System.Windows.Threading.DispatcherTimer {Interval=System.TimeSpan.FromMilliseconds(50)};
                state.Timer.Tick+=(sender,args)=>{
                    if(!w.IsVisible||w.WindowState!=System.Windows.WindowState.Normal)return;
                    // Recover a panel left on a disconnected/changed monitor. This is a
                    // cheap rect comparison and also covers DPI changes after a drag
                    // between monitors with different scale factors.
                    ClampToWorkArea(state);
                    // Collapsed panels expand only on click, so they need no hover/foreground probes.
                    if(!state.AutoCollapse||state.Collapsed){state.OutsideSince=System.DateTime.MinValue;return;}
                    var now=System.DateTime.UtcNow;
                    if(now<state.SettledAfter)return;
                    Rect rect;CursorPoint cursor;
                    if(!GetWindowRect(state.Handle,out rect)||!GetCursorPos(out cursor))return;
                    // WebView2 owns child HWNDs: WPF IsMouseOver/MouseLeave are not reliable here.
                    bool inside=cursor.X>=rect.Left-5&&cursor.X<rect.Right+5&&cursor.Y>=rect.Top-5&&cursor.Y<rect.Bottom+5;
                    bool held=GetAsyncKeyState(1)<0||GetAsyncKeyState(2)<0||GetAsyncKeyState(4)<0||System.Windows.Input.Mouse.Captured!=null;
                    if(inside){
                        state.OutsideSince=System.DateTime.MinValue;
                        if(state.InsideSince==System.DateTime.MinValue)state.InsideSince=now;
                        // Hover no longer auto-expands; only click via panel-capsule expand.
                    }else{
                        state.InsideSince=System.DateTime.MinValue;
                        if(held||now<state.InteractionProtectedUntil){
                            state.OutsideSince=System.DateTime.MinValue;return;
                        }
                        if(state.OutsideSince==System.DateTime.MinValue)state.OutsideSince=now;
                        if(state.AutoCollapse&&!state.Collapsed&&(now-state.OutsideSince).TotalMilliseconds>=350)SetCollapsed(state,true);
                    }
                };
                state.Timer.Start();
                w.Closed+=(sender,args)=>{state.Timer.Stop();Panels.Remove(handle);};
                Panels[handle]=state;
                return state;
            }
        
            static void UpdateWindowRegion(System.IntPtr hwnd)
            {
                if (!IsWindow(hwnd)) return;
                Rect rect;
                if (!GetWindowRect(hwnd, out rect)) return;
                int diameter = (int)System.Math.Round(24.0 * GetDpiForWindow(hwnd) / 96.0);
                var region = CreateRoundRectRgn(0, 0, rect.Right - rect.Left + 1, rect.Bottom - rect.Top + 1, diameter, diameter);
                if (region != System.IntPtr.Zero && SetWindowRgn(hwnd, region, true) == 0) DeleteObject(region);
            }
        
            public static object Exec(Quicker.Public.IStepContext context)
            {
                string operation = "setup";
                try { operation = context.GetVarValue<string>("operation") ?? "setup"; } catch { }
                bool setup = operation == "setup";
                string handleText = setup ? context.GetVarValue<string>("panelWindow") : context.ReadState("panelWindow", null);
                long handle;
                if (!long.TryParse(handleText, out handle) || handle == 0) throw new System.Exception("面板窗口尚未就绪。");
                var hwnd = GetAncestor(new System.IntPtr(handle), 2);
                uint pid;
                GetWindowThreadProcessId(hwnd, out pid);
                if (!IsWindow(hwnd) || pid != (uint)System.Diagnostics.Process.GetCurrentProcess().Id)
                    throw new System.Exception("面板窗口已关闭，请重新打开动作。");
                if (setup) {
                    context.WriteState("panelWindow", hwnd.ToInt64().ToString());
                    var source = System.Windows.Interop.HwndSource.FromHwnd(hwnd);
                    var window = source == null ? null : source.RootVisual as System.Windows.Window;
                    if (window != null) {
                        // Quicker state-change handler needs this object; never detach it.
                        var chrome = System.Windows.Shell.WindowChrome.GetWindowChrome(window);
                        if (chrome != null) {
                            chrome.CaptionHeight = 0;
                            chrome.GlassFrameThickness = new System.Windows.Thickness(0);
                            chrome.ResizeBorderThickness = new System.Windows.Thickness(0);
                            chrome.CornerRadius = new System.Windows.CornerRadius(12);
                        }
                        window.WindowStyle = System.Windows.WindowStyle.None;
                        window.ResizeMode = System.Windows.ResizeMode.NoResize;
                        window.MinWidth=0; window.MinHeight=0;
                        window.Width = 380; window.Height = 680; // WPF DIPs, including 150% monitors.
                        window.BorderThickness = new System.Windows.Thickness(0);
                        window.Padding = new System.Windows.Thickness(0);
                        window.Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(38, 40, 43));
                        
                        var content = window.Content as System.Windows.FrameworkElement;
                        if (content != null) {
                            content.Margin = new System.Windows.Thickness(0);
                        }
                        
                        ConfigurePanel(window, hwnd.ToInt64(), context);
                        window.SizeChanged -= Window_SizeChanged;
                        window.StateChanged -= Window_StateChanged;
                        window.SizeChanged += Window_SizeChanged;
                        window.StateChanged += Window_StateChanged;
                        // The initial placement may be off-screen on a mixed-DPI setup.
                        ClampToWorkArea(ConfigurePanel(window, hwnd.ToInt64(), context));
                    }
                    SetStyle(hwnd, -16, GetStyle(hwnd, -16) & ~0x00C40000); // WS_CAPTION | WS_THICKFRAME
                    SetWindowPos(hwnd, System.IntPtr.Zero, 0, 0, 0, 0, 0x0037); // FRAMECHANGED, no move/size/z-order/activate
                    int preference = 2;
                    try {
                        DwmSetWindowAttribute(hwnd, 33, ref preference, 4);
                        int borderColor = -2; // DWMWA_COLOR_NONE: suppress DWM light border.
                        DwmSetWindowAttribute(hwnd, 34, ref borderColor, 4);
                        var margins = new Margins();
                        DwmExtendFrameIntoClientArea(hwnd, ref margins);
                    } catch (System.EntryPointNotFoundException) { }
                    
                    UpdateWindowRegion(hwnd);
                    return true;
                }
                var panelSource=System.Windows.Interop.HwndSource.FromHwnd(hwnd);
                var panelWindow=panelSource==null?null:panelSource.RootVisual as System.Windows.Window;
                PanelState panelState=null;
                if(panelWindow!=null)panelState=ConfigurePanel(panelWindow,hwnd.ToInt64(),context);
                if(operation=="toggle-topmost"&&panelWindow!=null){
                    panelWindow.Topmost=!panelWindow.Topmost;
                    context.WriteState("panelTopmost",panelWindow.Topmost?"true":"false");
                } else if(operation=="toggle-autocollapse"&&panelState!=null){
                    panelState.AutoCollapse=!panelState.AutoCollapse;panelState.OutsideSince=System.DateTime.MinValue;
                    context.WriteState("panelAutoCollapse",panelState.AutoCollapse?"true":"false");
                    if(!panelState.AutoCollapse)SetCollapsed(panelState,false);
                } else if(operation=="collapse"&&panelState!=null)SetCollapsed(panelState,true);
                else if(operation=="expand"&&panelState!=null){SetCollapsed(panelState,false);}
                else if(operation=="protect"&&panelState!=null){
                    panelState.InteractionProtectedUntil=System.DateTime.UtcNow.AddMilliseconds(1500);
                    panelState.OutsideSince=System.DateTime.MinValue;
                }
                else if(operation=="unprotect"&&panelState!=null){
                    panelState.InteractionProtectedUntil=System.DateTime.MinValue;
                    panelState.OutsideSince=System.DateTime.MinValue;
                }
                else if (operation == "drag") { ReleaseCapture(); PostMessage(hwnd, 0x00A1, new System.IntPtr(2), System.IntPtr.Zero); }
                else if (operation == "minimize") ShowWindow(hwnd, 6);
                else if (operation == "close") PostMessage(hwnd, 0x0010, System.IntPtr.Zero, System.IntPtr.Zero);
                else if (operation == "probe-state") { ShowWindow(hwnd, 6); ShowWindow(hwnd, 9); }
                else if (operation == "restore") { UpdateWindowRegion(hwnd); }
                else if (operation != "probe") throw new System.Exception("不支持的窗口操作。");
                
                bool hasRgn = false;
                System.IntPtr hRgn = CreateRectRgn(0, 0, 0, 0);
                if (hRgn != System.IntPtr.Zero) {
                    if (GetWindowRgn(hwnd, hRgn) == 3) hasRgn = true; // COMPLEXREGION: a plain rectangle is not rounded.
                    DeleteObject(hRgn);
                }
        
                Rect bounds;GetWindowRect(hwnd,out bounds);CursorPoint pointer;GetCursorPos(out pointer);
                bool cursorInside=pointer.X>=bounds.Left&&pointer.X<bounds.Right&&pointer.Y>=bounds.Top&&pointer.Y<bounds.Bottom;
                Rect work;bool hasWork=TryWorkArea(hwnd,out work);
                bool onWorkArea=hasWork&&bounds.Left>=work.Left&&bounds.Right<=work.Right
                    &&bounds.Top>=work.Top&&bounds.Bottom<=work.Bottom;
                context.SetVarValue("response", "{\"ok\":true,\"frameless\":" +
                    ((GetStyle(hwnd, -16) & 0x00C40000) == 0 ? "true" : "false") + ",\"rounded\":" +
                    (hasRgn ? "true" : "false") + ",\"topmost\":"+(panelWindow!=null&&panelWindow.Topmost?"true":"false")+
                    ",\"autoCollapse\":"+(panelState!=null&&panelState.AutoCollapse?"true":"false")+
                    ",\"collapsed\":"+(panelState!=null&&panelState.Collapsed?"true":"false")+
                    ",\"left\":"+bounds.Left+",\"top\":"+bounds.Top+",\"right\":"+bounds.Right+",\"bottom\":"+bounds.Bottom+
                    ",\"cursorInside\":"+(cursorInside?"true":"false")+
                    ",\"dpiScale\":"+DpiScale(hwnd).ToString(System.Globalization.CultureInfo.InvariantCulture)+
                    ",\"onWorkArea\":"+(onWorkArea?"true":"false")+
                    ",\"workArea\":"+(hasWork?("{\"left\":"+work.Left+",\"top\":"+work.Top+",\"right\":"+work.Right+",\"bottom\":"+work.Bottom+"}"):"null")+"}");
                return true;
            }
            
            private static void Window_SizeChanged(object sender, System.Windows.SizeChangedEventArgs e) {
                var window = sender as System.Windows.Window;
                if (window != null) {
                    var source = System.Windows.PresentationSource.FromVisual(window) as System.Windows.Interop.HwndSource;
                    if (source != null && source.Handle != System.IntPtr.Zero) UpdateWindowRegion(source.Handle);
                }
            }
            
            private static void Window_StateChanged(object sender, System.EventArgs e) {
                var window = sender as System.Windows.Window;
                if (window != null && window.WindowState == System.Windows.WindowState.Normal) {
                    var source = System.Windows.PresentationSource.FromVisual(window) as System.Windows.Interop.HwndSource;
                    if (source != null && source.Handle != System.IntPtr.Zero) UpdateWindowRegion(source.Handle);
                }
            }
        }
      runOnUiThread: ui
subPrograms:
  - name: PsFlowMaintenance
    variables:
      - key: operation
        varType: text
        isInput: true
      - key: restarted
        varType: boolean
      - key: response
        varType: text
        isOutput: true
    steps:
      - csscript:
          script: |
            var operation=context.GetVarValue<string>("operation");
            if(operation!="repair-runtime"&&operation!="rollback-app"&&operation!="install-local")throw new System.Exception("维护操作无效，未修改运行环境。");
            return true;
          runOnUiThread: background
      - runAction:
          type: StartCurrentAction
          wait: false
          inputParam:
            var: operation
          outputs:
            isSuccess: restarted
      - csscript:
          script: |
            var started=context.GetVarValue<bool>("restarted");
            context.SetVarValue("response",new Newtonsoft.Json.Linq.JObject{["ok"]=started,["requested"]=started,["error"]=started?null:"维护动作未能启动，请关闭多余助手窗口后重试。"}.ToString(Newtonsoft.Json.Formatting.None));
            return true;
  - name: PsFlowRestart
    variables:
      - key: restarted
        varType: boolean
      - key: response
        varType: text
        isOutput: true
    steps:
      - runAction:
          type: StartCurrentAction
          wait: false
          inputParam: ''
          outputs:
            isSuccess: restarted
      - csscript:
          script: |
            context.SetVarValue("response",new Newtonsoft.Json.Linq.JObject{["ok"]=context.GetVarValue<bool>("restarted")}.ToString(Newtonsoft.Json.Formatting.None));
            return true;
  - name: PsFlowManagedOpen
    steps:
      - webview2:
          type: OpenUrl
          url: https://flow.google.com
          title: Flow 内置浏览器
          profileName: PSFlowBridge
          autoCloseKey: psfb-managed-flow
          modeForExists: SkipThisStep
          winLocation: RightCenter
          winSize: '960,760'
          script: "window.$quicker?.setWindowNoActivate(true);"
  - name: PsFlowManagedWindow
    variables:
      - key: managedView
        varType: any
      - key: operation
        varType: text
        isInput: true
      - key: response
        varType: text
        isOutput: true
    steps:
      - webview2:
          type: CheckWindowState
          autoCloseKey: psfb-managed-flow
          outputs:
            webView: managedView
      - csscript:
          script: |-
            var view=context.GetVarValue("managedView");
            if(view==null)throw new System.Exception("内置 Flow 窗口未打开。");
            var operation=context.GetVarValue<string>("operation")??"show";
            bool visible=false;
            var dispatcher=(System.Windows.Threading.Dispatcher)view.GetType().GetProperty("Dispatcher").GetValue(view);
            dispatcher.Invoke(new System.Action(()=>{
                var window=System.Windows.Window.GetWindow(view as System.Windows.DependencyObject);
                if(window==null)throw new System.Exception("未找到内置 Flow 窗口。");
                if(operation=="hide")window.Hide();
                else if(operation!="probe") {window.Show();if(operation=="login")context.WriteState("managedLoginPending","true");}
                visible=window.IsVisible;
            }));
            context.SetVarValue("response","{\"ok\":true,\"visible\":"+(visible?"true":"false")+"}");
            return true;
          runOnUiThread: background
  - name: PsFlowManagedDownload
    variables:
      - key: managedView
        varType: any
      - key: request
        varType: text
        isInput: true
      - key: response
        varType: text
        isOutput: true
    steps:
      - webview2:
          type: CheckWindowState
          autoCloseKey: psfb-managed-flow
          outputs:
            webView: managedView
      - csscript:
          script: |-
            var request=Newtonsoft.Json.Linq.JObject.Parse(context.GetVarValue<string>("request"));
            var dataRoot=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData),"PSFlowBridge");
            using(var gate=new System.Threading.Mutex(false,@"Local\PSFlowBridge.ManagedFlow")) {
             bool owned=false;
             try {
              try{owned=gate.WaitOne(0);}catch(System.Threading.AbandonedMutexException){owned=true;}
              if(!owned)throw new System.Exception("Flow 正在处理任务，请完成后再下载高清图。");
                var view=context.GetVarValue("managedView");if(view==null)throw new System.Exception("内置 Flow 窗口未打开。");
                var config=Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(System.IO.Path.Combine(dataRoot,"config.json")));
                var token=(string)config["pairingToken"];
                System.Func<string,string,byte[],string,string> api=(route,method,bytes,mime)=>{
                    var req=(System.Net.HttpWebRequest)System.Net.WebRequest.Create("http://127.0.0.1:47831/api"+route);
                    req.Proxy=null;req.Method=method;req.Timeout=30000;req.ReadWriteTimeout=30000;req.Headers["Authorization"]="Bearer "+token;
                    if(bytes!=null){req.ContentType=mime;req.ContentLength=bytes.Length;using(var stream=req.GetRequestStream())stream.Write(bytes,0,bytes.Length);}
                    try{using(var res=req.GetResponse())using(var reader=new System.IO.StreamReader(res.GetResponseStream(),System.Text.Encoding.UTF8))return reader.ReadToEnd();}
                    catch(System.Net.WebException we){
                        var code="(连接失败)";var body="";
                        try{using(var er=we.Response as System.Net.HttpWebResponse){if(er!=null){code=((int)er.StatusCode).ToString();using(var r=new System.IO.StreamReader(er.GetResponseStream(),System.Text.Encoding.UTF8))body=r.ReadToEnd();}}}catch{}
                        throw new System.Exception("请求失败（HTTP "+code+"，路径 "+route+"）"+(string.IsNullOrEmpty(body)?"":"："+(body.Length>200?body.Substring(0,200):body)));
                    }
                };
                System.Func<string,Newtonsoft.Json.Linq.JObject> get=route=>Newtonsoft.Json.Linq.JObject.Parse(api(route,"GET",null,null));
                System.Action<string,Newtonsoft.Json.Linq.JObject> post=(route,body)=>api(route,"POST",System.Text.Encoding.UTF8.GetBytes(body.ToString(Newtonsoft.Json.Formatting.None)),"application/json");
                var root=context.ReadState("packageRoot",null);
                if(string.IsNullOrWhiteSpace(root)||!System.IO.File.Exists(System.IO.Path.Combine(root,"action-bridge","managed-flow.js"))){
                    var apps=System.IO.Path.Combine(dataRoot,"apps");var build=System.IO.File.ReadAllText(System.IO.Path.Combine(apps,"current")).Trim();
                    if(!System.Text.RegularExpressions.Regex.IsMatch(build,"^[0-9a-f]{16}(?:-repair-[0-9a-f]+)?$"))throw new System.Exception("内置浏览器版本未就绪。");
                    root=System.IO.Path.Combine(apps,build,"PSFlowBridge-package");
                }
                var script=System.IO.File.ReadAllText(System.IO.Path.Combine(root,"action-bridge","managed-flow.js"));
                var dispatcher=(System.Windows.Threading.Dispatcher)view.GetType().GetProperty("Dispatcher").GetValue(view);
                System.Func<string,string,string> cdp=(method,payload)=>{
                    System.Threading.Tasks.Task<string> pending=null;
                    dispatcher.Invoke(new System.Action(()=>{
                        var core=view.GetType().GetProperty("CoreWebView2").GetValue(view);
                        if(core==null)throw new System.Exception("内置浏览器尚未初始化。");
                        pending=(System.Threading.Tasks.Task<string>)core.GetType().GetMethod("CallDevToolsProtocolMethodAsync",new System.Type[]{typeof(string),typeof(string)}).Invoke(core,new object[]{method,payload});
                    }));
                    if(!pending.Wait(60000))throw new System.Exception("网页读取超时；不会重新提交。");
                    return pending.GetAwaiter().GetResult();
                };
                System.Func<string,Newtonsoft.Json.Linq.JObject,Newtonsoft.Json.Linq.JObject> page=(operation,arg)=>{
                    var expression="(()=>{"+script+";return psfbManaged;})()("+Newtonsoft.Json.JsonConvert.SerializeObject(operation)+","+arg.ToString(Newtonsoft.Json.Formatting.None)+")";
                    var raw=Newtonsoft.Json.Linq.JObject.Parse(cdp("Runtime.evaluate",new Newtonsoft.Json.Linq.JObject {["expression"]=expression,["returnByValue"]=true,["awaitPromise"]=true}.ToString(Newtonsoft.Json.Formatting.None)));
                    if(raw["exceptionDetails"]!=null)throw new System.Exception(((string)raw["exceptionDetails"]["exception"]?["description"]??"网页执行失败").Substring(0,System.Math.Min(500,((string)raw["exceptionDetails"]["exception"]?["description"]??"网页执行失败").Length)));
                    if(raw["error"]!=null)throw new System.Exception("内置浏览器通信失败。");
                    return raw["result"]?["value"] as Newtonsoft.Json.Linq.JObject ?? new Newtonsoft.Json.Linq.JObject();
                };
            
                var id=(string)request["id"];
                if(!System.Text.RegularExpressions.Regex.IsMatch(id??"","^[0-9a-f-]{36}$"))throw new System.Exception("任务编号无效。");
                var job=get("/jobs/"+id)["job"];
                if((string)job["status"]!="ready"&&(string)job["status"]!="imported")throw new System.Exception("请等待结果就绪后再下载。");
                int index=(int)job["selectedIndex"];
                if((int?)request["index"]!=index)throw new System.Exception("所选图片已变化，请重新选择。");
                Newtonsoft.Json.Linq.JToken selected=null;
                foreach(var image in (Newtonsoft.Json.Linq.JArray)job["images"])if((int)image["index"]==index)selected=image;
                if(selected==null||(string)selected["sha256"]!=(string)request["sha256"])throw new System.Exception("图片预览已变化，请刷新后重试。");
                var asset=(string)selected["flowAssetKey"];var project=(string)selected["flowProject"];
                if(string.IsNullOrEmpty(asset)||string.IsNullOrEmpty(project))throw new System.Exception("这条历史记录缺少 Flow 原图定位，请在 Flow 中选择原图下载。新生成的结果会自动支持高清下载。");
                if((bool?)get("/health")["busy"]==true)throw new System.Exception("请等待当前任务处理完成后再下载。");
                var info=page("probe",new Newtonsoft.Json.Linq.JObject());
                if((string)info["project"]!=project){
                    page("hdOpenProject",new Newtonsoft.Json.Linq.JObject{["project"]=project});
                    var deadline=System.DateTime.UtcNow.AddSeconds(25);
                    do{System.Threading.Thread.Sleep(500);info=page("probe",new Newtonsoft.Json.Linq.JObject());}while((string)info["project"]!=project&&System.DateTime.UtcNow<deadline);
                    System.Threading.Thread.Sleep(1000);
                }
                var arg=new Newtonsoft.Json.Linq.JObject{["assetKey"]=asset,["resolution"]=request["resolution"]};
                var operation=(string)request["operation"]=="download"?"hdDownload":"hdCapabilities";
                Newtonsoft.Json.Linq.JObject result;
                if(operation=="hdCapabilities")result=page(operation,arg);
                else {
                    object core=null,downloadOperation=null;System.Reflection.EventInfo downloadEvent=null;System.Delegate handler=null;
                    string downloadPath=null,downloadError=null;
                    using(var started=new System.Threading.ManualResetEventSlim(false)) {
                        System.Action<object> callback=eventArgs=>{
                            try {
                            var folder=System.IO.Path.Combine(dataRoot,"cache","hd-incoming");
                            System.IO.Directory.CreateDirectory(folder);
                            var suggested=(string)eventArgs.GetType().GetProperty("ResultFilePath").GetValue(eventArgs);
                            var extension=System.IO.Path.GetExtension(suggested);if(string.IsNullOrEmpty(extension))extension=".png";
                            downloadPath=System.IO.Path.Combine(folder,"PSFlow-"+id.Substring(0,8)+"-"+index+"-"+(string)request["resolution"]+"-"+System.Guid.NewGuid().ToString("N").Substring(0,6)+extension);
                            eventArgs.GetType().GetProperty("ResultFilePath").SetValue(eventArgs,downloadPath);
                            eventArgs.GetType().GetProperty("Handled").SetValue(eventArgs,true);
                            downloadOperation=eventArgs.GetType().GetProperty("DownloadOperation").GetValue(eventArgs);started.Set();
                            }catch(System.Exception error){downloadError=error.Message;started.Set();}
                        };
                        try {
                            dispatcher.Invoke(new System.Action(()=>{
                                core=view.GetType().GetProperty("CoreWebView2").GetValue(view);
                                downloadEvent=core.GetType().GetEvent("DownloadStarting");
                                if(downloadEvent==null)throw new System.Exception("当前 WebView2 不支持下载，请更新运行环境。");
                                var parameters=downloadEvent.EventHandlerType.GetMethod("Invoke").GetParameters();
                                var sender=System.Linq.Expressions.Expression.Parameter(parameters[0].ParameterType,"sender");
                                var args=System.Linq.Expressions.Expression.Parameter(parameters[1].ParameterType,"args");
                                var body=System.Linq.Expressions.Expression.Call(System.Linq.Expressions.Expression.Constant(callback),callback.GetType().GetMethod("Invoke"),System.Linq.Expressions.Expression.Convert(args,typeof(object)));
                                handler=System.Linq.Expressions.Expression.Lambda(downloadEvent.EventHandlerType,body,new[]{sender,args}).Compile();
                                downloadEvent.AddEventHandler(core,handler);
                            }));
                            result=page(operation,arg);
                            if(!started.Wait(120000))throw new System.Exception("Flow 尚未开始下载，请在网页核对；未重复请求高清处理。");
