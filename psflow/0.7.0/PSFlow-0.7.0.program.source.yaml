                report(current,"complete");responseValue["jobID"]=id;responseValue["completed"]=true;
            }catch(System.Exception error){
                if(error.Message.Contains("PSFB_ALREADY_SUBMITTED"))armed=true;
                if(!string.IsNullOrEmpty(id)&&!(error is System.OperationCanceledException)){
                    try{
                        var cfg=Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(System.IO.Path.Combine(dataRoot,"config.json")));
                        var req=(System.Net.HttpWebRequest)System.Net.WebRequest.Create("http://127.0.0.1:47831/api/jobs/"+id+"/status");
                        req.Proxy=null;req.Method="POST";req.Timeout=10000;req.ContentType="application/json";req.Headers["Authorization"]="Bearer "+(string)cfg["pairingToken"];
                        // A resolved generation failure is a real terminal state, not an uncertain
                        // submission: the controller only throws this after the page showed Flow's
                        // own error tile and every slot was accounted for. Report it as failed with
                        // the code so the helper can decide whether a retry is safe (Flow states a
                        // policy block is not billed) instead of parking the job in "unknown".
                        var body=new Newtonsoft.Json.Linq.JObject();
                        if(error.Message.StartsWith("PSFB_GENERATION_FAILED:",System.StringComparison.Ordinal)){
                            var parts=error.Message.Split(new[]{':'},4);
                            var code=parts.Length>1?parts[1]:"generation_failed";
                            var saved=parts.Length>2?parts[2]:"0";
                            var detail=parts.Length>3?parts[3]:"";
                            var charged=code!="policy_rejected";
                            body["status"]="failed";body["submissionSent"]=true;body["failureCode"]=code;body["charged"]=charged;
                            body["error"]=(code=="policy_rejected"
                                ? "Flow 判定该提示词违反政策，未生成图片，本次生成不计费。请修改提示词后重试。"
                                : "Flow 生成失败，未返回图片。请在 Flow 中确认后再决定是否重新生成。")
                                +"（已完成 "+saved+" 张）"+(string.IsNullOrEmpty(detail)?"":" Flow 提示："+detail);
                        }else{
                            body["status"]=armed?"unknown":"failed";body["submissionSent"]=armed;body["error"]=error.Message;
                            if(!armed&&phase=="configure")body["failureCode"]="pre_submission_configuration";
                        }
                        var bytes=System.Text.Encoding.UTF8.GetBytes(body.ToString(Newtonsoft.Json.Formatting.None));req.ContentLength=bytes.Length;
                        using(var stream=req.GetRequestStream())stream.Write(bytes,0,bytes.Length);
                        try{using(var res=req.GetResponse()){}}
                        catch(System.Net.WebException){ /* 终端状态上报失败不影响主流程 */ }
                    }catch{}
                }
                responseValue["ok"]=false;responseValue["error"]=error.Message;responseValue["jobID"]=string.IsNullOrEmpty(id)?null:id;responseValue["submissionSent"]=armed;
            }finally{if(owned)gate.ReleaseMutex();}
            }
            context.SetVarValue("response",responseValue.ToString(Newtonsoft.Json.Formatting.None));
            return true;
          runOnUiThread: background
  - name: PsFlowCommand
    variables:
      - key: request
        varType: text
        isInput: true
      - key: response
        varType: text
        isOutput: true
    steps:
      - csscript:
          script: |-
            var root = context.ReadState("packageRoot", null);
            if (string.IsNullOrWhiteSpace(root)) {
                context.SetVarValue("response", "{\"ok\":false,\"error\":\"请先启动 PS Flow 侧边助手。\"}");
                return false;
            }
            try {
                var configPath = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge", "config.json");
                var config = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(configPath));
                var token = (string)config["pairingToken"];
                if (string.IsNullOrWhiteSpace(token)) throw new System.Exception("本地连接尚未准备好，请重新打开动作。");
                var request = (System.Net.HttpWebRequest)System.Net.WebRequest.Create("http://127.0.0.1:47831/api/action-command");
                request.Proxy = null;
                request.Method = "POST";
                request.Timeout = 90000;
                request.ReadWriteTimeout = 90000;
                request.ContentType = "application/json; charset=utf-8";
                request.Headers["Authorization"] = "Bearer " + token;
                var bytes = new System.Text.UTF8Encoding(false).GetBytes(context.GetVarValue<string>("request"));
                request.ContentLength = bytes.Length;
                using (var stream = request.GetRequestStream()) stream.Write(bytes, 0, bytes.Length);
                using (var response = request.GetResponse())
                using (var reader = new System.IO.StreamReader(response.GetResponseStream(), System.Text.Encoding.UTF8)) {
                    var result = reader.ReadToEnd();
                    Newtonsoft.Json.Linq.JObject.Parse(result);
                    context.SetVarValue("response", result);
                }
                return true;
            } catch (System.Net.WebException error) {
                var code = "(连接失败)"; var body = "";
                try {
                    using (var er = error.Response as System.Net.HttpWebResponse) {
                        if (er != null) {
                            code = ((int)er.StatusCode).ToString();
                            using (var reader = new System.IO.StreamReader(er.GetResponseStream(), System.Text.Encoding.UTF8)) body = reader.ReadToEnd();
                        }
                    }
                } catch { }
                var detail = body.Length > 120 ? body.Substring(0, 120) : body;
                context.SetVarValue("response", new Newtonsoft.Json.Linq.JObject {
                    ["ok"] = false, ["error"] = "操作请求失败（HTTP " + code + "，路径 /api/action-command）" + (string.IsNullOrEmpty(detail) ? "" : "：" + detail),
                    ["uncertain"] = true
                }.ToString(Newtonsoft.Json.Formatting.None));
                return false;
            } catch (System.Exception error) {
                context.SetVarValue("response", new Newtonsoft.Json.Linq.JObject {
                    ["ok"] = false, ["error"] = "操作结果尚未确认，请查询当前任务。 " + error.Message,
                    ["uncertain"] = true
                }.ToString(Newtonsoft.Json.Formatting.None));
                return false;
            }
          runOnUiThread: background


  - name: PsFlowLogin
    variables:
      - key: cookies
        varType: text
        default: ""
      - key: result
        varType: text
        isOutput: true
    steps:
      - webview2:
          type: OpenUrl
          url: https://flow.google.com
          title: Flow 登录（动作内嵌）
          autoCloseKey: psfb-login
          modeForExists: BringToFront
          profileName: PSFlowBridge
          clearCookies: false
          winLocation: RightCenter
          winSize: 480,780
      - delay:
          delayMs: 500
      - webview2:
          type: CheckWindowState
          autoCloseKey: psfb-login
          outputs:
            cookies: cookies
      - csscript:
          script: |-
            // Bridge the Quicker WebView2 Flow session into the local Playwright profile.
            var result = new Newtonsoft.Json.Linq.JObject { ["ok"] = false, ["message"] = "" };
            try {
                var cookies = context.GetVarValue<string>("cookies") ?? "";
                if (string.IsNullOrWhiteSpace(cookies)) throw new System.Exception("内嵌登录窗口未返回登录 Cookie（若重复出现，说明该窗口没有带出 Cookie，请重试登录）。");
                var stateRoot = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
                var backendPath = System.IO.Path.Combine(stateRoot, "backend.json");
                if (!System.IO.File.Exists(backendPath)) throw new System.Exception("生成服务尚未配置，请先打开一次 PS Flow 动作面板。");
                var backend = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(backendPath));
                if ((bool?)backend["enabled"] != true) throw new System.Exception("生成服务未启用，请在设置中开启 PS Flow 服务。");
                var baseUrl = ((string)backend["baseUrl"] ?? "").TrimEnd('/');
                var apiKey = (string)backend["apiKey"];
                if (string.IsNullOrWhiteSpace(baseUrl) || string.IsNullOrWhiteSpace(apiKey)) throw new System.Exception("生成服务配置不完整。");
                var request = (System.Net.HttpWebRequest)System.Net.WebRequest.Create(baseUrl + "/setup/import-cookies");
                request.Proxy = null;
                request.Method = "POST";
                request.Timeout = 30000;
                request.ReadWriteTimeout = 30000;
                request.ContentType = "application/json; charset=utf-8";
                request.Headers["Authorization"] = "Bearer " + apiKey;
                var payload = new Newtonsoft.Json.Linq.JObject { ["cookies"] = cookies, ["origin"] = "https://flow.google.com" };
                var bytes = new System.Text.UTF8Encoding(false).GetBytes(payload.ToString(Newtonsoft.Json.Formatting.None));
                request.ContentLength = bytes.Length;
                using (var stream = request.GetRequestStream()) stream.Write(bytes, 0, bytes.Length);
                using (var response = request.GetResponse())
                using (var reader = new System.IO.StreamReader(response.GetResponseStream(), System.Text.Encoding.UTF8)) {
                    var body = Newtonsoft.Json.Linq.JObject.Parse(reader.ReadToEnd());
                    var ready = (bool?)body["session_ready"] == true;
                    result["ok"] = true;
                    result["sessionReady"] = ready;
                    result["imported"] = body["imported"];
                    result["message"] = ready
                        ? "已通过动作内嵌窗口完成登录，会话已经就绪。"
                        : "登录 Cookie 已导入，但会话尚未确认；请在窗口中确认已进入 Flow。";
                }
            } catch (System.Net.WebException error) {
                var code = "(连接失败)"; var detail = error.Message;
                try {
                    using (var response = error.Response)
                    {
                        if (response is System.Net.HttpWebResponse hr) code = ((int)hr.StatusCode).ToString();
                        using (var reader = new System.IO.StreamReader(response.GetResponseStream(), System.Text.Encoding.UTF8)) {
                            var body = Newtonsoft.Json.Linq.JObject.Parse(reader.ReadToEnd());
                            var message = (string)(body["error"]?["message"] ?? body["error"] ?? body["detail"]);
                            if (!string.IsNullOrWhiteSpace(message)) detail = message;
                        }
                    }
                } catch { }
                result["message"] = "登录会话导入失败（HTTP " + code + "，路径 /setup/import-cookies）：" + detail;
            } catch (System.Exception error) {
                result["waitingForLogin"] = error.Message.Contains("未返回登录 Cookie");
                result["message"] = error.Message;
            }
            context.SetVarValue("result", result.ToString(Newtonsoft.Json.Formatting.None));
          runOnUiThread: background
