$schema: quicker.program.source.v1
variables:
  - key: root
    varType: text
  - key: maintenance
    varType: text
    default: ''
  - key: installMode
    varType: text
    default: 'browser'
  - key: response
    varType: text
    default: ''
  - key: installOk
    varType: boolean
    default: false
  - key: cancelled
    varType: boolean
    default: false
  - key: diagnoseMode
    varType: boolean
    default: false
  - key: htmlPath
    varType: text
steps:
  - csscript:
      mode: normal_roslyn
      script: |-
        public static object Exec(Quicker.Public.IStepContext context)
        {
            // ============================================================================
            // PSFlowBridge Downloader - Action Entrypoint & UI Extractor
            // Resolves installMode and requestedOp from quicker_in_param JSON / string,
            // honors existing mode.json preference, and unpacks embedded HTML.
            // ============================================================================

            var inParam = "";
            try {
                inParam = (context.GetVarValue<string>("quicker_in_param") ?? "").Trim();
            } catch { }

            var dataRoot = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
            var modeFile = System.IO.Path.Combine(dataRoot, "mode.json");

            // Requirement 8: Independent fresh machine defaults browser; existing desired mode can be read.
            var mode = "browser";
            if (System.IO.File.Exists(modeFile)) {
                try {
                    var mObj = Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(modeFile));
                    var savedMode = (string)mObj["mode"];
                    if (savedMode == "browser" || savedMode == "local") mode = savedMode;
                } catch { }
            }

            var isStandalone = string.IsNullOrEmpty(inParam);
            // Requirement 1: Independent manager opens with read-only inspect, not automatic install.
            var requestedOp = isStandalone ? "inspect" : "install";
            var requestId = "";
            var expectedBuildId = "";

            if (!string.IsNullOrEmpty(inParam)) {
                try {
                    if (inParam.StartsWith("{")) {
                        var parsed = Newtonsoft.Json.Linq.JObject.Parse(inParam);
                        var m = (string)parsed["mode"];
                        if (!string.IsNullOrEmpty(m)) mode = m.Trim().ToLowerInvariant();
                        var opVal = ((string)parsed["op"] ?? "").Trim().ToLowerInvariant();
                        if (!string.IsNullOrEmpty(opVal)) requestedOp = opVal;
                        requestId = (string)parsed["requestId"] ?? "";
                        expectedBuildId = (string)parsed["expectedBuildId"] ?? "";
                    } else {
                        var pLower = inParam.ToLowerInvariant();
                        if (pLower == "browser" || pLower == "local") {
                            mode = pLower;
                        } else if (pLower == "diagnose" || pLower == "inspect") {
                            requestedOp = pLower;
                        }
                    }
                } catch { throw new System.Exception("组件下载参数无效。"); }
            }

            if (mode != "browser" && mode != "local") {
                throw new System.Exception("运行方式无效，请选择内置浏览器或本机后端。");
            }

            context.SetVarValue("installMode", mode);
            context.SetVarValue("diagnoseMode", requestedOp == "diagnose");
            context.SetVarValue("cancelled", false);

            // Extract or locate HTML page
            var tempDir = System.IO.Path.Combine(System.IO.Path.GetTempPath(), "PSFlowBridge");
            System.IO.Directory.CreateDirectory(tempDir);
            var htmlPath = System.IO.Path.Combine(tempDir, "downloader-" + System.Guid.NewGuid().ToString("N") + ".html");

            var embeddedHtml = "";
            if (!embeddedHtml.StartsWith("__HTML")) {
                var bytes = System.Convert.FromBase64String(embeddedHtml);
                var htmlText = System.Text.Encoding.UTF8.GetString(bytes);
                htmlText = htmlText.Replace("let currentMode = 'local';", "let currentMode = '" + mode + "';");
                htmlText = htmlText.Replace("let diagnoseOnLoad = false;", "let diagnoseOnLoad = " + (requestedOp == "diagnose" ? "true" : "false") + ";");
                htmlText = htmlText.Replace("let initialOp = 'inspect';", "let initialOp = '" + requestedOp + "';");
                htmlText = htmlText.Replace("let isStandalone = true;", "let isStandalone = " + (isStandalone ? "true" : "false") + ";");
                if (!string.IsNullOrEmpty(requestId)) {
                    htmlText = htmlText.Replace("let initialRequestId = '';", "let initialRequestId = '" + requestId + "';");
                }
                if (!string.IsNullOrEmpty(expectedBuildId)) {
                    htmlText = htmlText.Replace("let initialExpectedBuildId = '';", "let initialExpectedBuildId = '" + expectedBuildId + "';");
                }
                System.IO.File.WriteAllText(htmlPath, htmlText, new System.Text.UTF8Encoding(false));
            } else {
                // Development fallback
                var devPaths = new [] {
                    System.IO.Path.Combine(System.AppDomain.CurrentDomain.BaseDirectory, "install-page.html"),
                    System.IO.Path.Combine(System.AppDomain.CurrentDomain.BaseDirectory, "distribution", "downloader", "install-page.html"),
                    htmlPath
                };
                foreach (var p in devPaths) {
                    if (System.IO.File.Exists(p)) {
                        htmlPath = p;
                        break;
                    }
                }
            }

            context.SetVarValue("htmlPath", htmlPath);
            return true;
        }
      runOnUiThread: background
  - webview2:
      type: OpenUrlAndWaitClose
      url: '$={htmlPath}'
      title: PS Flow · 运行组件准备
      defaultBgColor: '#26282b'
      autoCloseKey: psfb-downloader
      winLocation: CenterScreen
      winSize: '500,540'
      stopIfFail: false
  - if:
      condition: '$=!{installOk}'
      then:
        - csscript:
            mode: normal_roslyn
            script: |-
              public static object Exec(Quicker.Public.IStepContext context)
              {
                  var resp = context.GetVarValue<string>("response") ?? "";
                  var err = "组件准备未完成或用户取消。";
                  var cancelled = false;
                  var cancelledFlag = false; try { cancelledFlag = context.GetVarValue<bool>("cancelled"); } catch { }
                  try {
                    if (!string.IsNullOrEmpty(resp)) {
                      var j = Newtonsoft.Json.Linq.JObject.Parse(resp);
                      if ((bool?)j["cancelled"] == true) cancelled = true;
                      if (j["error"] != null) err = (string)j["error"];
                      if (j["diagnostic"] != null) err = err + "\n" + (string)j["diagnostic"];
                    } else {
                      // User closed window before page initialized
                      cancelled = true;
                    }
                  } catch { }
                  if (!cancelled && !cancelledFlag) {
                    throw new System.Exception(err);
                  }
                  return null;
              }
            runOnUiThread: background
      else:
        - comment: '兼容旧版分支'
  - stop:
      method: default
      return:
        var: response
subPrograms:
  - name: InstallComponents
    variables:
      - key: mode
        varType: text
        isInput: true
      - key: installMode
        varType: text
        isInput: true
        default: 'local'
      - key: maintenance
        varType: text
        isInput: true
        default: ''
      - key: op
        varType: text
        isInput: true
        default: ''
      - key: expectedBuildId
        varType: text
        isInput: true
        default: ''
      - key: requestId
        varType: text
        isInput: true
        default: ''
      - key: confirmDeleteData
        varType: boolean
        isInput: true
        default: false
      - key: root
        varType: text
        isOutput: true
      - key: response
        varType: text
        isOutput: true
      - key: installOk
        varType: boolean
        isOutput: true
      - key: installerResult
        varType: text
        isOutput: true
        default: ''
      - key: cancelled
        varType: boolean
        isOutput: true
        default: false
      - key: progress
        varType: text
        isOutput: true
        default: ''
      - key: installRunning
        varType: boolean
        default: false
      - key: installDone
        varType: boolean
        default: false
      - key: installProgress
        varType: text
        default: ''
    steps:
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                // ============================================================================
                // PSFlowBridge Downloader - Component Installer Wrapper
                // Runs the pinned installer on a worker thread and mirrors its real progress
                // file into a subprogram output the page can poll while it runs.
                // ============================================================================
                System.Action<string> traceInstall = phase => { try { System.IO.File.WriteAllText(System.IO.Path.Combine(System.IO.Path.GetTempPath(), "psfb-downloader-stage.txt"), System.DateTime.UtcNow.ToString("o") + " " + phase); } catch { } };
                traceInstall("entered");

                System.Exception workerError = null;

                // The installer writes {phase,detail,percent} to this file; the page polls the
                // mirrored `progress` variable so the bar shows real downloaded bytes.
                string downloaderProgressFile = System.IO.Path.Combine(System.IO.Path.GetTempPath(), "psfb-install-progress-" + System.Guid.NewGuid().ToString("N") + ".json");
                string priorProgressFile = System.Environment.GetEnvironmentVariable("PSFB_INSTALL_PROGRESS_FILE");
                System.Func<string> readProgress = () => {
                    try { return System.IO.File.Exists(downloaderProgressFile) ? System.IO.File.ReadAllText(downloaderProgressFile) : ""; } catch { return ""; }
                };

                // Hoisted shared parameters and protocol identity action (available to both try and catch)
                var selectedMode = "";
                try { selectedMode = context.GetVarValue<string>("mode") ?? ""; } catch { }
                if (string.IsNullOrEmpty(selectedMode)) {
                    try { selectedMode = context.GetVarValue<string>("installMode", "") ?? ""; } catch { }
                }

                var requestIdInput = "";
                try { requestIdInput = context.GetVarValue<string>("requestId") ?? ""; } catch { }

                var mOp = "";
                try {
                    mOp = (context.GetVarValue<string>("op") ?? "").Trim();
                } catch { }
                if (string.IsNullOrEmpty(mOp)) {
                    try {
                        mOp = (context.GetVarValue<string>("maintenance") ?? "").Trim();
                    } catch { }
                }
                var wrapperValidOps = new System.Collections.Generic.HashSet<string>(new [] {
                    "inspect", "install", "repair-runtime", "rollback-app",
                    "install-local", "clear-cache", "remove-local", "uninstall-runtime",
                    "delete-user-data", "remove-components"
                });
                if (!wrapperValidOps.Contains(mOp)) mOp = "";

                System.Action<Newtonsoft.Json.Linq.JObject> applyIdentity = obj => {
                    if (obj == null) return;
                    obj["protocolVersion"] = 1;
                    if (obj["productId"] == null) obj["productId"] = "PSFlowBridge";
                    if (!string.IsNullOrEmpty(requestIdInput)) obj["requestId"] = requestIdInput;
                    // Do not counterfeit missing buildId with expectedBuildId; failure retains ok:false.
                    // Inspect legitimately reports a null effectiveMode when nothing is usable;
                    // only install results are guaranteed to have one.
                    if (obj["effectiveMode"] == null && (string)obj["operation"] == "install" && !string.IsNullOrEmpty(selectedMode)) {
                        obj["effectiveMode"] = selectedMode;
                    }
                };

                try {
                    // 0. Reset installerResult output variable before executing to prevent stale state reuse
                    context.SetVarValue("installerResult", "");
                    // Terminal flags must start from a clean state: a previous run's installDone
                    // must not survive a validation failure that throws before the launcher runs.
                    try { context.SetVarValue("installRunning", false); } catch { }
                    try { context.SetVarValue("installDone", false); } catch { }

                    // 1. Validate mode (align with launch-portable.cs: allow empty for inspect/maintenance, reject invalid strings)
                    if (!string.IsNullOrEmpty(selectedMode) && selectedMode != "browser" && selectedMode != "local") {
                        throw new System.Exception("运行方式无效，请选择内置浏览器或本机后端。");
                    }
                    context.SetVarValue("installMode", selectedMode);

                    // 2. Set normalized maintenance / op variables
                    context.SetVarValue("maintenance", mOp);
                    context.SetVarValue("op", mOp);

                    traceInstall("variables-ready");
                    System.Environment.SetEnvironmentVariable("PSFB_INSTALL_PROGRESS_FILE", downloaderProgressFile);
                    context.SetVarValue("progress", readProgress());

                    // 3. Execute embedded launch-portable.cs on a worker thread.
                    // The embedded installer body ends with `return true;`, so it must be a
                    // Func<bool>: a void-returning Action lambda cannot return a value.
                    System.Func<bool> executeInstaller = () => {
                        var stateRoot = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
                        var script = System.Text.Encoding.UTF8.GetString(System.Convert.FromBase64String(""));
                        var expectedScript = "211b99198a6f52eea90481b9acee6832789f445ca01ddcf2d04400ac40d2473a";
                        var installerDir = System.IO.Path.Combine(stateRoot,"installers",expectedScript.Substring(0,16));
                        System.IO.Directory.CreateDirectory(installerDir);
                        var installer = System.IO.Path.Combine(installerDir,"Install.ps1");
                        System.Func<string,string> hash = file => {
                            using(var algorithm=System.Security.Cryptography.SHA256.Create())
                            using(var stream=System.IO.File.OpenRead(file))
                                return System.BitConverter.ToString(algorithm.ComputeHash(stream)).Replace("-","").ToLowerInvariant();
                        };
                        using(var mutex=new System.Threading.Mutex(false,"Local\\PSFlowBridgeInstallerSource")) {
                            var acquired=false;
                            try {
                                try{acquired=mutex.WaitOne(10000);}catch(System.Threading.AbandonedMutexException){acquired=true;}
                                if(!acquired)throw new System.Exception("运行入口正在准备，请稍后重开。");
                                if(!System.IO.File.Exists(installer)||hash(installer)!=expectedScript) {
                                    var temporary=installer+"."+System.Guid.NewGuid().ToString("N")+".tmp";
                                    try {
                                        System.IO.File.WriteAllText(temporary,script,new System.Text.UTF8Encoding(false));
                                        if(hash(temporary)!=expectedScript)throw new System.Exception("安装入口校验失败，未启动。");
                                        if(System.IO.File.Exists(installer))System.IO.File.Replace(temporary,installer,null);
                                        else System.IO.File.Move(temporary,installer);
                                    } finally {if(System.IO.File.Exists(temporary))System.IO.File.Delete(temporary);}
                                }
                            } finally {if(acquired)mutex.ReleaseMutex();}
                        }
                        // Clear stale terminal flags before validation can throw, so an invalid op/mode
                        // never leaves the panel stuck on "running" or inheriting an old "done".
                        context.SetVarValue("installRunning",false);
                        context.SetVarValue("installDone",false);
                        var operation="";
                        try { operation=context.GetVarValue<string>("op","")??""; } catch { }
                        if(string.IsNullOrEmpty(operation)){try{operation=context.GetVarValue<string>("maintenance","")??"";}catch{}}
                        if(operation=="install")operation="";
                        var validOps=new System.Collections.Generic.HashSet<string>{
                            "","inspect","install-local","repair-runtime","rollback-app","clear-cache","remove-local","uninstall-runtime","delete-user-data","remove-components"
                        };
                        if(!validOps.Contains(operation))throw new System.Exception("维护操作无效："+operation);
                        var installMode="";
                        try { installMode=context.GetVarValue<string>("installMode","")??""; } catch { }
                        if(string.IsNullOrEmpty(installMode)){try{installMode=context.GetVarValue<string>("mode","")??"";}catch{}}
                        if(installMode!=""&&installMode!="browser"&&installMode!="local")throw new System.Exception("运行方式无效。");
                        var expectedBuildId="";
                        try { expectedBuildId=context.GetVarValue<string>("expectedBuildId","")??""; } catch { }
                        var requestId="";
                        try { requestId=context.GetVarValue<string>("requestId","")??""; } catch { }
                        var confirmDelete=false;
                        try { confirmDelete=context.GetVarValue<bool>("confirmDeleteData",false); } catch { }
                        var statusFile=System.IO.Path.Combine(System.IO.Path.GetTempPath(),"psfb-distribution-"+System.Guid.NewGuid().ToString("N")+".json");
                        var outerProgressFile=System.Environment.GetEnvironmentVariable("PSFB_INSTALL_PROGRESS_FILE");
                        var progressFile=!string.IsNullOrEmpty(outerProgressFile)?outerProgressFile:System.IO.Path.Combine(System.IO.Path.GetTempPath(),"psfb-install-progress-"+System.Guid.NewGuid().ToString("N")+".json");
                        var isProgressOwner=string.IsNullOrEmpty(outerProgressFile) && (operation==""||operation=="install-local"||operation=="repair-runtime"||operation=="rollback-app");
                        var initProgress = new Newtonsoft.Json.Linq.JObject();
                        initProgress["phase"] = "prepare";
                        initProgress["detail"] = "正在准备运行环境";
                        initProgress["percent"] = 0;
                        context.SetVarValue("installProgress",initProgress.ToString(Newtonsoft.Json.Formatting.None));
                        System.Windows.Window progressWin = null;
                        System.Windows.Threading.Dispatcher progressDispatcher = null;
                        System.Windows.Controls.ProgressBar pBar = null;
                        System.Windows.Controls.TextBlock pMsg = null;
                        System.Windows.Controls.TextBlock pPct = null;
                        System.Threading.Thread progressUiThread = null;
                        bool progressFinished = false;
                        if (isProgressOwner) {
                            var readyEvt = new System.Threading.ManualResetEventSlim(false);
                            progressUiThread = new System.Threading.Thread(() => {
                                try {
                                    if (progressFinished) { readyEvt.Set(); return; }
                                    var w = new System.Windows.Window {
                                        Title = "PS Flow · 安装进度",
                                        Width = 360,
                                        Height = 220,
                                        WindowStartupLocation = System.Windows.WindowStartupLocation.CenterScreen,
                                        ResizeMode = System.Windows.ResizeMode.NoResize,
                                        Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(38, 40, 43)),
                                        ShowActivated = false,
                                        Visibility = System.Windows.Visibility.Hidden
                                    };
                                    var stack = new System.Windows.Controls.StackPanel { Margin = new System.Windows.Thickness(24, 22, 24, 22) };
                                    var title = new System.Windows.Controls.TextBlock {
                                        Text = "PS Flow 正在准备运行组件",
                                        FontSize = 14,
                                        FontWeight = System.Windows.FontWeights.SemiBold,
                                        Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(230, 230, 230)),
                                        Margin = new System.Windows.Thickness(0, 0, 0, 14)
                                    };
                                    pBar = new System.Windows.Controls.ProgressBar {
                                        Height = 8,
                                        IsIndeterminate = true,
                                        Background = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(58, 61, 66)),
                                        Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(91, 157, 255))
                                    };
                                    var row = new System.Windows.Controls.Grid { Margin = new System.Windows.Thickness(0, 10, 0, 0) };
                                    row.ColumnDefinitions.Add(new System.Windows.Controls.ColumnDefinition { Width = new System.Windows.GridLength(1, System.Windows.GridUnitType.Star) });
                                    row.ColumnDefinitions.Add(new System.Windows.Controls.ColumnDefinition { Width = System.Windows.GridLength.Auto });
                                    pMsg = new System.Windows.Controls.TextBlock {
                                        Text = "正在准备…",
                                        FontSize = 12,
                                        Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(154, 160, 166)),
                                        TextTrimming = System.Windows.TextTrimming.CharacterEllipsis
                                    };
                                    pPct = new System.Windows.Controls.TextBlock {
                                        Text = "",
                                        FontSize = 12,
                                        Foreground = new System.Windows.Media.SolidColorBrush(System.Windows.Media.Color.FromRgb(200, 204, 208)),
                                        Margin = new System.Windows.Thickness(10, 0, 0, 0)
                                    };
                                    System.Windows.Controls.Grid.SetColumn(pMsg, 0);
                                    System.Windows.Controls.Grid.SetColumn(pPct, 1);
                                    row.Children.Add(pMsg);
                                    row.Children.Add(pPct);
                                    stack.Children.Add(title);
                                    stack.Children.Add(pBar);
                                    stack.Children.Add(row);
                                    w.Content = stack;
                                    progressWin = w;
                                    progressDispatcher = w.Dispatcher;
                                    readyEvt.Set();
                                    if (progressFinished) {
                                        try { w.Close(); } catch { }
                                        return;
                                    }
                                    System.Windows.Threading.Dispatcher.Run();
                                } catch { readyEvt.Set(); }
                            });
                            progressUiThread.SetApartmentState(System.Threading.ApartmentState.STA);
                            progressUiThread.IsBackground = true;
                            progressUiThread.Start();
                            readyEvt.Wait(1000);
                        }
                        try {
                            var start=new System.Diagnostics.ProcessStartInfo {
                                FileName=System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.Windows),"System32","WindowsPowerShell","v1.0","powershell.exe"),
                                Arguments="-NoProfile -ExecutionPolicy Bypass -File \""+installer+"\""+
                                    (operation.Length>0?" -Maintenance \""+operation+"\"":"")+
                                    (installMode.Length>0?" -Mode \""+installMode+"\"":"")+
                                    (expectedBuildId.Length>0?" -ExpectedBuildId \""+expectedBuildId+"\"":"")+
                                    (requestId.Length>0?" -RequestId \""+requestId+"\"":"")+
                                    (confirmDelete?" -ConfirmDeleteData":""),
                                UseShellExecute=false,CreateNoWindow=true,WindowStyle=System.Diagnostics.ProcessWindowStyle.Hidden,
                                RedirectStandardOutput=true,RedirectStandardError=true
                            };
                            start.EnvironmentVariables["PSFB_INSTALL_STATUS_FILE"]=statusFile;
                            start.EnvironmentVariables["PSFB_INSTALL_PROGRESS_FILE"]=progressFile;
                            var effectiveOp = (string.IsNullOrEmpty(operation) || operation == "install") ? "install" : operation;
                            System.DateTime initialOuterFileTime = System.DateTime.MinValue;
                            bool initialOuterFileExisted = false;
                            if (!isProgressOwner && System.IO.File.Exists(progressFile)) {
                                initialOuterFileExisted = true;
                                initialOuterFileTime = System.IO.File.GetLastWriteTimeUtc(progressFile);
                            }
                            context.SetVarValue("installRunning",true);
                            var startedProcess=System.Diagnostics.Process.Start(start);
                            using(var process=startedProcess) {
                            // Backstop on this launch's own Process handle: any exception or return before
                            // the installer exits kills just that installer, never a detached runtime.
                            var installerExited=false;
                            try {
                                process.BeginOutputReadLine();
                                process.BeginErrorReadLine();
                                var deadline=System.DateTime.UtcNow.AddSeconds(600);
                                var startTime=System.DateTime.UtcNow;
                                bool windowShown = false;
                                while(!process.WaitForExit(700)) {
                                    try {
                                        if(System.IO.File.Exists(progressFile)) {
                                            if (initialOuterFileExisted && System.IO.File.GetLastWriteTimeUtc(progressFile) == initialOuterFileTime) {
                                                // stale external progress file from before this launch
                                            } else {
                                                initialOuterFileExisted = false;
                                                string ptext = null;
                                                try {
                                                    using (var fs = new System.IO.FileStream(progressFile, System.IO.FileMode.Open, System.IO.FileAccess.Read, System.IO.FileShare.ReadWrite))
                                                    using (var sr = new System.IO.StreamReader(fs, System.Text.Encoding.UTF8)) {
                                                        ptext = sr.ReadToEnd();
                                                    }
                                                } catch { }
                                                if(!string.IsNullOrEmpty(ptext)) {
                                                    try {
                                                        var pObj = Newtonsoft.Json.Linq.JObject.Parse(ptext);
                                                        var pPhase = (string)pObj["phase"];
                                                        if (!string.IsNullOrEmpty(pPhase)) {
                                                            context.SetVarValue("installProgress",ptext);
                                                            if (progressDispatcher != null && progressWin != null) {
                                                                var pPctVal = (int?)pObj["percent"] ?? -1;
                                                                var pDetailVal = (string)pObj["detail"] ?? pPhase ?? "正在准备…";
                                                                progressDispatcher.BeginInvoke(new System.Action(() => {
                                                                    if (pPctVal >= 0) {
                                                                        pBar.IsIndeterminate = false;
                                                                        pBar.Value = System.Math.Max(0, System.Math.Min(100, pPctVal));
                                                                        pPct.Text = pPctVal + "%";
                                                                    } else {
                                                                        pBar.IsIndeterminate = true;
                                                                        pPct.Text = "";
                                                                    }
                                                                    pMsg.Text = pDetailVal;
                                                                }));
                                                            }
                                                        }
                                                    } catch (System.Exception parseEx) {
                                                        try { context.SetVarValue("diag:progressParseError", parseEx.Message); } catch { }
                                                    }
                                                }
                                            }
                                        }
                                        if (!windowShown && (System.DateTime.UtcNow - startTime).TotalMilliseconds >= 1200) {
                                            if (!progressFinished && progressDispatcher != null && progressWin != null) {
                                                progressDispatcher.BeginInvoke(new System.Action(() => {
                                                    if (progressFinished) return;
                                                    progressWin.Visibility = System.Windows.Visibility.Visible;
                                                    progressWin.Show();
                                                }));
                                                windowShown = true;
                                            }
                                        }
                                    } catch {}
                                    if(System.DateTime.UtcNow>=deadline) {
                                        try{process.Kill();}catch{}
                                        var timeoutObj = new Newtonsoft.Json.Linq.JObject();
                                        timeoutObj["protocolVersion"] = 1;
                                        timeoutObj["productId"] = "PSFlowBridge";
                                        timeoutObj["operation"] = effectiveOp;
                                        if (!string.IsNullOrEmpty(requestId)) timeoutObj["requestId"] = requestId;
                                        timeoutObj["ok"] = false;
                                        timeoutObj["status"] = "failed";
                                        timeoutObj["error"] = "准备超时（已等待超过 600 秒），请先查询当前运行状态再重试。";
                                        var timeoutJson = timeoutObj.ToString(Newtonsoft.Json.Formatting.None);
                                        try { context.SetVarValue("installerResult", timeoutJson); } catch { }
                                        try { context.SetVarValue("response", timeoutJson); } catch { }
                                        throw new System.Exception((string)timeoutObj["error"]);
                                    }
                                }
                                installerExited=true;
                                try { if(System.IO.File.Exists(progressFile)) { var text=System.IO.File.ReadAllText(progressFile); if(!string.IsNullOrEmpty(text)) context.SetVarValue("installProgress",text); } } catch {}
                                if(!System.IO.File.Exists(statusFile)) {
                                    var failObj = new Newtonsoft.Json.Linq.JObject();
                                    failObj["protocolVersion"] = 1;
                                    failObj["productId"] = "PSFlowBridge";
                                    failObj["operation"] = effectiveOp;
                                    if (!string.IsNullOrEmpty(requestId)) failObj["requestId"] = requestId;
                                    failObj["ok"] = false;
                                    failObj["status"] = "failed";
                                    failObj["error"] = "Installer process exited with code " + process.ExitCode + " without writing status file.";
                                    var failJson = failObj.ToString(Newtonsoft.Json.Formatting.None);
                                    try { context.SetVarValue("installerResult", failJson); } catch { }
                                    try { context.SetVarValue("response", failJson); } catch { }
                                    throw new System.Exception((string)failObj["error"]);
                                }
                                var result=Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(statusFile));
                                var rawJson=result.ToString(Newtonsoft.Json.Formatting.None);
                                try { context.SetVarValue("installerResult",rawJson); } catch { }
                                try { context.SetVarValue("response",rawJson); } catch { }
                                if(process.ExitCode!=0||(bool?)result["ok"]!=true)throw new System.Exception((string)result["error"]??"运行组件准备失败。");
                                var isNonRunningOp=(operation=="inspect"||operation=="remove-components"||operation=="clear-cache"||operation=="remove-local"||operation=="uninstall-runtime"||operation=="delete-user-data");
                                if(isNonRunningOp)return true;
                                var root=(string)result["packageRoot"];var node=(string)result["nodePath"];
                                if(string.IsNullOrEmpty(root)||string.IsNullOrEmpty(node)||!System.IO.File.Exists(System.IO.Path.Combine(root,"action-ui","panel.html"))||!System.IO.File.Exists(node))throw new System.Exception("运行位置无效，未打开面板。");
                                context.WriteState("packageRoot",root);context.WriteState("nodePath",node);
                                context.SetVarValue("root",root);
                            } finally {
                                // On any exception (including caller cancellation surfaces) leave no live
                                // installer from this launch holding Local\PSFlowBridgeDistribution. Only
                                // this launch's own installer handle is touched; a runtime that detached
                                // after a normal exit (node/python) is never affected.
                                try {
                                    if (!installerExited && !process.HasExited) {
                                        process.Kill();
                                        process.WaitForExit(10000);
                                    }
                                } catch { }
                            }
                            }
                        } finally {
                            context.SetVarValue("installDone",true);
                            context.SetVarValue("installRunning",false);
                            progressFinished = true;
                            if (progressDispatcher != null) {
                                try {
                                    progressDispatcher.BeginInvoke(new System.Action(() => {
                                        try {
                                            if (progressWin != null) {
                                                progressWin.Close();
                                            }
                                        } catch { }
                                        try {
                                            progressDispatcher.InvokeShutdown();
                                        } catch { }
                                    }));
                                } catch {}
                            }
                            if (progressUiThread != null) {
                                try {
                                    progressUiThread.Join(1500);
                                } catch { }
                            }
                            try{if(System.IO.File.Exists(statusFile))System.IO.File.Delete(statusFile);}catch{}
                            if(isProgressOwner){try{if(System.IO.File.Exists(progressFile))System.IO.File.Delete(progressFile);}catch{}}
                        }
                        return true;
                    };
                    traceInstall("launching-installer");
                    var worker = new System.Threading.Thread(() => { try { executeInstaller(); } catch (System.Exception ex) { workerError = ex; } });
                    worker.IsBackground = true;
                    worker.Start();
                    while (worker.IsAlive) {
                        var snap = readProgress();
                        if (!string.IsNullOrEmpty(snap)) { try { context.SetVarValue("progress", snap); } catch { } }
                        System.Threading.Thread.Sleep(300);
                    }
                    worker.Join();
                    if (workerError != null) { throw workerError; }
                    var final = readProgress();
                    if (!string.IsNullOrEmpty(final)) { context.SetVarValue("progress", final); }
                    traceInstall("installer-returned");
                    try { if (System.IO.File.Exists(downloaderProgressFile)) System.IO.File.Delete(downloaderProgressFile); } catch { }

                    // 4. Retrieve raw installerResult from A / installer status and pass through strictly
                    var rawInstallerResult = context.GetVarValue<string>("installerResult") ?? "";
                    Newtonsoft.Json.Linq.JObject structured = null;
                    try {
                        if (!string.IsNullOrEmpty(rawInstallerResult)) {
                            structured = Newtonsoft.Json.Linq.JObject.Parse(rawInstallerResult);
                        }
                    } catch { }

                    // Strict protocol verification: A and wrapper share the same build.
                    // Missing, invalid JSON, or missing `ok` field is a protocol violation; fail explicitly without forging ok:true.
                    if (structured == null || structured["ok"] == null) {
                        structured = new Newtonsoft.Json.Linq.JObject();
                        structured["protocolVersion"] = 1;
                        structured["productId"] = "PSFlowBridge";
                        structured["operation"] = string.IsNullOrEmpty(mOp) ? "install" : mOp;
                        structured["ok"] = false;
                        structured["error"] = "protocol_result_invalid: 安装器未输出合规结构化结果";
                        structured["status"] = "failed";
                    } else {
                        if (structured["protocolVersion"] == null) structured["protocolVersion"] = 1;
                        if (structured["productId"] == null) structured["productId"] = "PSFlowBridge";
                        if (structured["operation"] == null) structured["operation"] = string.IsNullOrEmpty(mOp) ? "install" : mOp;
                    }
                    applyIdentity(structured);

                    var isOk = (bool?)structured["ok"] == true;
                    var finalResp = structured.ToString(Newtonsoft.Json.Formatting.None);
                    context.SetVarValue("installerResult", finalResp);
                    context.SetVarValue("response", finalResp);
                    context.SetVarValue("installOk", isOk);
                    context.SetVarValue("cancelled", false);
                } catch (System.Exception ex) {
                    var cur = ex;
                    while (cur.InnerException != null) cur = cur.InnerException;
                    var message = cur.Message;
                    traceInstall("failed: " + message);
                    if (string.IsNullOrEmpty(message)) message = "运行组件准备失败。";
                    var stage = readProgress();
                    string phaseText = "";
                    try {
                        if (!string.IsNullOrEmpty(stage)) {
                            var p = Newtonsoft.Json.Linq.JObject.Parse(stage);
                            phaseText = (string)p["detail"] ?? "";
                        }
                    } catch { }
                    var diag = new Newtonsoft.Json.Linq.JObject();
                    diag["reason"] = message;
                    diag["phase"] = phaseText;
                    diag["progressFile"] = downloaderProgressFile;

                    var rawInstallerResult = context.GetVarValue<string>("installerResult") ?? "";
                    Newtonsoft.Json.Linq.JObject errObj = null;
                    try {
                        if (!string.IsNullOrEmpty(rawInstallerResult)) {
                            errObj = Newtonsoft.Json.Linq.JObject.Parse(rawInstallerResult);
                        }
                    } catch { }

                    if (errObj == null) {
                        errObj = new Newtonsoft.Json.Linq.JObject();
                        errObj["protocolVersion"] = 1;
                        errObj["productId"] = "PSFlowBridge";
                        errObj["operation"] = string.IsNullOrEmpty(mOp) ? "install" : mOp;
                        errObj["ok"] = false;
                        errObj["error"] = message;
                        errObj["diagnostic"] = diag.ToString(Newtonsoft.Json.Formatting.None);
                    } else {
                        if (errObj["protocolVersion"] == null) errObj["protocolVersion"] = 1;
                        if (errObj["productId"] == null) errObj["productId"] = "PSFlowBridge";
                        // If launcher threw an exception, force ok to false regardless of original value, while retaining failed/removed/kept details
                        errObj["ok"] = false;
                        if (errObj["error"] == null) errObj["error"] = message;
                        if (errObj["diagnostic"] == null) errObj["diagnostic"] = diag.ToString(Newtonsoft.Json.Formatting.None);
                    }
                    applyIdentity(errObj);

                    var errStr = errObj.ToString(Newtonsoft.Json.Formatting.None);
                    context.SetVarValue("installerResult", errStr);
                    context.SetVarValue("response", errStr);
                    context.SetVarValue("installOk", false);
                    context.SetVarValue("cancelled", false);
                } finally {
                    // Terminal state must be written even when the embedded launcher throws before
                    // reaching its own reset (invalid mode/op, early failure, or timeout).
                    try { context.SetVarValue("installRunning", false); } catch { }
                    try { context.SetVarValue("installDone", true); } catch { }
                    try { System.Environment.SetEnvironmentVariable("PSFB_INSTALL_PROGRESS_FILE", priorProgressFile); } catch { }
                    try { if (System.IO.File.Exists(downloaderProgressFile)) System.IO.File.Delete(downloaderProgressFile); } catch { }
                }
                return true;
            }
          runOnUiThread: background
  - name: Diagnose
    variables:
      - key: mode
        varType: text
        isInput: true
      - key: response
        varType: text
        isOutput: true
      - key: installOk
        varType: boolean
        isOutput: true
      - key: installerResult
        varType: text
        isOutput: true
        default: ''
    steps:
      - csscript:
          mode: normal_roslyn
          script: |-
            public static object Exec(Quicker.Public.IStepContext context)
            {
                // ============================================================================
                // PSFlowBridge Downloader - Read-only environment diagnosis.
                // Collects install records, service health and mode settings into a copyable
                // Chinese summary. Never modifies files, never starts services.
                // Distinguishes current real-time faults from historical installation log issues.
                // ============================================================================
                var dataRoot = System.IO.Path.Combine(System.Environment.GetFolderPath(System.Environment.SpecialFolder.LocalApplicationData), "PSFlowBridge");
                var report = new Newtonsoft.Json.Linq.JObject();
                System.Func<string, string> tail = file => {
                    try {
                        if (!System.IO.File.Exists(file)) return "";
                        var lines = System.IO.File.ReadAllLines(file);
                        var take = lines.Length > 40 ? 40 : lines.Length;
                        return string.Join("\n", lines, lines.Length - take, take);
                    } catch { return ""; }
                };
                System.Func<string, string> redact = text => {
                    if (string.IsNullOrEmpty(text)) return text;
                    // 1. Bearer tokens with base64 chars +/=
                    text = System.Text.RegularExpressions.Regex.Replace(
                        text,
                        @"\bBearer\s+[A-Za-z0-9_\-\.\+=/]+",
                        "Bearer [REDACTED]",
                        System.Text.RegularExpressions.RegexOptions.IgnoreCase
                    );
                    // 2. Cookie header / log lines (entire rest of line or up to newline/quote)
                    text = System.Text.RegularExpressions.Regex.Replace(
                        text,
                        @"(?i)((?:cookie|set-cookie)\s*:\s*)[^\r\n""]+",
                        "$1[REDACTED]"
                    );
                    // 3. URL query sensitive parameters (?token=..., &access_token=..., etc.)
                    text = System.Text.RegularExpressions.Regex.Replace(
                        text,
                        @"(?i)([?&](?:token|pairingToken|password|passwd|cookie|secret|authorization|accessToken|access_token|refreshToken|refresh_token|apiKey|api_key|key)=)[^&\s""']*",
                        "$1[REDACTED]"
                    );
                    // 4. Quoted sensitive key-values (allowing spaces inside quotes)
                    text = System.Text.RegularExpressions.Regex.Replace(
                        text,
                        @"(?i)((?:\""|""|'|&quot;|\b)(?:token|pairingToken|password|passwd|cookie|secret|authorization|accessToken|access_token|refreshToken|refresh_token|apiKey|api_key)(?:\""|""|'|&quot;)?\s*[:=]\s*(?:\""|""|'|&quot;))(?!\\[REDACTED\\])[^""'\r\n]+?((?:\""|""|'|&quot;))",
                        "$1[REDACTED]$2"
                    );
                    // 5. Unquoted sensitive key-values (no spaces)
                    text = System.Text.RegularExpressions.Regex.Replace(
                        text,
                        @"(?i)((?:\""|""|'|&quot;|\b)(?:token|pairingToken|password|passwd|cookie|secret|authorization|accessToken|access_token|refreshToken|refresh_token|apiKey|api_key)(?:\""|""|'|&quot;)?\s*[:=]\s*)(?!\\[REDACTED\\])[^""'\&\s,;}\[\]]+",
                        "$1[REDACTED]"
                    );
                    return text;
                };

                System.Action<Newtonsoft.Json.Linq.JToken> redactToken = null;
                redactToken = tok => {
                    if (tok == null) return;
                    if (tok is Newtonsoft.Json.Linq.JObject obj) {
                        var sensitiveKeyRegex = new System.Text.RegularExpressions.Regex(
                            @"^(?:token|pairingToken|password|passwd|cookie|secret|authorization|accessToken|access_token|refreshToken|refresh_token|apiKey|api_key)$",
                            System.Text.RegularExpressions.RegexOptions.IgnoreCase
                        );
                        foreach (var prop in obj.Properties().ToList()) {
                            if (sensitiveKeyRegex.IsMatch(prop.Name)) {
                                prop.Value = new Newtonsoft.Json.Linq.JValue("[REDACTED]");
                            } else {
                                redactToken(prop.Value);
                            }
                        }
                    } else if (tok is Newtonsoft.Json.Linq.JArray arr) {
                        foreach (var item in arr) {
                            redactToken(item);
                        }
                    } else if (tok is Newtonsoft.Json.Linq.JValue val) {
                        if (val.Type == Newtonsoft.Json.Linq.JTokenType.String) {
                            var raw = (string)val.Value;
                            if (!string.IsNullOrEmpty(raw)) {
                                val.Value = redact(raw);
                            }
                        }
                    }
                };

                System.Func<string, string, Newtonsoft.Json.Linq.JObject> probe = (url, probeType) => {
                    try {
                        var request = (System.Net.HttpWebRequest)System.Net.WebRequest.Create(url);
                        request.Proxy = null; request.Timeout = 2000; request.ReadWriteTimeout = 2000;
                        if (probeType == "helper") {
                            var configFile = System.IO.Path.Combine(dataRoot, "config.json");
                            if (System.IO.File.Exists(configFile)) {
                                try {
                                    var token = (string)Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(configFile))["pairingToken"];
                                    if (!string.IsNullOrEmpty(token)) request.Headers["Authorization"] = "Bearer " + token;
                                } catch { }
                            }
                        }
                        using (var response = (System.Net.HttpWebResponse)request.GetResponse())
                        using (var reader = new System.IO.StreamReader(response.GetResponseStream(), System.Text.Encoding.UTF8))
                        {
                            var obj = Newtonsoft.Json.Linq.JObject.Parse(reader.ReadToEnd());
                            var res = new Newtonsoft.Json.Linq.JObject { ["status"] = (int)response.StatusCode };
                            if (probeType == "helper") {
                                var ok = (bool?)obj["ok"] == true && (string)obj["app"] == "PSFlowBridge";
                                res["ok"] = ok;
                                if (obj["app"] != null) res["app"] = (string)obj["app"];
                                if (obj["version"] != null) res["version"] = (string)obj["version"];
                                if (obj["busy"] != null) res["busy"] = (bool?)obj["busy"];
                                if (obj["activeTasks"] != null) res["activeTasks"] = (int?)obj["activeTasks"];
                                if (obj["effectiveMode"] != null) res["effectiveMode"] = (string)obj["effectiveMode"];
                            } else if (probeType == "backend") {
                                var ok = (string)obj["status"] == "ok" && (string)obj["app"] == "PSFlowBridge-FlowAPI";
                                res["ok"] = ok;
                                if (obj["app"] != null) res["app"] = (string)obj["app"];
                                if (obj["status"] != null) res["serviceStatus"] = (string)obj["status"];
                                if (obj["version"] != null) res["version"] = (string)obj["version"];
                                if (obj["activeTasks"] != null) res["activeTasks"] = (int?)obj["activeTasks"];
                            } else {
                                res["ok"] = true;
                            }
                            return res;
                        }
                    } catch (System.Net.WebException error) {
                        var item = new Newtonsoft.Json.Linq.JObject { ["ok"] = false };
                        var httpResp = error.Response as System.Net.HttpWebResponse;
                        if (httpResp != null) {
                            item["status"] = (int)httpResp.StatusCode;
                            try {
                                using (var reader = new System.IO.StreamReader(httpResp.GetResponseStream(), System.Text.Encoding.UTF8)) {
                                    var bodyText = reader.ReadToEnd();
                                    if (!string.IsNullOrEmpty(bodyText)) {
                                        try {
                                            var parsed = Newtonsoft.Json.Linq.JObject.Parse(bodyText);
                                            if (parsed["error"] != null) item["error"] = redact((string)parsed["error"]);
                                        } catch {
                                            var safe = redact(bodyText.Length > 200 ? bodyText.Substring(0, 200) : bodyText);
                                            item["error"] = safe;
                                        }
                                    }
                                }
                            } catch { }
                        } else {
                            item["error"] = redact(error.Message);
                        }
                        return item;
                    } catch (System.Exception error) {
                        return new Newtonsoft.Json.Linq.JObject { ["ok"] = false, ["error"] = redact(error.Message) };
                    }
                };

                report["dataRoot"] = dataRoot;
                report["installerResult"] = tail(System.IO.Path.Combine(dataRoot, "installer-result.json"));
                report["installerLogTail"] = tail(System.IO.Path.Combine(dataRoot, "installer-last.log"));
                var logsDir = System.IO.Path.Combine(dataRoot, "logs");
                var latestBootstrap = "";
                try {
                    if (System.IO.Directory.Exists(logsDir)) {
                        var newest = System.IO.Directory.GetFiles(logsDir, "bootstrap-status-*.json")
                            .OrderByDescending(System.IO.File.GetLastWriteTimeUtc).FirstOrDefault();
                        if (newest != null) { latestBootstrap = newest; report["bootstrapStatus"] = tail(newest); }
                    }
                } catch { }
                report["helperLogTail"] = tail(System.IO.Path.Combine(logsDir, "helper.log"));
                report["helperHealth"] = probe("http://127.0.0.1:47831/api/health", "helper");
                report["backendHealth"] = probe("http://127.0.0.1:8787/health", "backend");
                try {
                    var modeFile = System.IO.Path.Combine(dataRoot, "mode.json");
                    report["mode"] = System.IO.File.Exists(modeFile) ? Newtonsoft.Json.Linq.JObject.Parse(System.IO.File.ReadAllText(modeFile))["mode"] : null;
                } catch { report["mode"] = null; }
                try {
                    var pointer = System.IO.Path.Combine(dataRoot, "apps", "current");
                    report["currentBuild"] = System.IO.File.Exists(pointer) ? System.IO.File.ReadAllText(pointer).Trim() : null;
                } catch { report["currentBuild"] = null; }

                // Separate current faults from historical log issues (Requirement 10)
                var currentFaults = new Newtonsoft.Json.Linq.JArray();
                var historicalIssues = new Newtonsoft.Json.Linq.JArray();
                var helper = report["helperHealth"] as Newtonsoft.Json.Linq.JObject;
                var backend = report["backendHealth"] as Newtonsoft.Json.Linq.JObject;

                if (helper != null && (bool?)helper["ok"] != true) {
                    var status = (int?)helper["status"];
                    if (status == 401) currentFaults.Add("本地助手在运行但配对码不匹配：请关闭所有 PS Flow 窗口后重开动作。");
                    else if (status != null && status != 200) currentFaults.Add("本地助手返回异常状态 " + status + "：请重开 PS Flow 动作。");
                    else if (helper["app"] != null && (string)helper["app"] != "PSFlowBridge") currentFaults.Add("端口 47831 被非 PS Flow 服务占用：请排查占用端口的程序。");
                    else currentFaults.Add("本地助手未运行或端口无响应：请重开 PS Flow 动作启动助手。");
                }

                var modeValue = report["mode"] == null ? "" : (string)report["mode"];
                if (modeValue == "local") {
                    if (backend == null || (bool?)backend["ok"] != true) {
                        if (backend != null && backend["app"] != null && (string)backend["app"] != "PSFlowBridge-FlowAPI") {
                            currentFaults.Add("8787 端口被其它非 FlowAPI 服务占用：请排查占用端口的程序。");
                        } else {
                            currentFaults.Add("运行方式为本地后端，但 8787 后端服务未就绪：请重开动作，或在面板运行方式里切回内置浏览器。");
                        }
                    }
                }

                var installerText = (string)report["installerResult"];
                if (!string.IsNullOrEmpty(installerText)) {
                    if (installerText.Contains("download_unconfigured") || installerText.Contains("download_failed")) historicalIssues.Add("组件下载失败或云端地址未配置：请使用同版「测试 PS Flow 下载包」动作重试，或改用完整离线包。");
                    if (installerText.Contains("artifact_corrupt")) historicalIssues.Add("组件包校验失败：下载缓存可能损坏，请在下载动作里删除已装组件后重装。");
                    if (installerText.Contains("local_runtime_busy")) historicalIssues.Add("8787 端口已被其他服务或旧版 Python 后端占用（非当前安装目录）：若有其他冲突服务在运行请先退出；若无法调整占用服务，建议在 PS Flow 面板运行方式直接切换为「内置浏览器模式」，完全无需使用 8787 端口。");
                    if (installerText.Contains("startup_timeout")) historicalIssues.Add("助手启动超时：查看下方 helper 日志尾部后重开动作。");
                }

                var combinedCauses = new Newtonsoft.Json.Linq.JArray();
                foreach (var f in currentFaults) combinedCauses.Add(f);
                if (combinedCauses.Count == 0) {
                    foreach (var h in historicalIssues) combinedCauses.Add("[历史记录] " + h);
                }
                if (combinedCauses.Count == 0) combinedCauses.Add("未发现明确故障：服务与安装记录看起来正常，如仍异常请复制本诊断发给协助者。");

                report["currentFaults"] = currentFaults;
                report["historicalIssues"] = historicalIssues;
                report["likelyCauses"] = combinedCauses;
                redactToken(report);
                var finalReport = report;
                context.SetVarValue("response", new Newtonsoft.Json.Linq.JObject { ["ok"] = true, ["diagnose"] = true, ["diagnostic"] = finalReport }.ToString(Newtonsoft.Json.Formatting.None));
                context.SetVarValue("installOk", true);
                return true;
            }
          runOnUiThread: background
